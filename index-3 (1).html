          '<i class="' + tc + '">' + dog.tickets + '</i>' +
          (exp ? '<span class="exp-badge ' + exp.cls + '">' + esc(exp.text) + '</span>' : '') +
        '</button>' +
        days.map((day) => weekCell(dog, day)).join('') +
        todayAction(dog, days) +
      '</div>';
  }

  /* ---------------- 전체 검색 결과 ---------------- */
  function searchView(q) {
    const all = searchDogs(q);
    const LIMIT = 60;
    const list = all.slice(0, LIMIT);
    return '' +
      '<div class="sec-title">검색 결과 <span class="num">' + all.length + '명</span>' +
        '<span class="sh-tip">전체 ' + M.dogs.length + '명에서 찾음</span>' +
      '</div>' +
      (list.length
        ? '<div class="s-list">' + list.map(searchRow).join('') + '</div>' +
          (all.length > LIMIT ? '<p class="mini">' + all.length + '명 중 ' + LIMIT + '명만 보여요. 검색어를 더 넣어 주세요.</p>' : '')
        : '<div class="empty"><div class="big">🐾</div><b>"' + esc(q) + '" 검색 결과가 없어요</b>' +
          '<p>이름·품종·보호자·연락처로 찾을 수 있어요.</p></div>');
  }

  function searchRow(dog) {
    const st = M.statusOf(dog);
    const tc = ticketCls(dog);
    const bits = [dog.breed, dog.guardian, dog.phone ? M.phonePretty(dog.phone) : ''].filter(Boolean).join(' · ');
    const tag = st.key === 'out' ? '<span class="s-tag done">하원</span>'
      : st.key === 'in' ? '<span class="s-tag in">등원중</span>' : '';
    let act;
    if (st.key === 'in') act = '<button class="s-act act-out" type="button" data-action="checkout">하원</button>';
    else if (st.key === 'out') act = '<button class="s-act act-done" type="button" disabled>완료</button>';
    else if (dog.tickets <= 0) act = '<button class="s-act act-charge" type="button" data-action="charge">충전</button>';
    else act = '<button class="s-act act-in" type="button" data-action="checkin">등원</button>';

    const exp = M.expiryInfo(dog);
    return '' +
      '<div class="s-row' + (tc ? ' ' + tc : '') + '" data-id="' + dog.id + '">' +
        '<button class="s-main" type="button" data-action="detail">' +
          '<b>' + (dog.emoji || '🐶') + ' ' + esc(dog.name || '(이름 없음)') + tag + '</b>' +
          '<span>' + esc(bits || '보호자 정보 없음') + '</span>' +
        '</button>' +
        '<div class="s-right">' + (exp ? '<span class="exp-badge ' + exp.cls + '">' + esc(exp.text) + '</span>' : '') + '<i class="s-tk ' + tc + '">' + dog.tickets + '회</i>' + act + '</div>' +
      '</div>';
  }

  /* ---------------- 렌더 ---------------- */
  function render() {
    const el = $('#view-attendance');
    if (!el) return;
    const q = String(M.ui.dogQuery || '').trim();

    el.innerHTML = searchBar() + (q ? searchView(q) : weekCard()) + '<div style="height:24px"></div>';

    const search = $('#dog-search', el);
    if (search) {
      search.addEventListener('input', M.debounce(() => {
        M.ui.dogQuery = search.value;
        render();
        const s2 = $('#dog-search');
        if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }
      }, 160));
    }
  }

  function bind(root) {
    root.addEventListener('click', (ev) => {
      const wk = ev.target.closest('[data-week]');
      if (wk) {
        M.vibrate(8);
        if (wk.dataset.week === 'now') M.ui.weekOffset = 0;
        else M.ui.weekOffset = (M.ui.weekOffset || 0) + parseInt(wk.dataset.week, 10);
        render();
        return;
      }
      const pill = ev.target.closest('[data-filter]');
      if (pill) {
        M.ui.dogFilter = pill.dataset.filter;
        render();
        return;
      }
      const cellBtn = ev.target.closest('[data-day]');
      if (cellBtn) {
        const row = cellBtn.closest('[data-id]');
        const dog = row ? M.dogById(row.dataset.id) : null;
        if (dog) openDay(dog, cellBtn.dataset.day);
        return;
      }
      const act = ev.target.closest('[data-action]');
      if (!act) return;
      if (act.dataset.action === 'clear-search') { M.ui.dogQuery = ''; render(); return; }
      if (act.dataset.action === 'add-dog') { M.openDogEditor(null); return; }

      const card = act.closest('[data-id]');
      const dog = card ? M.dogById(card.dataset.id) : null;
      if (!dog) return;
      const action = act.dataset.action;

      if (action === 'checkin') onCheckIn(dog);
      else if (action === 'checkout') onCheckOut(dog);
      else if (action === 'charge') openCharge(dog);
      else if (action === 'detail') openDetail(dog);
      else if (action === 'sendlink') openSendLink(dog);
    });
  }

  /* ---------------- 하루 기록 보기 ---------------- */
  function openDay(dog, key) {
    const st = dayState(dog, key);
    if (!st) return;
    const d = new Date(key + 'T00:00:00');
    const rows = st.ins.map((e) => ({ e, t: 'in' })).concat(st.outs.map((e) => ({ e, t: 'out' })))
      .sort((a, b) => new Date(a.e.at) - new Date(b.e.at));

    const html = '' +
      '<h3>' + (dog.emoji || '🐶') + ' ' + esc(dog.name) + '</h3>' +
      '<p class="sheet-desc">' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + M.weekdayKR(d) + ') · ' + esc(st.label) + '</p>' +
      '<div class="log-list" style="max-height:none">' +
        rows.map((r) => '<div class="log' + (r.t === 'out' ? ' minus' : '') + '">' +
          '<span class="dot"></span>' + (r.t === 'in' ? '등원 (-1회)' : '하원') +
          '<span class="when">' + M.fmtTime(r.e.at) + '</span></div>').join('') +
      '</div>' +
      '<div class="sheet-actions" style="margin-top:14px">' +
        '<button class="btn btn--ghost" data-day-act="detail">상세</button>' +
        '<button class="btn btn--primary" data-day-act="close">닫기</button>' +
      '</div>';

    const sheet = M.openSheet(html);
    sheet.body.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-day-act]');
      if (!b) return;
      if (b.dataset.dayAct === 'close') sheet.close();
      if (b.dataset.dayAct === 'detail') { sheet.close(); setTimeout(() => openDetail(dog), 240); }
    });
  }

  /* ---------------- 등원 ---------------- */
  function onCheckIn(dog) {
    if (dog.tickets <= 0) {
      M.openSheet(
        '<h3>' + esc(dog.name) + ' 횟수권이 0회예요</h3>' +
        '<p class="sheet-desc">등원하면 <b>-1회</b>가 되어 마이너스로 내려갑니다. 충전하고 처리하는 게 좋아요.</p>' +
        '<div class="sheet-actions">' +
          '<button class="btn btn--ghost" data-act="cancel">닫기</button>' +
          '<button class="btn btn--soft" data-act="force">그래도 등원</button>' +
          '<button class="btn btn--primary" data-act="charge">충전하기</button>' +
        '</div>'
      ).body.addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-act]');
        if (!b) return;
        if (b.dataset.act === 'charge') { M.closeSheet(); setTimeout(() => openCharge(dog), 260); }
        if (b.dataset.act === 'force') { M.closeSheet(); doCheckIn(dog); }
        if (b.dataset.act === 'cancel') { M.closeSheet(); }
      });
      return;
    }
    doCheckIn(dog);
  }

  function doCheckIn(dog) {
    M.vibrate(14);
    const entry = M.checkIn(dog);
    showResult(dog, 'in', entry);
    M.toast(dog.name + ' 등원 처리 · 남은 ' + dog.tickets + '회', {
      tone: 'ok', duration: 6000, action: '실행 취소',
      onAction: () => { M.undoTicket(dog, entry.id); M.toast('등원 기록을 되돌렸어요'); render(); }
    });
    render();
    if (M.settings.autoOpenSms) setTimeout(() => launchSms(dog, 'in'), 260);
  }

  /* ---------------- 하원 ---------------- */
  function onCheckOut(dog) {
    const ins = M.todayIn(dog);
    if (!ins.length) {
      M.openSheet(
        '<h3>' + esc(M.josa(dog.name, '은', '는')) + ' 오늘 등원 기록이 없어요</h3>' +
        '<p class="sheet-desc">그래도 하원으로 기록할까요? 횟수권은 차감되지 않습니다.</p>' +
        '<div class="sheet-actions">' +
          '<button class="btn btn--ghost" data-act="cancel">닫기</button>' +
          '<button class="btn btn--primary" data-act="ok">하원 기록</button>' +
        '</div>'
      ).body.addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-act]');
        if (!b) return;
        if (b.dataset.act === 'ok') doCheckOut(dog);
        if (b.dataset.act === 'cancel') M.closeSheet();
      });
      return;
    }
    doCheckOut(dog);
  }

  function doCheckOut(dog) {
    M.vibrate(14);
    const entry = M.checkOut(dog);
    showResult(dog, 'out', entry);
    M.toast(dog.name + ' 하원 처리 (' + M.fmtTime(entry.at) + ')', {
      tone: 'ok', duration: 6000, action: '실행 취소',
      onAction: () => { M.undoTicket(dog, entry.id); M.toast('하원 기록을 되돌렸어요'); render(); }
    });
    render();
    if (M.settings.autoOpenSms) setTimeout(() => launchSms(dog, 'out'), 260);
  }

  /* ---------------- 결과 시트 + 문자 ---------------- */
  function showResult(dog, kind, entry) {
    const body = M.smsBody(dog, kind);
    const title = kind === 'in' ? '등원 완료' : '하원 완료';
    const emoji = kind === 'in' ? '🏫' : '🎉';
    const remainLine = kind === 'in'
      ? '<div class="bubble-meta"><span>남은 횟수권</span><b>' + dog.tickets + '회</b></div>'
      : '<div class="bubble-meta"><span>하원 시각</span><b>' + M.fmtTime(entry.at) + '</b></div>';

    const html = '' +
      '<h3>' + emoji + ' ' + esc(dog.name) + ' ' + title + '</h3>' +
      '<p class="sheet-desc">' + M.fmtTime(entry.at) + ' 기록됨' +
        (kind === 'in' ? ' · 횟수권 -1회' : ' · 횟수권 차감 없음') +
        (dog.phone ? ' · ' + esc(M.phonePretty(dog.phone)) : '') + '</p>' +
      '<div class="bubble">' + esc(body) + '</div>' +
      remainLine +
      '<div class="sheet-actions">' +
        '<button class="btn btn--ghost" data-act="copy">문구 복사</button>' +
        (dog.phone
          ? '<button class="btn btn--primary" data-act="sms" style="flex:1.4">📩 문자 보내기</button>'
          : '<button class="btn btn--ghost" data-act="nolink" style="flex:1.4">연락처 없음</button>') +
      '</div>' +
      '<div class="sheet-actions" style="margin-top:8px">' +
        '<button class="btn btn--ghost btn--sm" data-act="undo" style="flex:1">실행 취소</button>' +
        '<button class="btn btn--ghost btn--sm" data-act="close" style="flex:1">닫기</button>' +
      '</div>' +
      '<p class="mini" style="text-align:center">문자앱이 열리면 그대로 전송만 눌러주세요 (요금 0원, 내 폰 문자요금제 사용)</p>';

    const sheet = M.openSheet(html);
    sheet.body.addEventListener('click', async (ev) => {
      const b = ev.target.closest('[data-act]');
      if (!b) return;
      const a = b.dataset.act;
      if (a === 'sms') launchSms(dog, kind);
      if (a === 'copy') {
        const ok = await M.copyText(body);
        M.toast(ok ? '문구를 복사했어요' : '복사가 안 돼요. 길게 눌러 선택해 주세요.', { tone: ok ? 'ok' : 'warn' });
      }
      if (a === 'undo') {
        M.undoTicket(dog, entry.id);
        sheet.close();
        render();
        M.toast('방금 기록을 되돌렸어요');
      }
      if (a === 'close') sheet.close();
      if (a === 'nolink') M.toast('연락처를 먼저 넣어주세요', { tone: 'warn' });
    });
  }

  function launchSms(dog, kind) {
    if (!dog.phone) { M.toast('연락처가 없어 문자를 열 수 없어요', { tone: 'warn' }); return; }
    const href = M.smsHref(dog.phone, M.smsBody(dog, kind));
    M.copyText(M.smsBody(dog, kind));
    try {
      window.location.href = href;
    } catch (e) {
      M.toast('문자앱을 열 수 없어요. 문구를 복사했으니 붙여넣어 주세요.', { tone: 'warn' });
    }
  }

  /* ---------------- 충전 ---------------- */
  function openCharge(dog) {
    const defExp = M.addMonthsISO(M.todayKey(), 1);
    const html = '' +
      '<h3>🎫 ' + esc(dog.name) + ' 횟수권 충전</h3>' +
      '<p class="sheet-desc">지금 <b>' + dog.tickets + '회</b> 남았어요. 충전할 횟수와 유효기간(기본 1개월)을 확인해 주세요.</p>' +
      '<div class="amt-pick" style="grid-template-columns:repeat(4,1fr)">' +
        '<button data-amt="5">+5<small>5회</small></button>' +
        '<button data-amt="8">+8<small>8회</small></button>' +
        '<button data-amt="10">+10<small>10회</small></button>' +
        '<button data-amt="20">+20<small>20회</small></button>' +
      '</div>' +
      '<div class="rowline" style="align-items:center;gap:6px">' +
        '<span style="font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap">유효기간</span>' +
        '<input class="input" id="charge-expires" type="date" value="' + esc(defExp) + '" style="flex:1">' +
        '<button class="btn btn--ghost btn--sm" type="button" data-exp="1m" style="white-space:nowrap">1개월</button>' +
        '<button class="btn btn--ghost btn--sm" type="button" data-exp="none" style="white-space:nowrap">없음</button>' +
      '</div>' +
      '<div class="rowline">' +
        '<input class="input" id="charge-input" type="number" inputmode="numeric" placeholder="직접 입력 (회)" min="1" step="1">' +
        '<button class="btn btn--primary" data-act="custom" style="flex:0 0 88px">충전</button>' +
      '</div>' +
      '<div class="rowline">' +
        '<input class="input" id="charge-memo" type="text" placeholder="메모 (선택) 예: 8회권 결제" maxlength="40">' +
      '</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn--ghost" data-act="close">닫기</button>' +
      '</div>';

    const sheet = M.openSheet(html);
    const finish = (n) => {
      const memo = ($('#charge-memo', sheet.body) || {}).value || '';
      const expVal = ($('#charge-expires', sheet.body) || {}).value || '';
      const e = M.charge(dog, n, memo, expVal);
      if (!e) { M.toast('충전할 횟수를 입력해 주세요', { tone: 'warn' }); return; }
      M.vibrate(12);
      sheet.close();
      render();
      M.toast(dog.name + ' +' + e.n + '회 충전 · 이제 ' + dog.tickets + '회' + (expVal ? ' (~' + expVal.slice(5).replace('-', '/') + ')' : ''), {
        tone: 'ok', action: '실행 취소',
        onAction: () => { M.undoTicket(dog, e.id); render(); M.toast('충전을 되돌렸어요'); }
      });
    };
    sheet.body.addEventListener('click', (ev) => {
      const expBtn = ev.target.closest('[data-exp]');
      if (expBtn) {
        const el = $('#charge-expires', sheet.body);
        if (el) el.value = expBtn.dataset.exp === '1m' ? M.addMonthsISO(M.todayKey(), 1) : '';
        return;
      }
      const amtBtn = ev.target.closest('[data-amt]');
      if (amtBtn) return finish(parseInt(amtBtn.dataset.amt, 10));
      const b = ev.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'close') sheet.close();
      if (b.dataset.act === 'custom') {
        const v = parseInt(($('#charge-input', sheet.body) || {}).value, 10);
        if (!v || v <= 0) { M.toast('숫자를 입력해 주세요', { tone: 'warn' }); return; }
        finish(v);
      }
    });
  }

  /* ---------------- 상세 ---------------- */
  function openDetail(dog) {
    const log = (dog.log || []).slice().reverse().slice(0, 30).map((e) => {
      const label = e.type === 'in' ? '등원 (-1)' : e.type === 'out' ? '하원' : e.type === 'charge' ? '충전 +' + e.n + (e.memo ? ' · ' + e.memo : '') : e.type;
      return '<div class="log ' + (e.type === 'charge' ? '' : 'minus') + '"><span class="dot"></span>' + esc(label) +
        '<span class="when">' + esc(M.fmtWhen(e.at)) + '</span></div>';
    }).join('') || '<p class="mini">기록이 없어요.</p>';

    const st = M.statusOf(dog);
    const html = '' +
      '<h3>' + (dog.emoji || '🐶') + ' ' + esc(dog.name) + '</h3>' +
      '<p class="sheet-desc">' + esc(dog.breed || '품종 미입력') + ' · ' + esc(st.label) + '</p>' +
      '<dl class="kv">' +
        '<dt>보호자</dt><dd>' + esc(dog.guardian || '-') + '</dd>' +
        '<dt>연락처</dt><dd>' + esc(M.phonePretty(dog.phone) || '-') + '</dd>' +
        '<dt>주소</dt><dd>' + esc(dog.address || '-') + '</dd>' +
        '<dt>동물등록번호</dt><dd>' + esc(dog.regNo || '-') + '</dd>' +
        '<dt>중성화</dt><dd>' + esc(dog.neutered || '-') + '</dd>' +
        '<dt>잔여 횟수권</dt><dd>' + dog.tickets + '회' + (dog.ticketExpires ? ' (유효기간 ' + esc(dog.ticketExpires) + ')' : '') + '</dd>' +
      '</dl>' +
      (dog.note ? '<div class="dog-note" style="margin-top:12px">' + esc(dog.note) + '</div>' : '') +
      '<div class="sec-title" style="margin:16px 4px 6px">최근 기록</div>' +
      '<div class="log-list">' + log + '</div>' +
      '<div class="sheet-actions" style="margin-top:14px">' +
        '<button class="btn btn--ghost" data-act="edit">수정</button>' +
        '<button class="btn btn--soft" data-act="charge">충전</button>' +
        '<button class="btn btn--primary" data-act="close">닫기</button>' +
      '</div>' +
      '<div class="sheet-actions" style="margin-top:8px">' +
        '<button class="btn btn--ghost btn--sm" data-act="sendlink" style="flex:1">📝 동의서 링크</button>' +
        '<button class="btn btn--danger btn--sm" data-act="del" style="flex:1">고객 삭제</button>' +
      '</div>';

    const sheet = M.openSheet(html);
    sheet.body.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'close') sheet.close();
      if (b.dataset.act === 'edit') { sheet.close(); M.openDogEditor(dog); }
      if (b.dataset.act === 'charge') { sheet.close(); setTimeout(() => openCharge(dog), 250); }
      if (b.dataset.act === 'sendlink') { sheet.close(); setTimeout(() => openSendLink(dog), 250); }
      if (b.dataset.act === 'del') {
        if (confirm(dog.name + ' 고객을 삭제할까요?\n출석 기록도 함께 사라집니다.')) {
          M.removeDog(dog.id);
          sheet.close();
          M.toast('삭제했어요');
          render();
        }
      }
    });
  }

  /* ---------------- 동의서 링크 문자로 보내기 ---------------- */
  function openSendLink(dog) {
    if (M.sendConsentSheet) return M.sendConsentSheet('kindergarten', dog);
    const base = M.consentLink('kindergarten', dog);
    const msg = '[멍플] ' + (dog.guardian || '보호자') + '님, ' + dog.name +
      ' 동의서를 모바일로 작성해 주세요 🐾\n' + base;
    const html = '' +
      '<h3>📝 ' + esc(dog.name) + ' 동의서 링크</h3>' +
      '<p class="sheet-desc">아래 링크를 문자로 보내면 보호자가 휴대폰에서 바로 서명할 수 있어요.</p>' +
      '<div class="bubble" style="font-size:12px">' + esc(msg) + '</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn--ghost" data-act="copy">링크 복사</button>' +
        (dog.phone ? '<button class="btn btn--primary" data-act="sms" style="flex:1.4">📩 문자 보내기</button>' : '') +
      '</div>' +
      '<div class="sheet-actions" style="margin-top:8px">' +
        '<button class="btn btn--ghost btn--sm" data-act="close" style="flex:1">닫기</button>' +
      '</div>';
    const sheet = M.openSheet(html);
    sheet.body.addEventListener('click', async (ev) => {
      const b = ev.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'copy') {
        const ok = await M.copyText(msg);
        M.toast(ok ? '링크를 복사했어요' : '복사 실패 — 주소창 링크를 길게 눌러 복사해 주세요', { tone: ok ? 'ok' : 'warn' });
      }
      if (b.dataset.act === 'sms') {
        M.copyText(msg);
        window.location.href = M.smsHref(dog.phone, msg);
      }
      if (b.dataset.act === 'close') sheet.close();
    });
  }

  M.renderAttendance = render;
  M.bindAttendance = bind;
  M.attendanceActions = { openCharge, openDetail, openSendLink, showResult, openDay };
})();
</script>
<script>
/* ===========================================================
   hotel.js — 🏨 호텔·일정 탭
   호텔(체크인~체크아웃) · 미용 · 일일유치원 일정과 미수금(추가결제) 관리
   =========================================================== */
(function () {
  'use strict';
  const M = window.M;
  const $ = M.$, $$ = M.$$, esc = M.esc;

  const CATS = {
    hotel:   { key: 'hotel',   label: '호텔',       emoji: '🏨', cls: 'hotel' },
    groom:   { key: 'groom',   label: '미용',       emoji: '✂️', cls: 'groom' },
    daycare: { key: 'daycare', label: '일일유치원', emoji: '🎒', cls: 'daycare' }
  };
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const MAX_LANES = 4;

  /* ---------------- 작은 유틸 ---------------- */
  const pad = (n) => String(n).padStart(2, '0');
  const won = (n) => comma(n) + '원';
  const comma = (n) => (Math.round(Number(n) || 0)).toLocaleString('ko-KR');
  const digits = (v) => Math.round(Number(String(v == null ? '' : v).replace(/[^0-9-]/g, '')) || 0);

  function dateOf(key) {
    const p = String(key || '').split('-');
    return new Date(Number(p[0]) || 1970, (Number(p[1]) || 1) - 1, Number(p[2]) || 1);
  }
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function diffDays(a, b) { return Math.round((dateOf(b).getTime() - dateOf(a).getTime()) / 86400000); }
  function shiftMonth(ym, n) {
    const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1 + n;
    const d = new Date(y, m, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }
  function monthTitle(ym) { return Number(ym.slice(0, 4)) + '년 ' + Number(ym.slice(5, 7)) + '월'; }
  function validYm(v) { return /^\d{4}-\d{2}$/.test(String(v || '')) ? v : M.todayKey().slice(0, 7); }

  function ui() {
    if (!M.ui.hotel || typeof M.ui.hotel !== 'object') M.ui.hotel = { ym: M.todayKey().slice(0, 7), day: '' };
    M.ui.hotel.ym = validYm(M.ui.hotel.ym);
    if (M.ui.hotel.day && !/^\d{4}-\d{2}-\d{2}$/.test(M.ui.hotel.day)) M.ui.hotel.day = '';
    return M.ui.hotel;
  }

  /* ---------------- 결제 상태 ---------------- */
  const totalOf = (b) => Math.max(0, Math.round(Number(b.totalAmount) || 0));
  const paidOf = (b) => Math.max(0, Math.round(Number(b.paidAmount) || 0));
  const dueOf = (b) => Math.max(0, totalOf(b) - paidOf(b));

  function payState(b) {
    const t = totalOf(b), p = paidOf(b);
    if (b.paid === true) return 'paid';        // 금액 없이 '결제완료'로 표시한 일정
    if (t <= 0 && p <= 0) return 'unset';   // 금액을 아직 안 적은 일정
    if (t > 0 && p >= t) return 'paid';
    return p > 0 ? 'partial' : 'unpaid';
  }
  const stateLabel = (b) => {
    const st = payState(b);
    return st === 'paid' ? '결제완료' : st === 'unset' ? '금액 미정' : '추가결제 ' + won(dueOf(b));
  };

  /* ---------------- 날짜/일정 표기 ---------------- */
  function nights(b) {
    if ((b.category || 'hotel') !== 'hotel') return 0;
    return Math.max(0, diffDays(b.startDate, b.endDate));
  }
  function mdLabel(key, withYear) {
    const d = dateOf(key);
    return (withYear ? d.getFullYear() + '.' : '') + (d.getMonth() + 1) + '.' + d.getDate() + '(' + DOW[d.getDay()] + ')';
  }
  function dateLabel(b) {
    const thisYear = String(new Date().getFullYear());
    const otherYear = (b.startDate || '').slice(0, 4) !== thisYear;
    const n = nights(b);
    if (!n) return mdLabel(b.startDate, otherYear);
    return mdLabel(b.startDate, otherYear) + ' ~ ' + mdLabel(b.endDate, false) + ' · ' + n + '박';
  }
  function dayHeading(key) {
    const d = dateOf(key);
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')';
  }
  const catOf = (b) => CATS[b.category] || CATS.hotel;
  const dateSort = (a, b) => (a.startDate < b.startDate ? -1 : a.startDate > b.startDate ? 1 :
    (a.endDate || a.startDate) < (b.endDate || b.startDate) ? -1 : 1);

  /* ---------------- 요약 (상단 헤더용) ---------------- */
  function summary() {
    const today = M.todayKey();
    const ym = ui().ym;
    const list = M.bookings || [];
    const inDay = list.filter((b) => b.startDate <= today && today <= (b.endDate || b.startDate));
    const inMonth = list.filter((b) => b.startDate.slice(0, 7) <= ym && ym <= (b.endDate || b.startDate).slice(0, 7));
    const dues = list.filter((b) => dueOf(b) > 0);
    return {
      todayN: inDay.length,
      monthN: inMonth.length,
      dueN: dues.length,
      dueSum: dues.reduce((a, b) => a + dueOf(b), 0)
    };
  }

  /* ---------------- 달력 ---------------- */
  function monthWeeks(ym) {
    const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1;
    const first = new Date(y, m, 1);
    const start = addDays(first, -first.getDay());
    const weeks = [];
    for (let w = 0; w < 6; w++) {
      const days = [];
      for (let i = 0; i < 7; i++) days.push(keyOf(addDays(start, w * 7 + i)));
      weeks.push(days);
    }
    // 마지막 주가 통째로 다음 달이면 접는다 (5주 달력이 깔끔)
    while (weeks.length > 4 && weeks[weeks.length - 1][0].slice(0, 7) > ym) weeks.pop();
    return weeks;
  }

  function weekHtml(days, ym, today, sel) {
    const cells = days.map((k, i) => {
      const d = dateOf(k);
      const cls = 'cal-d' +
        (k.slice(0, 7) !== ym ? ' out' : '') +
        (k === today ? ' today' : '') +
        (k === sel ? ' sel' : '') +
        (d.getDay() === 0 ? ' sun' : d.getDay() === 6 ? ' sat' : '');
      return '<button type="button" class="' + cls + '" data-day="' + k + '" style="grid-column:' + (i + 1) + ';grid-row:1">' +
        '<span class="n">' + d.getDate() + '</span></button>';
    }).join('');

    const first = days[0], last = days[6];
    const segs = [];
    (M.bookings || []).forEach((b) => {
      const s = b.startDate, e = b.endDate || b.startDate;
      if (!s || e < first || s > last) return;
      const si = Math.max(0, Math.min(6, diffDays(first, s)));
      const ei = Math.max(0, Math.min(6, diffDays(first, e)));
      if (ei < si) return;
      segs.push({ b, si, ei, st: payState(b) });
    });
    segs.sort((x, y) => (x.si - y.si) || ((y.ei - y.si) - (x.ei - x.si)));

    const lanes = [];
    segs.forEach((sg) => {
      let lane = 0;
      for (; lane < lanes.length; lane++) {
        if (!lanes[lane].some((o) => !(sg.ei < o.si || sg.si > o.ei))) break;
      }
      if (lane === lanes.length) lanes.push([]);
      lanes[lane].push(sg);
      sg.lane = lane;
    });

    const bars = segs.filter((sg) => sg.lane < MAX_LANES).map((sg) => {
      const c = catOf(sg.b);
      const cls = sg.st === 'paid' ? 'paid' : sg.st === 'unset' ? 'unset' : 'due';
      const cutL = sg.si === 0 && sg.b.startDate < first ? ' cut-l' : '';
      const cutR = sg.ei === 6 && (sg.b.endDate || sg.b.startDate) > last ? ' cut-r' : '';
      return '<button type="button" class="cal-bar ' + cls + cutL + cutR + '" data-bk="' + sg.b.id + '" ' +
        'style="grid-column:' + (sg.si + 1) + ' / span ' + (sg.ei - sg.si + 1) + ';grid-row:' + (sg.lane + 2) + '" ' +
        'title="' + esc(sg.b.dogName + ' · ' + c.label + ' · ' + stateLabel(sg.b)) + '">' +
        '<span class="bi">' + c.emoji + '</span><span class="bt">' + esc(sg.b.dogName || '이름 없음') + '</span></button>';
    }).join('');

    const hidden = segs.filter((sg) => sg.lane >= MAX_LANES).length;
    return '<div class="cal-wk">' + cells + bars +
      (hidden ? '<div class="cal-plus" style="grid-column:1 / -1;grid-row:' + (MAX_LANES + 2) + '">+' + hidden + '개 더</div>' : '') +
      '</div>';
  }

  /* ---------------- 미수금 알림 ---------------- */
  function dueBoxHtml(dues, unsetN) {
    if (!dues.length) {
      return '<div class="due-box due-box--clear">' +
        '<div class="due-head"><span class="db-ico">✓</span><b>미수금 없음</b>' +
          (unsetN ? '<span class="db-sum">금액 미정 ' + unsetN + '건</span>' : '') + '</div>' +
        '<div class="due-note">추가결제할 일정이 없어요. 다른 달 일정까지 모두 확인했어요.</div>' +
      '</div>';
    }
    const sum = dues.reduce((a, b) => a + dueOf(b), 0);
    const rows = dues.map((b) => {
      const c = catOf(b);
      return '<div class="due-row">' +
        '<div class="due-top"><b>' + esc(b.dogName || '이름 없음') + '</b>' +
          '<i class="chip ' + c.cls + '">' + c.label + '</i>' +
          '<span class="due-amt">추가결제 <b>' + won(dueOf(b)) + '</b></span></div>' +
        '<div class="due-sub">' + esc(dateLabel(b)) + '</div>' +
        '<button class="due-btn" type="button" data-pay="' + b.id + '">✅ 결제완료</button>' +
      '</div>';
    }).join('');
    return '<div class="due-box">' +
      '<div class="due-head"><span class="db-ico">💸</span><b>미수금 ' + dues.length + '건</b>' +
        '<span class="db-sum">합계 ' + won(sum) + '</span></div>' +
      '<div class="due-list">' + rows + '</div>' +
      (unsetN ? '<div class="due-note">금액 미정 ' + unsetN + '건 — 달력에서 눌러 금액을 넣어주세요</div>' : '') +
    '</div>';
  }

  /* ---------------- 일정 한 줄 ---------------- */
  function bookingRow(b) {
    const c = catOf(b);
    const st = payState(b);
    return '<button type="button" class="bk-row" data-bk="' + b.id + '">' +
      '<span class="bk-ico ' + c.cls + '">' + c.emoji + '</span>' +
      '<span class="bk-main">' +
        '<b>' + esc(b.dogName || '이름 없음') + ' <span class="chip ' + c.cls + '">' + c.label + '</span></b>' +
        '<span>' + esc(dateLabel(b)) + '</span>' +
        '<span class="bk-pay ' + st + '">' + (st === 'paid' ? '✓ 결제완료' : st === 'unset' ? '금액 미정' : '추가결제 ' + won(dueOf(b))) + '</span>' +
        (b.memo ? '<span class="bk-memo">' + esc(b.memo) + '</span>' : '') +
      '</span>' +
      '<span class="chev">›</span>' +
    '</button>';
  }

  /* ---------------- 화면 ---------------- */
  function render() {
    const el = $('#view-hotel');
    if (!el) return;
    const u = ui();
    const ym = u.ym;
    const today = M.todayKey();
    const all = M.bookings || [];

    const dues = all.filter((b) => dueOf(b) > 0).sort(dateSort);
    const unset = all.filter((b) => payState(b) === 'unset');
    const monthList = all.filter((b) => b.startDate.slice(0, 7) <= ym && ym <= (b.endDate || b.startDate).slice(0, 7));
    const counts = { hotel: 0, groom: 0, daycare: 0 };
    monthList.forEach((b) => { counts[catOf(b).key] += 1; });

    const sel = u.day;
    const list = sel
      ? all.filter((b) => b.startDate <= sel && sel <= (b.endDate || b.startDate)).sort(dateSort)
      : monthList.slice().sort(dateSort);

    const grid = monthWeeks(ym).map((days) => weekHtml(days, ym, today, sel)).join('');

    el.innerHTML = '' +
      dueBoxHtml(dues, unset.length) +

      '<div class="cal-card">' +
        '<div class="cal-head">' +
          '<button class="cal-nav" type="button" data-nav="prev" aria-label="이전 달">‹</button>' +
          '<button class="cal-month" type="button" data-act="pick-month">' + monthTitle(ym) + ' <span class="caret">▾</span></button>' +
          '<button class="cal-nav" type="button" data-nav="next" aria-label="다음 달">›</button>' +
          '<button class="cal-today" type="button" data-nav="today">오늘</button>' +
        '</div>' +
        '<div class="cal-dow"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>' +
        '<div class="cal-body">' + grid + '</div>' +
        '<div class="cal-foot">' +
          '<span class="lg"><i class="dot due"></i>추가결제</span>' +
          '<span class="lg"><i class="dot paid"></i>결제완료</span>' +
          '<span class="lg"><i class="dot unset"></i>금액 미정</span>' +
          '<span class="cal-count">호텔 ' + counts.hotel + ' · 미용 ' + counts.groom + ' · 유치원 ' + counts.daycare + '</span>' +
        '</div>' +
      '</div>' +

      '<div class="sec-title" style="margin-top:18px">' +
        (sel ? dayHeading(sel) + ' 일정' : Number(ym.slice(5, 7)) + '월 전체 일정') +
        ' <span class="num">' + list.length + '건</span>' +
        (sel ? '<button class="btn btn--ghost btn--sm" type="button" data-act="clear-day" style="margin-left:auto;flex:0 0 auto" aria-label="이 달 전체 보기">✕</button>' +
                '<button class="btn btn--ghost btn--sm" type="button" data-act="add" style="flex:0 0 auto">＋ 이 날 추가</button>'
             : '<button class="btn btn--ghost btn--sm" type="button" data-act="add" style="margin-left:auto">＋ 일정 추가</button>') +
      '</div>' +
      (list.length
        ? '<div class="bk-list">' + list.map(bookingRow).join('') + '</div>'
        : '<div class="empty"><div class="big">🏨</div><b>' + (sel ? '이 날은 일정이 없어요' : '이 달에는 일정이 없어요') + '</b>' +
            '<p>' + '＋ 일정 추가로 호텔·미용·일일유치원을 등록해 보세요.' + '</p></div>') +
      '<div style="height:90px"></div>' +

      '<button class="fab" type="button" data-act="add" aria-label="일정 추가">＋</button>';
  }

  /* ---------------- 이벤트 ---------------- */
  function bind(root) {
    root.addEventListener('click', (ev) => {
      const nav = ev.target.closest('[data-nav]');
      if (nav) {
        const u = ui();
        const d = nav.dataset.nav;
        if (d === 'prev') u.ym = shiftMonth(u.ym, -1);
        if (d === 'next') u.ym = shiftMonth(u.ym, 1);
        if (d === 'today') { u.ym = M.todayKey().slice(0, 7); u.day = M.todayKey(); }
        if (d !== 'today') u.day = '';
        render();
        return;
      }

      const pay = ev.target.closest('[data-pay]');
      if (pay) {
        ev.stopPropagation();
        payAll(pay.dataset.pay);
        return;
      }

      const dayBtn = ev.target.closest('[data-day]');
      if (dayBtn) {
        const u = ui();
        const k = dayBtn.dataset.day;
        u.day = u.day === k ? '' : k;
        if (k.slice(0, 7) !== u.ym) u.ym = k.slice(0, 7);
        render();
        return;
      }

      const bk = ev.target.closest('[data-bk]');
      if (bk) { openDetail(bk.dataset.bk); return; }

      const act = ev.target.closest('[data-act]');
      if (!act) return;
      if (act.dataset.act === 'add') { openForm(null); return; }
      if (act.dataset.act === 'clear-day') { ui().day = ''; render(); return; }
      if (act.dataset.act === 'pick-month') { openMonthPicker(); return; }
    });
  }

  /* ---------------- 결제완료 ---------------- */
  function payAll(id) {
    const b = M.bookingById(id);
    if (!b) return;
    const before = paidOf(b);
    const r = M.markBookingPaid(id);
    M.vibrate(14);
    render();
    M.toast((b.dogName || '일정') + ' ' + won(totalOf(b)) + ' 결제완료 처리', {
      tone: 'ok', duration: 6000, action: '되돌리기',
      onAction: () => { M.updateBooking(id, { paidAmount: before }); render(); M.toast('결제완료를 되돌렸어요'); }
    });
    return r;
  }

  /* ---------------- 시트 ---------------- */
  // #sheet-body 는 모든 모듈이 함께 쓰는 요소라, 호텔 시트 핸들러는
  // 새로 붙이기 전에 이전 핸들러를 떼어낸다(같은 클릭이 두 번 처리되지 않도록).
  let sheetBound = null;
  function bindSheet(body, handler) {
    if (sheetBound && sheetBound.body === body) {
      try { body.removeEventListener('click', sheetBound.handler); } catch (e) {}
    }
    body.addEventListener('click', handler);
    sheetBound = { body, handler };
  }

  /* ---------------- 달 이동 시트 ---------------- */
  function openMonthPicker() {
    const u = ui();
    let year = Number(u.ym.slice(0, 4));
    const sheet = M.openSheet('<h3>📅 이동할 달</h3><div class="mp-wrap" id="mp-wrap"></div>');
    const paint = () => {
      const cur = u.ym;
      const grid = Array.from({ length: 12 }, (_, i) => {
        const ym = year + '-' + pad(i + 1);
        return '<button type="button" class="mp-m ' + (ym === cur ? 'on' : '') + '" data-ym="' + ym + '">' + (i + 1) + '월</button>';
      }).join('');
      $('#mp-wrap', sheet.body).innerHTML = '' +
        '<div class="mp-year">' +
          '<button type="button" class="cal-nav" data-mp="py">‹</button>' +
          '<b>' + year + '년</b>' +
          '<button type="button" class="cal-nav" data-mp="ny">›</button>' +
        '</div>' +
        '<div class="mp-grid">' + grid + '</div>' +
        '<div class="sheet-actions">' +
          '<button class="btn btn--ghost" type="button" data-mp="close">닫기</button>' +
          '<button class="btn btn--primary" type="button" data-mp="today">이번 달</button>' +
        '</div>';
    };
    paint();
    bindSheet(sheet.body, (ev) => {
      const mv = ev.target.closest('[data-mp]');
      if (mv) {
        const a = mv.dataset.mp;
        if (a === 'py') { year -= 1; paint(); }
        if (a === 'ny') { year += 1; paint(); }
        if (a === 'today') { u.ym = M.todayKey().slice(0, 7); u.day = M.todayKey(); sheet.close(); render(); }
        if (a === 'close') sheet.close();
        return;
      }
      const m = ev.target.closest('[data-ym]');
      if (m) {
        u.ym = m.dataset.ym;
        u.day = '';
        sheet.close();
        render();
      }
    });
  }

  /* ---------------- 일정 추가/수정 시트 ---------------- */
  function openForm(bk, preset) {
    const u = ui();
    const isNew = !bk;
    const seedDay = (preset && preset.startDate) || u.day || M.todayKey();
    const b = bk || {
      dogId: '', dogName: '', guardian: '', phone: '',
      category: (preset && preset.category) || 'hotel',
      startDate: seedDay, endDate: seedDay,
      totalAmount: 0, paidAmount: 0, memo: ''
    };
    let cat = b.category || 'hotel';
    let pickedId = b.dogId || '';
    let paidFlag = b.paid === true;

    const catBtns = ['hotel', 'groom', 'daycare'].map((k) =>
      '<button type="button" data-cat="' + k + '" class="' + (k === cat ? 'on' : '') + '">' + CATS[k].emoji + ' ' + CATS[k].label + '</button>'
    ).join('');

    const sheet = M.openSheet('' +
      '<h3>' + (isNew ? '🏨 일정 추가' : '✏️ 일정 수정') + '</h3>' +
      '<p class="sheet-desc">호텔은 체크인~체크아웃까지 달력에 막대로, 미용·일일유치원은 하루로 표시돼요.</p>' +
      '<div class="field">' +
        '<label>강아지 <span class="req">*</span></label>' +
        '<input class="input" id="bk-dog" placeholder="이름·보호자·연락처로 검색" value="' + esc(b.dogName || '') + '" autocomplete="off">' +
        '<div class="bk-sug" id="bk-sug" hidden></div>' +
        '<p class="hint" id="bk-picked">' + (pickedId ? '고객 명단에서 선택됨' : '명단에 없으면 이름만 적어도 저장돼요') + '</p>' +
      '</div>' +
      '<div class="field"><label>종류</label><div class="seg" id="bk-cat">' + catBtns + '</div></div>' +
      '<div class="two-2">' +
        '<div class="field"><label id="bk-slab">체크인</label><input class="input" id="bk-start" type="date" value="' + b.startDate + '"></div>' +
        '<div class="field" id="bk-endfield"><label>체크아웃</label><input class="input" id="bk-end" type="date" value="' + b.endDate + '"></div>' +
      '</div>' +
      '<div class="two-2">' +
        '<div class="field"><label>총 금액</label><input class="input" id="bk-total" inputmode="numeric" placeholder="0" value="' + (totalOf(b) || '') + '"></div>' +
        '<div class="field"><label>기결제</label><input class="input" id="bk-paid" inputmode="numeric" placeholder="0" value="' + (paidOf(b) || '') + '"></div>' +
      '</div>' +
      '<div class="bk-due" id="bk-due"></div>' +
      '<button type="button" class="bk-paidflag" id="bk-paidflag" aria-pressed="' + (b.paid === true ? 'true' : 'false') + '">' +
        '<span class="pf-box">✓</span>' +
        '<span class="pf-tx"><b>이미 결제완료</b><em>금액을 비워둬도 미수금 0으로 처리</em></span>' +
      '</button>' +
      '<div class="field"><label>메모</label><input class="input" id="bk-memo" maxlength="60" placeholder="예: 픽업비 포함 / 스포츠컷" value="' + esc(b.memo || '') + '"></div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn--ghost" type="button" data-f="cancel">취소</button>' +
        '<button class="btn btn--primary" type="button" data-f="save" style="flex:1.5">저장</button>' +
      '</div>' +
      (isNew ? '' : '<div class="sheet-actions" style="margin-top:8px">' +
        '<button class="btn btn--danger btn--sm" type="button" data-f="del" style="flex:1">일정 삭제</button></div>')
    );

    const val = (id) => { const el = $('#' + id, sheet.body); return el ? String(el.value || '').trim() : ''; };
    const elDog = $('#bk-dog', sheet.body);
    const sugg = $('#bk-sug', sheet.body);

    function syncDue() {
      const t = digits(val('bk-total')), p = digits(val('bk-paid'));
      const box = $('#bk-due', sheet.body);
      const flag = $('#bk-paidflag', sheet.body);
      if (flag) {
        flag.classList.toggle('on', paidFlag);
        flag.setAttribute('aria-pressed', paidFlag ? 'true' : 'false');
      }
      if (!box) return;
      if (paidFlag) {
        box.className = 'bk-due paid';
        box.innerHTML = '✓ 결제완료 ' + (t > 0 ? '<span>' + won(t) + '</span>' : '<span>금액 생략 가능</span>');
        return;
      }
      if (t <= 0 && p <= 0) { box.className = 'bk-due unset'; box.textContent = '금액을 적으면 미수금이 자동으로 계산돼요'; return; }
      const due = Math.max(0, t - p);
      box.className = 'bk-due ' + (due <= 0 ? 'paid' : 'due');
      box.innerHTML = due <= 0
        ? '✓ 결제완료 <span>' + won(t) + '</span>'
        : '추가결제 <b>' + won(due) + '</b> <span>총 ' + won(t) + ' · 기결제 ' + won(p) + '</span>';
    }

    function syncCat() {
      $$('#bk-cat button', sheet.body).forEach((x) => x.classList.toggle('on', x.dataset.cat === cat));
      const endField = $('#bk-endfield', sheet.body);
      const slab = $('#bk-slab', sheet.body);
      if (cat === 'hotel') {
        if (endField) endField.hidden = false;
        if (slab) slab.textContent = '체크인';
      } else {
        if (endField) endField.hidden = true;
        if (slab) slab.textContent = '날짜';
        const s = $('#bk-start', sheet.body), e = $('#bk-end', sheet.body);
        if (s && e) e.value = s.value || M.todayKey();
      }
    }

    function showSug() {
      const q = val('bk-dog').toLowerCase();
      if (!q) { sugg.hidden = true; sugg.innerHTML = ''; return; }
      const list = (M.dogs || []).filter((d) => {
        const hay = [d.name, d.guardian, M.phoneDigits(d.phone)].join(' ').toLowerCase();
        return hay.indexOf(q) >= 0 || (M.phoneDigits(q).length >= 3 && M.phoneDigits(d.phone).indexOf(M.phoneDigits(q)) >= 0);
      }).slice(0, 6);
      if (!list.length) { sugg.hidden = true; sugg.innerHTML = ''; return; }
      sugg.innerHTML = list.map((d) =>
        '<button type="button" class="sug" data-pick="' + d.id + '">' +
          '<span class="sug-av">' + (d.emoji || '🐶') + '</span>' +
          '<span class="sug-t"><b>' + esc(d.name) + '</b>' +
            '<span>' + esc(d.guardian || '-') + (d.phone ? ' · ' + esc(M.phonePretty(d.phone)) : '') + '</span></span>' +
        '</button>'
      ).join('');
      sugg.hidden = false;
    }

    syncCat();
    syncDue();

    elDog.addEventListener('input', () => { pickedId = ''; showSug(); });
    elDog.addEventListener('focus', showSug);
    // 금액 칸은 입력하는 동안 천 단위 쉼표를 넣어 보여준다
    ['bk-total', 'bk-paid'].forEach((id) => {
      const el = $('#' + id, sheet.body);
      if (!el) return;
      if (el.value) el.value = Number(el.value).toLocaleString('ko-KR');
      el.addEventListener('input', () => {
        const v = digits(el.value);
        el.value = v ? v.toLocaleString('ko-KR') : '';
        syncDue();
      });
    });
    $('#bk-start', sheet.body).addEventListener('change', () => {
      if (cat !== 'hotel') { const e = $('#bk-end', sheet.body); if (e) e.value = $('#bk-start', sheet.body).value; return; }
      const s = $('#bk-start', sheet.body).value, e = $('#bk-end', sheet.body);
      if (e && (!e.value || e.value < s)) e.value = s;
    });

    bindSheet(sheet.body, (ev) => {
      const c = ev.target.closest('[data-cat]');
      if (c) { cat = c.dataset.cat; syncCat(); return; }

      if (ev.target.closest('#bk-paidflag')) {
        paidFlag = !paidFlag;
        syncDue();
        return;
      }

      const pick = ev.target.closest('[data-pick]');
      if (pick) {
        const d = M.dogById(pick.dataset.pick);
        if (d) {
          pickedId = d.id;
          elDog.value = d.name || '';
          sugg.hidden = true;
          const hint = $('#bk-picked', sheet.body);
          if (hint) hint.textContent = '선택됨 · ' + (d.guardian || '보호자 미입력') + (d.phone ? ' · ' + M.phonePretty(d.phone) : '');
        }
        return;
      }

      const btn = ev.target.closest('[data-f]');
      if (!btn) return;
      const a = btn.dataset.f;
      if (a === 'cancel') { sheet.close(); return; }
      if (a === 'del') {
        if (confirm((b.dogName || '이 일정') + ' 일정을 삭제할까요?')) {
          M.removeBooking(b.id);
          sheet.close();
          render();
          M.toast('일정을 삭제했어요');
        }
        return;
      }
      if (a === 'save') {
        const name = val('bk-dog');
        if (!name) {
          elDog.classList.add('err');
          M.toast('강아지 이름을 적어주세요', { tone: 'warn' });
          return;
        }
        const start = val('bk-start') || M.todayKey();
        let end = cat === 'hotel' ? (val('bk-end') || start) : start;
        if (end < start) end = start;
        const linkedDog = pickedId ? M.dogById(pickedId) : null;
        const match = (M.dogs || []).find((d) => d.name === name && (!pickedId || d.id === pickedId));
        const patch = {
          dogId: linkedDog ? linkedDog.id : (match ? match.id : ''),
          dogName: name,
          guardian: linkedDog ? (linkedDog.guardian || '') : (match ? (match.guardian || '') : (b.guardian || '')),
          phone: linkedDog ? (linkedDog.phone || '') : (match ? (match.phone || '') : (b.phone || '')),
          category: cat,
          startDate: start,
          endDate: end,
          totalAmount: Math.max(0, digits(val('bk-total'))),
          paidAmount: Math.max(0, digits(val('bk-paid'))),
          paid: paidFlag,
          memo: val('bk-memo')
        };
        if (isNew) M.addBooking(patch);
        else M.updateBooking(b.id, patch);

        ui().ym = start.slice(0, 7);
        ui().day = '';
        sheet.close();
        M.vibrate(12);
        render();
        M.toast((isNew ? '일정을 추가했어요 · ' : '일정을 저장했어요 · ') + name, { tone: 'ok' });
      }
    });
  }

  /* ---------------- 일정 상세 시트 ---------------- */
  function openDetail(id) {
    const b = M.bookingById(id);
    if (!b) return;
    const c = catOf(b);

    function inner() {
      const st = payState(b);
      const t = totalOf(b), p = paidOf(b), due = dueOf(b);
      return '' +
        '<h3>' + c.emoji + ' ' + esc(b.dogName || '이름 없음') + ' <span class="chip ' + c.cls + '">' + c.label + '</span></h3>' +
        '<p class="sheet-desc">' + esc(dateLabel(b)) + (b.guardian && b.guardian !== b.dogName ? ' · ' + esc(b.guardian) : '') + '</p>' +
        '<div class="bk-money">' +
          '<div><span>총 금액</span><b>' + (st === 'unset' ? '—' : won(t)) + '</b></div>' +
          '<div><span>기결제</span><b>' + won(p) + '</b></div>' +
          '<div class="' + (due > 0 ? 'due' : 'paid') + '"><span>추가결제</span><b>' + (st === 'unset' ? '미정' : due > 0 ? won(due) : '0원') + '</b></div>' +
        '</div>' +
        (b.memo ? '<div class="bk-note">' + esc(b.memo) + '</div>' : '') +
        (st === 'paid' ? '<div class="bk-done">✅ 결제완료 처리된 일정이에요</div>' : '') +
        (st !== 'paid'
          ? '<div class="rowline" style="margin-top:12px">' +
              '<input class="input" id="pay-amt" inputmode="numeric" placeholder="추가 결제 금액 (예: ' + comma(due || t) + ')">' +
              '<button class="btn btn--ghost" type="button" data-d="pay-add" style="flex:0 0 84px">반영</button>' +
            '</div>'
          : '') +
        '<div class="sheet-actions" style="margin-top:12px">' +
          '<button class="btn btn--ghost" type="button" data-d="edit">수정</button>' +
          (due > 0
            ? '<button class="btn btn--primary" type="button" data-d="pay-all" style="flex:1.4">✅ 결제완료 처리</button>'
            : '<button class="btn btn--primary" type="button" data-d="close">닫기</button>') +
        '</div>' +
        '<div class="sheet-actions" style="margin-top:8px">' +
          (due > 0 ? '<button class="btn btn--ghost btn--sm" type="button" data-d="close" style="flex:1">닫기</button>' : '') +
          '<button class="btn btn--danger btn--sm" type="button" data-d="del" style="flex:1">일정 삭제</button>' +
        '</div>';
    }

    const sheet = M.openSheet(inner());
    bindSheet(sheet.body, (ev) => {
      const btn = ev.target.closest('[data-d]');
      if (!btn) return;
      const a = btn.dataset.d;
      if (a === 'close') { sheet.close(); return; }
      if (a === 'edit') { sheet.close(); setTimeout(() => openForm(b), 240); return; }
      if (a === 'del') {
        if (confirm((b.dogName || '이 일정') + ' 일정을 삭제할까요?')) {
          M.removeBooking(b.id);
          sheet.close();
          render();
          M.toast('일정을 삭제했어요');
        }
        return;
      }
      if (a === 'pay-all') {
        const before = paidOf(b);
        M.markBookingPaid(b.id);
        M.vibrate(14);
        sheet.body.innerHTML = inner();
        render();
        M.toast((b.dogName || '일정') + ' ' + won(totalOf(b)) + ' 결제완료', {
          tone: 'ok', duration: 6000, action: '되돌리기',
          onAction: () => { M.updateBooking(b.id, { paidAmount: before }); render(); M.toast('결제완료를 되돌렸어요'); }
        });
        return;
      }
      if (a === 'pay-add') {
        const inp = $('#pay-amt', sheet.body);
        const add = digits(inp ? inp.value : '');
        if (!add) { M.toast('결제 금액을 입력해 주세요', { tone: 'warn' }); return; }
        if (add < 0) { M.toast('금액은 0원보다 커야 해요', { tone: 'warn' }); return; }
        if (totalOf(b) <= 0) {
          // 총 금액을 아직 안 적은 일정 — 입력한 금액을 총액으로 잡고 결제완료 처리
          M.updateBooking(b.id, { totalAmount: add, paidAmount: add });
        } else {
          M.payBooking(b.id, add);
        }
        M.vibrate(14);
        sheet.body.innerHTML = inner();
        render();
        M.toast('결제 ' + won(add) + ' 반영 · 남은 ' + won(dueOf(b)), { tone: 'ok' });
      }
    });
  }

  M.renderHotel = render;
  M.bindHotel = bind;
  M.hotelSummary = summary;
  M.hotelActions = { openForm, openDetail, payAll, monthTitle, dateLabel };
})();

      location.search = '?mode=consent&type=' + type + '&preview=1';
      return;
    }
    if (act === 'send') {
      const link = consentLink(type);
      const msg = '[' + (M.settings.storeName || '멍플') + '] 안녕하세요 보호자님, ' + FORMS[type].label +
        '를 모바일로 작성해 주세요 🐾\n' + link;
      const sheet = M.openSheet(
        '<h3>📩 ' + FORMS[type].label + ' 보내기</h3>' +
        '<p class="sheet-desc">문자앱이 열리면 받는 사람을 고르고 전송만 눌러주세요.</p>' +
        '<div class="bubble" style="font-size:12px">' + esc(msg) + '</div>' +
        '<div class="sheet-actions">' +
          '<button class="btn btn--ghost" data-s="copy">문구 복사</button>' +
          '<button class="btn btn--primary" data-s="go" style="flex:1.4">문자앱 열기</button>' +
        '</div>' +
        '<div class="sheet-actions" style="margin-top:8px"><button class="btn btn--ghost btn--sm" data-s="close" style="flex:1">닫기</button></div>'
      );
      sheet.body.addEventListener('click', async (e2) => {
        const x = e2.target.closest('[data-s]');
        if (!x) return;
        if (x.dataset.s === 'copy') { const ok = await M.copyText(msg); M.toast(ok ? '복사했어요' : '복사 실패', { tone: ok ? 'ok' : 'warn' }); }
        if (x.dataset.s === 'go') { M.copyText(msg); window.location.href = 'sms:?body=' + encodeURIComponent(msg); }
        if (x.dataset.s === 'close') sheet.close();
      });
      return;
    }
    if (act === 'pull') {
      b.disabled = true; b.textContent = '가져오는 중…';
      const r = await M.sync.listConsents();
      b.disabled = false; b.textContent = '☁️ 클라우드에서 새 동의서 가져오기';
      if (!r.ok) { M.toast('가져오기 실패: ' + (r.error || '연결 확인'), { tone: 'warn', duration: 6000 }); return; }
      let added = 0;
      r.rows.forEach((rec) => {
        if (!rec || !rec.id) return;
        if (!M.consentById(rec.id)) { M.state.consents.unshift(rec); added++; }
      });
      M.persist();
      M.toast(added ? added + '건 새로 받았어요' : '새로 받은 동의서가 없어요', { tone: 'ok' });
      renderAdmin();
      return;
    }
    if (act === 'open') {
      openRecord(b.dataset.id);
    }
  }

  /* ---------------- 전자서명 패드 ---------------- */
  function initSigPad(wrap, canvas, clearBtn) {
    const ctx = canvas.getContext('2d');
    let strokes = [];
    let current = null;
    let drawing = false;
    let dpr = 1;

    function setup() {
      const rect = wrap.getBoundingClientRect();
      const w = Math.max(rect.width, 200);
      dpr = Math.min(window.devicePixelRatio || 1, 3);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(170 * dpr);
      canvas.style.width = '100%';
      canvas.style.height = '170px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paint();
    }

    function paint() {
      const w = canvas.width / dpr, h = canvas.height / dpr;
      ctx.clearRect(0, 0, w, h);
      ctx.lineWidth = 1.9;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#1E231B';
      strokes.forEach((pts) => {
        if (pts.length < 2) {
          ctx.beginPath();
          ctx.arc(pts[0].x, pts[0].y, 1.3, 0, Math.PI * 2);
          ctx.fillStyle = '#1E231B';
          ctx.fill();
          return;
        }
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length - 1; i++) {
          const mx = (pts[i].x + pts[i + 1].x) / 2;
          const my = (pts[i].y + pts[i + 1].y) / 2;
          ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
        }
        const last = pts[pts.length - 1];
        ctx.lineTo(last.x, last.y);
        ctx.stroke();
      });
    }

    function pos(ev) {
      const r = canvas.getBoundingClientRect();
      return { x: ev.clientX - r.left, y: ev.clientY - r.top };
    }

    canvas.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      canvas.setPointerCapture && canvas.setPointerCapture(ev.pointerId);
      drawing = true;
      current = [pos(ev)];
      strokes.push(current);
      wrap.classList.add('signed');
      paint();
    });
    canvas.addEventListener('pointermove', (ev) => {
      if (!drawing) return;
      ev.preventDefault();
      const p = pos(ev);
      const lastP = current[current.length - 1];
      if (Math.abs(p.x - lastP.x) + Math.abs(p.y - lastP.y) < 0.8) return;
      current.push(p);
      paint();
    });
    const end = () => { drawing = false; current = null; };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    canvas.addEventListener('pointerleave', (ev) => { if (drawing && ev.buttons === 0) end(); });

    if (clearBtn) clearBtn.addEventListener('click', () => {
      strokes = [];
      wrap.classList.remove('signed');
      paint();
    });

    window.addEventListener('resize', M.debounce(setup, 200));
    // 레이아웃 확정 후 한 번 더
    setTimeout(setup, 60);
    setup();

    return {
      isEmpty: () => strokes.length === 0,
      clear: () => { strokes = []; wrap.classList.remove('signed'); paint(); },
      dataURL: () => canvas.toDataURL('image/png'),
      trimmedDataURL: () => trimCanvas(canvas)
    };
  }

  function trimCanvas(canvas) {
    try {
      const w = canvas.width, h = canvas.height;
      const ctx = canvas.getContext('2d');
      const data = ctx.getImageData(0, 0, w, h).data;
      let minX = w, minY = h, maxX = 0, maxY = 0, found = false;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (data[(y * w + x) * 4 + 3] > 12) {
            found = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (!found) return canvas.toDataURL('image/png');
      const pad = Math.round(10 * Math.min(window.devicePixelRatio || 1, 3));
      minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
      maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
      const cw = maxX - minX + 1, ch = maxY - minY + 1;
      const out = document.createElement('canvas');
      out.width = cw; out.height = ch;
      const octx = out.getContext('2d');
      octx.drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
      return out.toDataURL('image/png');
    } catch (e) {
      return canvas.toDataURL('image/png');
    }
  }

  M.FORMS = FORMS;
  M.consentLink = consentLink;
  M.consentMessage = consentMessage;
  M.sendConsentSheet = sendConsentSheet;
  M.renderConsentAdmin = renderAdmin;
  M.bindConsentAdmin = bindAdmin;
  M.renderCustomerConsent = renderCustomer;
  M.printRecord = printRecord;
  M.openConsentRecord = openRecord;
  M.initSigPad = initSigPad;
})();
</script>
<script>
/* ===========================================================
   customers.js — 고객 목록 · 추가/수정 · 엑셀(CSV/XLSX) 가져오기·내보내기
   =========================================================== */
(function () {
  'use strict';
  const M = window.M;
  const $ = M.$, $$ = M.$$, esc = M.esc;

  const FIELDS = [
    { key: 'name', label: '강아지 이름', required: true },
    { key: 'breed', label: '품종' },
    { key: 'guardian', label: '보호자 이름' },
    { key: 'phone', label: '연락처' },
    { key: 'tickets', label: '잔여 횟수권' },
    { key: 'address', label: '주소' },
    { key: 'neutered', label: '중성화' },
    { key: 'regNo', label: '동물등록번호' },
    { key: 'note', label: '메모' }
  ];

  /* ---------------- 서브 탭 (고객 명단 / 서명된 동의서) ---------------- */
  function subTabs(view) {
    return '<div class="sub-tabs">' +
      '<button class="sub-tab ' + (view === 'list' ? 'on' : '') + '" type="button" data-cview="list">고객 명단 <b>' + M.dogs.length + '</b></button>' +
      '<button class="sub-tab ' + (view === 'consent' ? 'on' : '') + '" type="button" data-cview="consent">서명된 동의서 <b>' + M.consents.length + '</b></button>' +
    '</div>';
  }

  /* ---------------- 목록 ---------------- */
  function render() {
    const el = $('#view-customers');
    if (!el) return;
    const view = M.ui.custView === 'consent' ? 'consent' : 'list';
    M.ui.custView = view;
    const head = subTabs(view);

    if (view === 'consent') {
      el.innerHTML = head + '<div id="consent-panel" style="margin-top:14px"></div><div style="height:24px"></div>';
      if (M.renderConsentAdmin) M.renderConsentAdmin();
      return;
    }

    const all = M.dogs;
    const q = M.ui.custQuery.trim().toLowerCase();
    const list = all.filter((d) => {
      if (!q) return true;
      return [d.name, d.guardian, d.phone, d.breed, M.phoneDigits(d.phone)].join(' ').toLowerCase().indexOf(q) >= 0;
    }).sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'));

    el.innerHTML = '' + head +
      '<div style="margin-top:12px">' + (M.ui.parsed ? mappingCard(M.ui.parsed) : importCard()) + '</div>' +
      '<div class="sec-title" style="margin-top:20px">고객 목록 <span class="num">' + all.length + '명</span>' +
        '<button class="btn btn--ghost btn--sm" data-act="add" style="margin-left:auto">＋ 고객 추가</button>' +
      '</div>' +
      '<div class="searchbar" style="margin-top:8px">' +
        '<span class="ic">🔍</span>' +
        '<input id="cust-search" type="search" placeholder="이름·보호자·연락처 검색" value="' + esc(M.ui.custQuery) + '">' +
      '</div>' +
      (list.length
        ? '<div class="dog-list" style="margin-top:12px">' + list.map(rowHtml).join('') + '</div>'
        : '<div class="empty"><div class="big">👥</div><b>' + (all.length ? '검색 결과가 없어요' : '아직 고객이 없어요') + '</b><p>' + (all.length ? '다른 검색어로 찾아보세요.' : '엑셀을 올리거나 직접 추가해 주세요.') + '</p></div>') +
      '<div style="height:24px"></div>';

    const si = $('#cust-search', el);
    if (si) si.addEventListener('input', M.debounce(() => {
      M.ui.custQuery = si.value;
      render();
      const s2 = $('#cust-search');
      if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }
    }, 160));
  }

  function rowHtml(d) {
    const exp = M.expiryInfo(d);
    return '' +
      '<button class="cust-row" data-act="open" data-id="' + d.id + '">' +
        '<span class="av">' + (d.emoji || '🐶') + '</span>' +
        '<span class="nm"><b>' + esc(d.name || '(이름 없음)') + (d.sample ? ' <span class="chip" style="background:#F1EEE4;color:#9A9F92">샘플</span>' : '') + '</b>' +
          '<span>' + esc(d.guardian || '-') + (d.phone ? ' · ' + esc(M.phonePretty(d.phone)) : '') + (exp ? ' · <i class="exp-badge ' + exp.cls + '">' + esc(exp.text) + '</i>' : '') + '</span></span>' +
        '<span class="tk ' + (d.tickets <= 0 ? 'zero' : d.tickets <= (M.settings.lowTicketWarn || 3) ? 'low' : '') + '"><b>' + d.tickets + '</b><span>남음</span></span>' +
      '</button>';
  }

  /* ---------------- 가져오기 카드 ---------------- */
  function importCard() {
    return '' +
      '<div class="card">' +
        '<div class="card-h"><span class="ico">📥</span><h3>엑셀로 고객 가져오기</h3><span class="sub">CSV · XLSX</span></div>' +
        '<div class="drop" id="dropzone">' +
          '<div class="big">📄</div>' +
          '<h4>티피에서 내려받은 고객 파일을 올려주세요</h4>' +
          '<p>엑셀(.xlsx) · CSV(UTF-8/EUC-KR) 모두 됩니다.<br>다음 단계에서 칸을 확인하고 가져옵니다.</p>' +
          '<button class="btn btn--primary btn--sm" data-act="pick" type="button">📂 파일 선택</button>' +
          '<button class="btn btn--ghost btn--sm" data-act="paste" type="button" style="margin-left:6px">📋 표 붙여넣기</button>' +
          '<input type="file" id="file-input" accept=".csv,.xlsx,.xlsm,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>' +
        '</div>' +
        '<p class="mini">가져온 뒤에는 <b>같은 이름+연락처</b>는 중복으로 만들지 않고 횟수권만 맞춰 넣습니다.</p>' +
      '</div>';
  }

  function mappingCard(p) {
    const rowsPreview = p.rows.slice(0, 5);
    return '' +
      '<div class="card">' +
        '<div class="card-h"><span class="ico">🧩</span><h3>칸 맞추기</h3><span class="sub">' + esc(p.fileName || '') + '</span></div>' +
        '<p style="margin-bottom:10px"><b>' + p.rows.length + '줄</b>을 읽었어요. 아래에서 어떤 칸이 무엇인지 확인해 주세요.</p>' +
        '<div class="tablewrap" style="margin-bottom:14px"><table class="tbl"><thead><tr>' +
          p.headers.map((h) => '<th>' + esc(h) + '</th>').join('') +
        '</tr></thead><tbody>' +
          rowsPreview.map((r) => '<tr>' + r.map((c) => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>' +
        '<div class="map-grid">' +
          FIELDS.map((f) => {
            const sel = p.mapping[f.key];
            return '<label>' + f.label + (f.required ? ' <span class="req">*</span>' : '') + '</label>' +
              '<select data-map="' + f.key + '">' +
                '<option value="-1">— 없음 —</option>' +
                p.headers.map((h, i) => '<option value="' + i + '"' + (sel === i ? ' selected' : '') + '>' + esc(h) + '</option>').join('') +
              '</select>';
          }).join('') +
        '</div>' +
        '<div class="sheet-actions" style="margin-top:14px">' +
          '<button class="btn btn--ghost" data-act="cancel-import">취소</button>' +
          '<button class="btn btn--primary" data-act="apply-import" style="flex:1.4">' + p.rows.length + '명 가져오기</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- 파일 처리 ---------------- */
  async function handleFile(file) {
    if (!file) return;
    M.toast('파일을 읽는 중…', { duration: 1600 });
    try {
      const parsed = await M.importer.parseFile(file);
      M.ui.parsed = parsed;
      render();
      M.toast(parsed.rows.length + '줄을 읽었어요. 칸을 확인해 주세요.', { tone: 'ok' });
    } catch (e) {
      console.error(e);
      M.toast('파일을 읽지 못했어요: ' + e.message, { tone: 'warn', duration: 7000 });
    }
  }

  function applyImport() {
    const p = M.ui.parsed;
    if (!p) return;
    if (!p.mapping || p.mapping.name == null || p.mapping.name < 0) {
      M.toast('"강아지 이름" 칸을 꼭 골라주세요', { tone: 'warn' });
      return;
    }
    const get = (row, key) => {
      const i = p.mapping[key];
      return i >= 0 && i != null ? String(row[i] == null ? '' : row[i]).trim() : '';
    };
    let added = 0, updated = 0, skipped = 0;
    const stamp = (d) => { d.importedAt = M.nowISO(); d.sample = false; };

    p.rows.forEach((row) => {
      const name = get(row, 'name');
      if (!name) { skipped++; return; }
      const phone = get(row, 'phone');
      const guardian = get(row, 'guardian');
      const existing = M.dogs.find((d) =>
        String(d.name).replace(/\s/g, '') === name.replace(/\s/g, '') &&
        (!phone || M.phoneDigits(d.phone) === M.phoneDigits(phone))
      );

      if (existing) {
        if (guardian) existing.guardian = guardian;
        if (phone) existing.phone = phone;
        if (get(row, 'breed')) existing.breed = get(row, 'breed');
        if (get(row, 'address')) existing.address = get(row, 'address');
        if (get(row, 'note')) existing.note = get(row, 'note');
        if (get(row, 'regNo')) existing.regNo = get(row, 'regNo');
        if (get(row, 'neutered')) existing.neutered = get(row, 'neutered').toUpperCase().indexOf('O') === 0 ? 'O' : 'X';
        if (p.mapping.tickets >= 0) existing.tickets = M.importer.parseTickets(get(row, 'tickets'));
        stamp(existing);
        updated++;
      } else {
        M.state.dogs.push(Object.assign({
          id: M.uid('dog'), name, breed: get(row, 'breed'), guardian, phone,
          address: get(row, 'address'), neutered: get(row, 'neutered') ? (/^o/i.test(get(row, 'neutered')) ? 'O' : 'X') : '',
          regNo: get(row, 'regNo'), tickets: M.importer.parseTickets(get(row, 'tickets')),
          note: get(row, 'note'), emoji: '🐶', archived: false, log: [], sample: false, importedAt: M.nowISO()
        }));
        added++;
      }
    });

    M.persist();
    M.ui.parsed = null;
    render();
    M.toast(added + '명 추가 · ' + updated + '명 업데이트' + (skipped ? ' · ' + skipped + '줄 건너뜀' : ''), { tone: 'ok', duration: 6000 });
  }

  /* ---------------- 내보내기 ---------------- */
  function exportCSV() {
    const head = ['강아지이름', '품종', '보호자', '연락처', '주소', '중성화', '동물등록번호', '잔여횟수', '메모'];
    const lines = [head.join(',')];
    M.dogs.forEach((d) => {
      const row = [d.name, d.breed, d.guardian, M.phonePretty(d.phone), d.address, d.neutered, d.regNo, d.tickets, d.note];
      lines.push(row.map((v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(','));
    });
    const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '멍플_고객_' + M.todayKey() + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    M.toast('고객 ' + M.dogs.length + '명을 CSV로 내려받았어요', { tone: 'ok' });
  }

  /* ---------------- 편집 시트 ---------------- */
  function openEditor(dog) {
    const isNew = !dog;
    const d = dog || { name: '', breed: '', guardian: '', phone: '', address: '', neutered: 'X', regNo: '', tickets: 0, note: '', emoji: '🐶' };
    const emojis = ['🐶', '🐕', '🐩', '🦮', '🐕‍🦺', '🐾'];
    const sheet = M.openSheet('' +
      '<h3>' + (isNew ? '🐾 고객 추가' : '✏️ ' + esc(d.name) + ' 수정') + '</h3>' +
      '<p class="sheet-desc">' + (isNew ? '강아지와 보호자 정보를 적어주세요.' : '정보를 고치고 저장하세요.') + '</p>' +
      '<div class="two-2">' +
        '<div class="field"><label>강아지 이름<span class="req">*</span></label><input class="input" id="e-name" value="' + esc(d.name) + '" placeholder="두부"></div>' +
        '<div class="field"><label>품종</label><input class="input" id="e-breed" value="' + esc(d.breed) + '" placeholder="비숑"></div>' +
      '</div>' +
      '<div class="two-2">' +
        '<div class="field"><label>보호자 이름</label><input class="input" id="e-guardian" value="' + esc(d.guardian) + '" placeholder="김민지"></div>' +
        '<div class="field"><label>연락처</label><input class="input" id="e-phone" type="tel" inputmode="tel" value="' + esc(d.phone) + '" placeholder="010-0000-0000"></div>' +
      '</div>' +
      '<div class="field"><label>주소</label><input class="input" id="e-address" value="' + esc(d.address) + '" placeholder="선택"></div>' +
      '<div class="two-2">' +
        '<div class="field"><label>중성화</label><div class="seg" id="e-neut">' +
          '<button type="button" data-v="O" class="' + (d.neutered === 'O' ? 'on' : '') + '">O</button>' +
          '<button type="button" data-v="X" class="' + (d.neutered !== 'O' ? 'on' : '') + '">X</button>' +
          '<button type="button" data-v="" class="' + (!d.neutered ? 'on' : '') + '">?</button>' +
        '</div></div>' +
        '<div class="field"><label>동물등록번호</label><input class="input" id="e-regno" value="' + esc(d.regNo) + '"></div>' +
      '</div>' +
      '<div class="two-2">' +
        '<div class="field"><label>잔여 횟수권</label><input class="input" id="e-tickets" type="number" inputmode="numeric" value="' + d.tickets + '"></div>' +
        '<div class="field"><label>아이콘</label><div class="seg" id="e-emoji">' +
          emojis.map((e) => '<button type="button" data-e="' + e + '" class="' + (d.emoji === e ? 'on' : '') + '" style="font-size:17px">' + e + '</button>').join('') +
        '</div></div>' +
      '</div>' +
      '<div class="field"><label>이용권 유효기간 (1개월 소진 등)</label>' +
        '<div style="display:flex;gap:6px;align-items:center">' +
          '<input class="input" id="e-expires" type="date" value="' + esc(d.ticketExpires || '') + '" style="flex:1">' +
          '<button type="button" class="btn btn--ghost btn--sm" data-e2="exp-1m" style="white-space:nowrap">오늘+1개월</button>' +
          '<button type="button" class="btn btn--ghost btn--sm" data-e2="exp-clear" style="white-space:nowrap">지움</button>' +
        '</div>' +
      '</div>' +
      '<div class="field"><label>메모</label><input class="input" id="e-note" value="' + esc(d.note) + '" placeholder="예: 알러지, 입질 있음" maxlength="60"></div>' +
      '<div class="cons-box">' +
        '<div class="cb-head">📝 신규 동의서 보내기 <em>선택</em></div>' +
        '<p class="cb-desc">보낼 동의서를 고르면 저장할 때 보호자 번호로 문자를 바로 열어드려요. (이미 쓴 고객은 안 보냄)</p>' +
        '<div class="cons-pick" id="e-consent">' +
          '<button type="button" data-c="none" class="on">안 보냄</button>' +
          '<button type="button" data-c="kindergarten">🏫 유치원</button>' +
          '<button type="button" data-c="hotel">🏨 호텔</button>' +
          '<button type="button" data-c="beauty">✂️ 미용</button>' +
        '</div>' +
        '<div class="cb-go">' +
          '<button class="btn btn--ghost" data-e2="consent-send">📩 지금 문자·링크 보내기</button>' +
        '</div>' +
        '<div id="e-consent-out"></div>' +
      '</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn--ghost" data-e2="cancel">취소</button>' +
        '<button class="btn btn--primary" data-e2="save" style="flex:1.5">저장</button>' +
      '</div>' +
      (isNew ? '' : '<div class="sheet-actions" style="margin-top:8px"><button class="btn btn--danger btn--sm" data-e2="del" style="flex:1">고객 삭제</button></div>')
    );

    let emoji = d.emoji || '🐶';
    let neut = d.neutered;
    let consentType = 'none';
    let sentConsent = false;
    sheet.body.addEventListener('click', async (ev) => {
      const nb = ev.target.closest('#e-neut button');
      if (nb) { neut = nb.dataset.v; $$('#e-neut button', sheet.body).forEach((x) => x.classList.toggle('on', x === nb)); return; }
      const eb = ev.target.closest('#e-emoji button');
      if (eb) { emoji = eb.dataset.e; $$('#e-emoji button', sheet.body).forEach((x) => x.classList.toggle('on', x === eb)); return; }
      const cb = ev.target.closest('#e-consent button');
      if (cb) {
        consentType = cb.dataset.c;
        $$('#e-consent button', sheet.body).forEach((x) => x.classList.toggle('on', x === cb));
        const out = $('#e-consent-out', sheet.body);
        if (out) out.innerHTML = '';
        sentConsent = false;
        return;
      }
      const b = ev.target.closest('[data-e2]');
      if (!b) return;
      const v = (id) => { const el = $('#' + id, sheet.body); return el ? el.value.trim() : ''; };
      const who = () => ({ name: v('e-name'), guardian: v('e-guardian'), phone: v('e-phone') });
      if (b.dataset.e2 === 'cancel') return sheet.close();

      if (b.dataset.e2 === 'consent-send') {
        if (consentType === 'none') { M.toast('보낼 동의서를 먼저 골라주세요', { tone: 'warn' }); return; }
        const w = who();
        if (!w.name) { M.toast('강아지 이름을 먼저 적어주세요', { tone: 'warn' }); return; }
        if (M.phoneDigits(w.phone).length < 9) {
          M.toast('보호자 연락처를 먼저 적어주세요', { tone: 'warn' });
          const ph = $('#e-phone', sheet.body);
          if (ph) { ph.classList.add('err'); ph.focus(); setTimeout(() => ph.classList.remove('err'), 2200); }
          return;
        }
        const m = M.consentMessage(consentType, w);
        const out = $('#e-consent-out', sheet.body);
        if (!out) return;
        out.innerHTML = '<div class="bubble" style="font-size:11.5px;margin-top:9px">' + esc(m.msg) + '</div>' +
          '<div class="sheet-actions" style="margin-top:8px">' +
            '<button class="btn btn--ghost" data-e2="consent-copy">문구 복사</button>' +
            '<button class="btn btn--primary" data-e2="consent-sms" style="flex:1.4">📩 문자앱 열기</button>' +
          '</div>';
        sentConsent = true;
        return;
      }
      if (b.dataset.e2 === 'consent-copy') {
        const m = M.consentMessage(consentType, who());
        const ok = await M.copyText(m.msg);
        M.toast(ok ? '동의서 문구를 복사했어요' : '복사 실패 — 길게 눌러 복사해 주세요', { tone: ok ? 'ok' : 'warn' });
        return;
      }
      if (b.dataset.e2 === 'consent-sms') {
        const w = who();
        const m = M.consentMessage(consentType, w);
        M.copyText(m.msg);
        window.location.href = M.smsHref(w.phone, m.msg);
        return;
      }
      if (b.dataset.e2 === 'exp-1m') {
        const el = $('#e-expires', sheet.body);
        if (el) el.value = M.addMonthsISO(M.todayKey(), 1);
        return;
      }
      if (b.dataset.e2 === 'exp-clear') {
        const el = $('#e-expires', sheet.body);
        if (el) el.value = '';
        return;
      }
      if (b.dataset.e2 === 'del') {
        if (confirm(d.name + ' 고객을 삭제할까요?')) { M.removeDog(d.id); sheet.close(); render(); M.toast('삭제했어요'); }
        return;
      }
      if (b.dataset.e2 === 'save') {
        const name = v('e-name');
        if (!name) { $('#e-name', sheet.body).classList.add('err'); M.toast('강아지 이름을 적어주세요', { tone: 'warn' }); return; }
        const patch = {
          name, breed: v('e-breed'), guardian: v('e-guardian'), phone: v('e-phone'),
          address: v('e-address'), neutered: neut, regNo: v('e-regno'),
          tickets: parseInt(v('e-tickets'), 10) || 0, ticketExpires: v('e-expires'), note: v('e-note'), emoji
        };
        let saved;
        if (isNew) saved = M.addDog(patch);
        else { M.updateDog(d.id, patch); saved = M.dogById(d.id); }
        sheet.close();
        render();
        M.toast(isNew ? name + ' 추가했어요' : '수정했어요', { tone: 'ok' });
        // 저장하면서 고른 동의서가 있으면 바로 보낼 수 있게 열어준다
        if (consentType !== 'none' && !sentConsent && saved) {
          setTimeout(() => { if (M.sendConsentSheet) M.sendConsentSheet(consentType, saved); }, 340);
        }
      }
    });
  }

  /* ---------------- 이벤트 ---------------- */
  function bind(root) {
    root.addEventListener('click', (ev) => {
      const cv = ev.target.closest('[data-cview]');
      if (cv) {
        M.ui.custView = cv.dataset.cview;
        render();
        return;
      }
      const b = ev.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;
      if (act === 'add') return openEditor(null);
      if (act === 'pick') { const inp = $('#file-input', root); if (inp) inp.click(); return; }
      if (act === 'paste') return openPaste();
      if (act === 'cancel-import') { M.ui.parsed = null; render(); return; }
      if (act === 'apply-import') return applyImport();
      if (act === 'open') {
        const d = M.dogById(b.dataset.id);
        if (d) M.attendanceActions.openDetail(d);
        return;
      }
    });

    root.addEventListener('change', (ev) => {
      if (ev.target.id === 'file-input') {
        const f = ev.target.files && ev.target.files[0];
        handleFile(f);
        ev.target.value = '';
      }
      const sel = ev.target.closest('[data-map]');
      if (sel && M.ui.parsed) {
        M.ui.parsed.mapping[sel.dataset.map] = parseInt(sel.value, 10);
      }
    });

    // 드래그 앤 드롭 (데스크톱에서 편하게)
    root.addEventListener('dragover', (ev) => {
      const dz = ev.target.closest('#dropzone');
      if (dz) { ev.preventDefault(); dz.classList.add('hot'); }
    });
    root.addEventListener('dragleave', (ev) => {
      const dz = ev.target.closest('#dropzone');
      if (dz) dz.classList.remove('hot');
    });
    root.addEventListener('drop', (ev) => {
      const dz = ev.target.closest('#dropzone');
      if (!dz) return;
      ev.preventDefault(); dz.classList.remove('hot');
      const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
      handleFile(f);
    });
  }

  function openPaste() {
    const sheet = M.openSheet('' +
      '<h3>📋 표 붙여넣기</h3>' +
      '<p class="sheet-desc">엑셀에서 머리글까지 함께 복사(Ctrl+C)해서 붙여넣으세요. 탭으로 나뉜 표도 인식합니다.</p>' +
      '<textarea class="input" id="paste-box" style="min-height:150px;font-size:12.5px" placeholder="강아지이름&#9;품종&#9;보호자&#9;연락처&#9;횟수&#10;두부&#9;비숑&#9;김민지&#9;010-2345-1122&#9;8"></textarea>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn--ghost" data-p="cancel">취소</button>' +
        '<button class="btn btn--primary" data-p="ok" style="flex:1.4">읽기</button>' +
      '</div>'
    );
    sheet.body.addEventListener('click', async (ev) => {
      const b = ev.target.closest('[data-p]');
      if (!b) return;
      if (b.dataset.p === 'cancel') return sheet.close();
      const text = ($('#paste-box', sheet.body) || {}).value || '';
      if (!text.trim()) { M.toast('붙여넣은 내용이 없어요', { tone: 'warn' }); return; }
      try {
        const parsed = await M.importer.parseText(text);
        M.ui.parsed = parsed;
        sheet.close();
        render();
        M.toast(parsed.rows.length + '줄을 읽었어요', { tone: 'ok' });
      } catch (e) {
        M.toast('읽지 못했어요: ' + e.message, { tone: 'warn' });
      }
    });
  }

  M.renderCustomers = render;
  M.bindCustomers = bind;
  M.openDogEditor = openEditor;
  M.exportCustomersCSV = exportCSV;
  M.handleCustomerFile = handleFile;
})();
</script>
