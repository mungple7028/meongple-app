<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>멍플 — 횟수권·동의서·호텔</title>
<meta name="description" content="멍플 애견유치원 — 주간 출석표, 호텔·미용·미수금 달력, 모바일 동의서">
<meta name="theme-color" content="#FCFAF8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="멍플">
<meta name="format-detection" content="telephone=no">
<style>
/* ===========================================================
   멍플 — 횟수권·동의서  |  styles.css
   화이트 · 베이지 · 더스티 핑크 / 차콜 텍스트 / 1px 헤어라인
   =========================================================== */

:root{
  /* 기본 팔레트 */
  --ink:#2B2523;            /* 차콜 — 본문/제목 */
  --ink-2:#6E635C;          /* 보조 텍스트 */
  --muted:#A2968E;          /* 캡션 */
  --line:#EDE4DA;           /* 헤어라인 */
  --line-2:#F4EDE6;
  --paper:#FFFFFF;
  --bg:#FCFAF8;             /* 화이트 페이퍼 */
  --beige:#F5EFE9;
  --beige-2:#EDE4DA;
  --blush:#FDF2F4;
  --pink:#E89BAE;
  --rose:#D97C93;           /* 더스티 핑크 포인트 */
  --rose-deep:#B4556C;

  /* 기존 이름 호환 (스크립트 인라인 스타일용) */
  --green:#2B2523;
  --green-600:#3A332F;
  --green-700:#1F1A18;
  --green-soft:#F5EFE9;
  --green-line:#EDE4DA;
  --ivory:#FCFAF8;
  --ivory-2:#F5EFE9;
  --card:#FFFFFF;
  --amber:#E89BAE;
  --amber-deep:#B4556C;
  --amber-soft:#FDF2F4;
  --coral:#CF5F72;
  --coral-soft:#FBEDF0;
  --blue:#9C6B72;
  --blue-soft:#F7EDEE;

  --r-lg:16px;
  --r-md:12px;
  --r-sm:9px;
  --shadow-sm:0 1px 2px rgba(43,37,35,.03);
  --shadow:0 10px 28px rgba(43,37,35,.07);
  --shadow-lg:0 24px 60px rgba(43,37,35,.16);
  --tab-h:62px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Samsung One UI",system-ui,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  color:var(--ink);
  background:#EFE9E3;
  background-image:radial-gradient(900px 520px at 50% -8%,#FAF6F2 0%,#EFE9E3 62%,#E7DFD7 100%);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  line-height:1.45;
  letter-spacing:-.01em;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--rose-deep);text-decoration:none}
[hidden]{display:none !important}
::selection{background:#F8DCE3}

/* ---------- 앱 껍데기 ---------- */
.shell{
  position:relative;width:100%;max-width:430px;min-width:320px;margin:0 auto;
  min-height:100vh;min-height:100dvh;
  background:var(--bg);
  display:flex;flex-direction:column;overflow-x:hidden;
}
@media (min-width:520px){
  .shell{
    box-shadow:0 0 0 1px rgba(43,37,35,.07), 0 30px 70px rgba(43,37,35,.12);
    margin:0 auto;
  }
}

/* ---------- 상단 헤더 (화이트 + 헤어라인) ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(252,250,248,.96);
  backdrop-filter:saturate(120%) blur(8px);
  -webkit-backdrop-filter:saturate(120%) blur(8px);
  color:var(--ink);
  padding:calc(16px + env(safe-area-inset-top,0px)) 20px 12px;
  border-bottom:1px solid var(--line);
}
.hd-row{display:flex;align-items:center;gap:11px}
.hd-logo{
  width:36px;height:36px;border-radius:50%;background:var(--blush);flex:0 0 auto;
  display:grid;place-items:center;font-size:15px;filter:grayscale(1);opacity:.75;
  box-shadow:inset 0 0 0 1px #F6DDE3;
}
.hd-title{
  font-size:18px;font-weight:700;letter-spacing:-.03em;
  display:flex;align-items:baseline;gap:7px;line-height:1.15;
}
.hd-title small{
  font-weight:500;font-size:9.5px;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;
}
.hd-date{
  margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:500;
  text-align:right;line-height:1.5;letter-spacing:0;
}
.hd-stats{
  display:flex;align-items:stretch;margin-top:13px;
  border-top:1px solid var(--line-2);padding-top:11px;
}
.hd-stat{flex:1;padding:0 8px;position:relative;text-align:left}
.hd-stat:first-child{padding-left:0}
.hd-stat + .hd-stat{border-left:1px solid var(--line-2)}
.hd-stat b{
  display:block;font-size:19px;font-weight:600;letter-spacing:-.04em;line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.hd-stat span{display:block;margin-top:3px;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.01em}
.hd-stat.warn b{color:var(--rose-deep)}
.hd-stat.ok b{color:var(--ink)}

/* ---------- 본문 ---------- */
.views{flex:1;padding:0 0 calc(var(--tab-h) + 28px + var(--safe-b))}
.view{display:none;padding:16px 20px 0;animation:viewin .2s ease both}
.view.active{display:block}
@keyframes viewin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- 하단 탭 ---------- */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;height:calc(var(--tab-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:flex;z-index:50;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  position:relative;color:var(--muted);padding:0;
}
.tab-ic{font-size:16px;line-height:1;opacity:.4;filter:grayscale(1);transition:opacity .15s}
.tab-tx{font-size:9.5px;font-weight:500;letter-spacing:-.02em;white-space:nowrap}
.tab.on{color:var(--ink)}
.tab.on .tab-ic{opacity:.85}
.tab.on .tab-tx{font-weight:600}
.tab.on::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:20px;height:2px;background:var(--rose);border-radius:0 0 2px 2px;
}

.sec-title{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:600;color:var(--muted);
  letter-spacing:.04em;margin:22px 0 9px;
}
.sec-title:first-child{margin-top:2px}
.sec-title .num{font-weight:500;color:#BFB4AC;letter-spacing:.02em}

/* ---------- 검색 ---------- */
.searchbar{position:relative;margin-top:14px}
.searchbar input{
  width:100%;height:44px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);padding:0 38px;font-size:14px;font-weight:500;
  outline:none;transition:border-color .15s, box-shadow .15s;
}
.searchbar input::placeholder{color:#BCB2AA;font-weight:400}
.searchbar input[type="search"]::-webkit-search-cancel-button,
.searchbar input[type="search"]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.searchbar input:focus{border-color:#DBD0C6;box-shadow:0 0 0 3px rgba(217,124,147,.09)}
.searchbar .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;filter:grayscale(1)}
.searchbar .clr{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:13px;display:none;
}
.searchbar.has-value .clr{display:grid;place-items:center}

/* ---------- 필터 (텍스트 탭 + 핑크 밑줄) ---------- */
.pills{
  display:flex;gap:20px;margin:14px 0 2px;overflow-x:auto;
  padding:0 0 0 0;scrollbar-width:none;border-bottom:1px solid var(--line);
}
.pills::-webkit-scrollbar{display:none}
.pill{
  flex:0 0 auto;padding:0 0 9px;font-size:13px;font-weight:500;color:var(--muted);
  background:none;border:0;position:relative;letter-spacing:-.01em;transition:color .15s;
}
.pill b{font-weight:500;margin-left:3px;color:#C4BAB2;font-variant-numeric:tabular-nums}
.pill.on{color:var(--ink);font-weight:600}
.pill.on b{color:var(--rose)}
.pill.on::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--rose);
  border-radius:2px;
}

/* ---------- 강아지 카드 ---------- */
.dog-list{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.dog{
  background:var(--paper);border-radius:var(--r-lg);padding:15px 15px 13px;
  border:1px solid var(--line);position:relative;overflow:hidden;
  transition:border-color .15s;
}
.dog::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--rose)}
.dog.low::before,.dog.zero::before{width:3px;background:var(--rose)}
.dog.low::before{opacity:.55}
.dog-top{display:flex;align-items:flex-start;gap:11px}
.avatar{
  width:40px;height:40px;border-radius:10px;flex:0 0 auto;
  background:var(--beige);display:grid;place-items:center;font-size:19px;
  border:1px solid var(--line-2);
}
.dog-main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.dog-name{
  font-size:16px;font-weight:600;letter-spacing:-.03em;line-height:1.2;
  display:flex;align-items:center;gap:6px;
}
.dog-name .today-dot{
  font-size:9.5px;font-weight:600;color:var(--rose-deep);background:var(--blush);
  padding:2.5px 7px;border-radius:999px;letter-spacing:.01em;
  border:1px solid #F7DFE5;
}
.dog-sub{
  font-size:12px;color:var(--muted);font-weight:400;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0;
}
.dog-sub b{color:var(--ink-2);font-weight:500}
.tk{
  flex:0 0 auto;text-align:right;min-width:46px;
}
.tk b{
  display:block;font-size:19px;font-weight:600;line-height:1.05;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;color:var(--ink);
}
.tk span{font-size:9.5px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.tk.low b{color:var(--rose-deep)}
.tk.zero b{color:#B4556C}
.dog-note{
  margin-top:10px;font-size:11.5px;font-weight:400;color:var(--ink-2);
  background:var(--beige);border-radius:8px;padding:7px 10px;letter-spacing:0;
}
.dog-actions{display:flex;gap:7px;margin-top:12px}
.dog-actions .btn{flex:1}

/* ---------- 버튼 ---------- */
.btn{
  height:42px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:600;
  letter-spacing:-.01em;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  background:var(--paper);color:var(--ink-2);border:1px solid var(--line);
  transition:transform .1s, background .15s, border-color .15s;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn--primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn--primary:active{background:#3B3330}
.btn--soft{background:var(--blush);color:var(--rose-deep);border-color:#F7DFE5}
.btn--amber{background:var(--blush);color:var(--rose-deep);border-color:#F2D3DA}
.btn--ghost{background:var(--paper);border-color:var(--line);color:var(--ink-2)}
.btn--danger{background:var(--paper);color:var(--rose-deep);border-color:#F2D3DA}
.btn--sm{height:34px;padding:0 11px;font-size:11.5px;border-radius:9px;font-weight:500}
.btn--block{width:100%;height:50px;font-size:14.5px;border-radius:12px;font-weight:600}
.btn--icon{width:42px;padding:0}

/* ---------- 카드/패널 ---------- */
.card{
  background:var(--paper);border-radius:var(--r-lg);padding:16px;
  border:1px solid var(--line);
}
.card + .card{margin-top:10px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.card-h .ico{font-size:15px;line-height:1}
.card-h h3{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.02em}
.card-h .sub{font-size:10px;color:var(--muted);font-weight:500;margin-left:auto;letter-spacing:.02em}
.card p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.6;letter-spacing:0}

/* ---------- 동의서 양식 카드 ---------- */
.form-grid{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.formcard{
  background:var(--paper);border-radius:var(--r-lg);padding:15px;
  border:1px solid var(--line);
  display:flex;gap:12px;align-items:flex-start;
}
.formcard .emoji{
  width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:17px;background:var(--beige);
}
.formcard[data-type="hotel"] .emoji{background:var(--blush)}
.formcard[data-type="beauty"] .emoji{background:#F7EDEE}
.formcard .fc-body{flex:1;min-width:0}
.formcard h4{margin:1px 0 3px;font-size:14px;font-weight:600;letter-spacing:-.02em}
.formcard p{margin:0 0 11px;font-size:11px;color:var(--muted);font-weight:400;line-height:1.5;letter-spacing:0}
.fc-actions{display:flex;gap:6px;flex-wrap:wrap}
.fc-actions .btn{flex:1;min-width:calc(50% - 3px)}

/* ---------- 서명 완료 목록 ---------- */
.rec-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rec{
  display:flex;gap:11px;align-items:center;background:var(--paper);border-radius:var(--r-md);
  padding:11px 12px;border:1px solid var(--line);width:100%;text-align:left;
}
.rec .sigthumb{
  width:50px;height:36px;border-radius:7px;border:1px solid var(--line-2);background:#fff;
  flex:0 0 auto;object-fit:contain;
}
.rec-b{flex:1;min-width:0}
.rec-b .t1{font-size:13px;font-weight:600;letter-spacing:-.02em;display:flex;gap:6px;align-items:center}
.rec-b .t2{font-size:11px;color:var(--muted);font-weight:400;margin-top:2px;letter-spacing:0}
.chip{
  font-size:9.5px;font-weight:600;padding:2.5px 7px;border-radius:999px;
  background:var(--beige);color:var(--ink-2);letter-spacing:.01em;
}
.chip.hotel{background:var(--blush);color:var(--rose-deep)}
.chip.beauty{background:#F7EDEE;color:#9C6B72}
.chip.cloud{background:var(--blush);color:var(--rose-deep)}
.chev{color:#D3CAC2;font-size:14px;flex:0 0 auto}

/* ---------- 고객 목록 ---------- */
.cust-row{
  display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--paper);
  border-radius:var(--r-md);border:1px solid var(--line);width:100%;text-align:left;
}
.cust-row .av{
  width:32px;height:32px;border-radius:9px;background:var(--beige);display:grid;place-items:center;
  font-size:15px;border:1px solid var(--line-2);
}
.cust-row .nm{flex:1;min-width:0}
.cust-row .nm b{display:block;font-size:13px;font-weight:600;letter-spacing:-.02em}
.cust-row .nm span{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0}
.cust-row .tk{min-width:38px}
.cust-row .tk b{font-size:15px}

/* ---------- 업로드 존 ---------- */
.drop{
  border:1px dashed #E0D3C8;border-radius:var(--r-md);background:#FEFCFA;
  padding:22px 16px;text-align:center;transition:border-color .15s, background .15s;
}
.drop.hot{border-color:var(--rose);background:var(--blush)}
.drop .big{font-size:24px;line-height:1;opacity:.75}
.drop h4{margin:9px 0 3px;font-size:13px;font-weight:600;letter-spacing:-.02em}
.drop p{margin:0;font-size:11px;color:var(--muted);font-weight:400;line-height:1.55;letter-spacing:0}
.drop .btn{margin-top:12px}
.card > .mini:first-of-type{margin-top:10px}

/* ---------- 표 ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.tbl{border-collapse:collapse;width:100%;font-size:11px;min-width:100%}
table.tbl th,table.tbl td{
  padding:7px 9px;border-bottom:1px solid var(--line-2);text-align:left;
  white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;letter-spacing:0;
}
table.tbl th{background:var(--beige);font-weight:600;color:var(--ink-2);position:sticky;top:0}
table.tbl tr:last-child td{border-bottom:0}
.map-grid{display:grid;grid-template-columns:1fr auto;gap:7px 10px;align-items:center;margin-top:4px}
.map-grid label{font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.map-grid select{
  width:100%;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;
  padding:0 8px;font-size:11.5px;font-weight:500;letter-spacing:0;
}

/* ---------- 폼 ---------- */
.field{margin-bottom:11px}
.field > label{
  display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);
  margin:0 0 6px 1px;letter-spacing:-.01em;
}
.field .req{color:var(--rose);margin-left:2px}
.input{
  width:100%;height:44px;border-radius:9px;border:1px solid var(--line);background:#fff;
  padding:0 12px;font-size:14px;font-weight:500;outline:none;letter-spacing:0;
  transition:border-color .15s,box-shadow .15s;
}
textarea.input{height:auto;min-height:72px;padding:11px 12px;line-height:1.55;resize:vertical}
.input:focus{border-color:#CFC2B8;box-shadow:0 0 0 3px rgba(217,124,147,.08)}
.input::placeholder{color:#C3B9B1;font-weight:400}
.input.err{border-color:var(--rose);box-shadow:0 0 0 3px rgba(217,124,147,.14)}
.two-2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.seg{display:flex;gap:5px}
.seg button{
  flex:1;height:42px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:13px;font-weight:500;color:var(--ink-2);letter-spacing:0;
}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.hint{font-size:10.5px;color:var(--muted);font-weight:400;margin:6px 1px 0;letter-spacing:0}

/* ---------- 동의서 문서 ---------- */
.doc-head{padding:2px 0 0}
.doc-head .doc-title{font-size:22px;font-weight:600;letter-spacing:-.045em;margin:0 0 4px;line-height:1.2}
.doc-head .doc-sub{font-size:10.5px;color:var(--muted);font-weight:400;letter-spacing:0}
.doc-info{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 4px;
  padding:14px;border-radius:var(--r-md);background:var(--beige);border:1px solid var(--line-2);
}
.doc-info h5{margin:0 0 7px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.doc-info ul{margin:0;padding:0;list-style:none}
.doc-info li{font-size:10.5px;color:var(--ink-2);font-weight:400;line-height:1.7;display:flex;gap:4px;letter-spacing:0}
.doc-info li i{font-style:normal;color:#C8BEB6;flex:0 0 auto}
.doc-info li b{font-weight:600;color:var(--ink)}
.clauses{margin-top:18px}
.clauses h5{
  margin:0 0 11px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);
  display:flex;align-items:center;gap:5px;
}
.clause{
  display:flex;gap:9px;font-size:13px;line-height:1.75;color:#3A3432;font-weight:400;
  margin:0 0 13px;letter-spacing:-.005em;
}
.clause .n{
  flex:0 0 auto;width:auto;min-width:14px;height:auto;background:none;color:var(--rose);
  font-size:11px;font-weight:600;margin-top:4px;display:block;line-height:1.4;
}
.clause.plain{padding-left:0}
.clause .body b{font-weight:600}
.clause ul{margin:7px 0 0;padding-left:2px;list-style:none}
.clause ul li{position:relative;padding-left:10px;font-size:12.5px;line-height:1.7;color:#4A423E}
.clause ul li::before{content:"–";position:absolute;left:0;color:#C8BEB6}
.doc-close{
  margin:18px 0 6px;padding:15px;border-radius:var(--r-md);background:var(--blush);
  border:1px solid #F7DFE5;
  font-size:13px;line-height:1.75;font-weight:600;color:#7E3B4C;letter-spacing:-.01em;
}
.doc-date{
  text-align:center;font-size:13px;font-weight:500;color:var(--ink-2);margin:20px 0 6px;letter-spacing:0;
}

/* ---------- 동의 체크 ---------- */
.check-row{
  display:flex;gap:11px;align-items:flex-start;padding:15px;border-radius:var(--r-md);
  background:#fff;border:1px solid var(--line);margin-top:14px;text-align:left;width:100%;
  transition:border-color .15s, background .15s;
}
.check-row.on{border-color:var(--rose);background:#FFFCFC}
.check-box{
  width:21px;height:21px;border-radius:6px;border:1px solid #DED4CB;flex:0 0 auto;
  display:grid;place-items:center;background:#fff;color:transparent;font-size:12px;font-weight:700;
  transition:background .15s,border-color .15s,color .15s;margin-top:1px;
}
.check-row.on .check-box{background:var(--rose);border-color:var(--rose);color:#fff}
.check-row p{margin:0;font-size:12.5px;line-height:1.55;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.check-row p span{display:block;font-size:10.5px;font-weight:400;color:var(--muted);margin-top:3px;letter-spacing:0}

/* ---------- 서명 패드 ---------- */
.sig-card{margin-top:12px;background:#fff;border-radius:var(--r-md);border:1px solid var(--line);padding:13px}
.sig-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sig-head h5{margin:0;font-size:11.5px;font-weight:600;letter-spacing:0}
.sig-head .tag{font-size:9.5px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.sig-head .btn{margin-left:auto;height:28px;font-size:10.5px;padding:0 9px}
.sig-wrap{
  position:relative;border-radius:9px;background:#fff;
  border:1px dashed #DED4CB;overflow:hidden;touch-action:none;
}
.sig-wrap canvas{display:block;width:100%;height:170px;position:relative;z-index:1;cursor:crosshair}
.sig-ph{
  position:absolute;inset:0;display:grid;place-items:center;z-index:0;
  color:#C3B9B1;font-size:11.5px;font-weight:500;letter-spacing:0;pointer-events:none;
}
.sig-wrap.signed .sig-ph{display:none}
.sig-line{position:absolute;left:13%;right:13%;bottom:32px;height:1px;background:#F0E8E1;z-index:0}

/* ---------- 고객화면 하단 바 ---------- */
.cust-bar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;
  padding:12px 20px calc(12px + var(--safe-b));
  background:linear-gradient(180deg,rgba(252,250,248,0) 0%,rgba(252,250,248,.94) 30%,var(--bg) 60%);
  z-index:40;
}
.shell--customer{background:var(--bg)}
.cust-head{
  position:sticky;top:0;z-index:30;background:rgba(252,250,248,.96);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top,0px)) 20px 11px;
  display:flex;align-items:center;gap:10px;
}
.cust-head .tt{flex:1;min-width:0}
.cust-head .tt b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.02em}
.cust-head .tt span{font-size:10px;color:var(--muted);font-weight:400;letter-spacing:0}
.cust-head .brand{
  font-size:10px;font-weight:600;color:var(--rose-deep);background:var(--blush);
  padding:4px 9px;border-radius:999px;border:1px solid #F7DFE5;letter-spacing:.02em;
}

.preview-banner{
  background:var(--blush);color:#7E3B4C;font-size:11px;font-weight:500;letter-spacing:0;
  text-align:center;padding:9px 12px;border-radius:9px;margin:0 0 14px;border:1px solid #F7DFE5;
}

/* ---------- 토스트 ---------- */
.toast-host{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tab-h) + 16px + var(--safe-b));
  width:calc(100% - 32px);max-width:398px;z-index:110;display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:10px;
  background:rgba(43,37,35,.96);color:#fff;border-radius:11px;padding:12px 14px;
  font-size:12.5px;font-weight:500;letter-spacing:-.01em;box-shadow:var(--shadow-lg);
  transform:translateY(14px);opacity:0;transition:transform .2s ease,opacity .2s ease;
}
.toast.in{transform:none;opacity:1}
.toast--ok{background:rgba(43,37,35,.97)}
.toast--warn{background:rgba(126,59,76,.97)}
.toast-msg{flex:1;line-height:1.45}
.toast-act{
  flex:0 0 auto;background:rgba(255,255,255,.14);color:#fff;border-radius:7px;
  padding:7px 10px;font-size:11.5px;font-weight:600;
}

/* ---------- 바텀시트 ---------- */
.sheet-host{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(43,37,35,.34);backdrop-filter:blur(2px);opacity:0;transition:opacity .2s}
.sheet-host.in .sheet-backdrop{opacity:1}
.sheet{
  position:relative;width:100%;max-width:430px;background:var(--bg);
  border-radius:18px 18px 0 0;padding:8px 20px calc(18px + var(--safe-b));
  box-shadow:0 -12px 44px rgba(43,37,35,.2);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
  max-height:88vh;overflow-y:auto;border-top:1px solid var(--line);
}
.sheet-host.in .sheet{transform:none}
.sheet-grab{width:34px;height:3px;border-radius:999px;background:#DED4CB;margin:5px auto 12px}
.sheet h3{margin:0 0 5px;font-size:16px;font-weight:600;letter-spacing:-.03em}
.sheet .sheet-desc{margin:0 0 14px;font-size:12px;color:var(--ink-2);font-weight:400;line-height:1.6;letter-spacing:0}
.sheet-actions{display:flex;gap:7px;margin-top:14px}
.sheet-actions .btn{flex:1}
.bubble{
  background:#fff;border-radius:11px;border:1px solid var(--line);padding:13px;
  font-size:12.5px;line-height:1.6;font-weight:500;color:var(--ink);
  white-space:pre-wrap;word-break:break-word;letter-spacing:0;
}
.bubble-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-weight:500;margin:9px 1px 0;letter-spacing:0}
.bubble-meta b{color:var(--ink);font-weight:600}
.amt-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:6px}
.amt-pick button{
  height:54px;border-radius:11px;background:#fff;border:1px solid var(--line);
  font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.02em;
}
.amt-pick button:active{border-color:var(--rose)}
.amt-pick button small{display:block;font-size:9.5px;font-weight:400;color:var(--muted);margin-top:1px;letter-spacing:0}
.rowline{display:flex;gap:7px;margin-top:8px}
.rowline .input{height:44px}

/* ---------- 상세 ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:12px;margin-top:12px;letter-spacing:0}
.kv dt{color:var(--muted);font-weight:400}
.kv dd{margin:0;font-weight:500;color:var(--ink);text-align:right;word-break:break-all}
.log-list{display:flex;flex-direction:column;gap:7px;margin-top:10px;max-height:230px;overflow-y:auto}
.log{display:flex;gap:8px;align-items:center;font-size:11.5px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.log .dot{width:5px;height:5px;border-radius:50%;background:var(--rose);flex:0 0 auto}
.log.minus .dot{background:#C9BEB6}
.log .when{margin-left:auto;color:var(--muted);font-weight:400;font-size:10.5px}

/* ---------- 설정 ---------- */
.settings-sec{margin-top:14px}
.set-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.set-row:last-child{border-bottom:0}
.set-row .lab{flex:1;min-width:0}
.set-row .lab b{display:block;font-size:12.5px;font-weight:600;letter-spacing:-.02em}
.set-row .lab span{font-size:10.5px;color:var(--muted);font-weight:400;line-height:1.5;display:block;margin-top:3px;letter-spacing:0}
.switch{
  width:46px;height:27px;border-radius:999px;background:#E4DBD3;position:relative;flex:0 0 auto;
  transition:background .18s;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(43,37,35,.18);transition:transform .18s;
}
.switch.on{background:var(--rose)}
.switch.on::after{transform:translateX(19px)}
.codebox{
  background:#2B2523;color:#F3E7E1;border-radius:10px;padding:12px;font-size:10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.65;
  overflow-x:auto;white-space:pre;margin-top:8px;letter-spacing:0;
}
.danger-zone{margin-top:18px}
.mini{font-size:10.5px;color:var(--muted);font-weight:400;line-height:1.6;margin:7px 1px 0;letter-spacing:0}
.mini b{font-weight:600;color:var(--ink-2)}
.badge-ok{background:var(--blush);color:var(--rose-deep);font-size:9.5px;font-weight:600;padding:3px 8px;border-radius:999px;letter-spacing:.02em}
.badge-warn{background:var(--beige);color:#8A7A72;font-size:9.5px;font-weight:600;padding:3px 8px;border-radius:999px;letter-spacing:.02em}

/* ---------- 호텔·일정 (미수금 · 달력) ---------- */
.due-box{
  background:linear-gradient(180deg,#FDF0F3 0%,#FDF5F6 100%);border:1px solid #F6DDE3;
  border-radius:16px;padding:13px 14px 12px;margin-top:2px;
}
.due-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.due-head .db-ico{font-size:14px;line-height:1}
.due-head b{font-size:13px;font-weight:700;letter-spacing:-.02em;color:#8E3F51}
.due-head .db-sum{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--rose-deep);font-variant-numeric:tabular-nums}
.due-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:268px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.due-row{
  display:grid;grid-template-columns:1fr auto;grid-template-areas:"top btn" "sub btn";
  gap:2px 9px;align-items:center;
  background:#fff;border:1px solid #F4DCE1;border-radius:11px;padding:8px 10px;
}
.due-top{grid-area:top;min-width:0;display:flex;align-items:center;gap:5px}
.due-top b{font-size:12.5px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.due-sub{grid-area:sub;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due-amt{margin-left:auto;font-size:10.5px;font-weight:500;color:#A8445A;letter-spacing:0;white-space:nowrap}
.due-amt b{font-weight:700;font-variant-numeric:tabular-nums;font-size:11.5px}
.due-btn{
  grid-area:btn;height:32px;padding:0 9px;border-radius:9px;
  background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;
  box-shadow:0 1px 2px rgba(207,95,114,.28);
}
.due-btn:active{background:#B94F62}
.due-note{margin-top:8px;font-size:10px;font-weight:500;color:#A97A85;letter-spacing:0;line-height:1.5}
.due-box--clear{background:#F4F7F0;border-color:#E3EADA}
.due-box--clear .due-head b{color:#5F6E52}
.due-box--clear .due-head .db-sum{color:#7C8A6E}
.due-box--clear .due-note{color:#8A937F}

.cal-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 10px 9px;margin-top:12px}
.cal-head{display:flex;align-items:center;gap:2px;padding:0 2px 8px}
.cal-nav{width:30px;height:30px;border-radius:8px;color:var(--ink-2);font-size:17px;line-height:1;display:grid;place-items:center;flex:0 0 auto}
.cal-nav:active{background:var(--beige)}
.cal-month{font-size:14px;font-weight:600;letter-spacing:-.03em;padding:4px 5px;border-radius:8px;color:var(--ink)}
.cal-month .caret{font-size:9px;color:var(--muted);margin-left:1px}
.cal-today{
  margin-left:auto;height:27px;padding:0 10px;border-radius:999px;border:1px solid var(--line);
  font-size:10.5px;font-weight:600;color:var(--ink-2);background:#fff;letter-spacing:-.01em;
}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 0 5px;border-bottom:1px solid var(--line-2)}
.cal-dow span{text-align:center;font-size:9.5px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.cal-dow .sun{color:#C97F8E}
.cal-dow .sat{color:#8B9BB0}
.cal-body{display:block;padding-top:2px}
.cal-wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:start;padding:2px 0 4px}
.cal-wk + .cal-wk{border-top:1px solid var(--line-2)}
.cal-d{
  height:25px;display:flex;align-items:flex-start;justify-content:center;padding-top:3px;
  border-radius:7px;min-width:0;
}
.cal-d .n{font-size:11.5px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1}
.cal-d.out .n{color:#D2C9C1}
.cal-d.sun .n{color:#C97F8E}
.cal-d.sat .n{color:#8B9BB0}
.cal-d.out.sun .n,.cal-d.out.sat .n{color:#DFD7CF}
.cal-d.today .n{background:var(--rose);color:#fff;font-weight:700;border-radius:999px;padding:2.5px 5.5px;margin-top:-2.5px}
.cal-d.sel{background:var(--beige)}
.cal-d.sel .n{font-weight:700;color:var(--ink)}
.cal-d.sel.today .n{color:#fff}
.cal-bar{
  height:16px;margin:0 1px 2px;border-radius:4px;display:flex;align-items:center;gap:2px;
  padding:0 3px;overflow:hidden;font-size:9px;font-weight:600;letter-spacing:-.02em;line-height:1;text-align:left;
}
.cal-bar .bi{font-size:8px;line-height:1;flex:0 0 auto}
.cal-bar .bt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-bar.due{background:#FBE1E6;color:#A8445A;box-shadow:inset 0 0 0 1px #F5CAD3}
.cal-bar.paid{background:#ECF1E6;color:#5F6E52;box-shadow:inset 0 0 0 1px #DEE7D4}
.cal-bar.unset{background:#F2ECE6;color:#8A7A72;box-shadow:inset 0 0 0 1px #E8DED4}
.cal-bar.cut-l{border-top-left-radius:0;border-bottom-left-radius:0}
.cal-bar.cut-r{border-top-right-radius:0;border-bottom-right-radius:0}
.cal-plus{font-size:9px;font-weight:500;color:var(--muted);padding:0 4px 1px;letter-spacing:0}
.cal-foot{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 3px 1px;border-top:1px solid var(--line-2);margin-top:2px;font-size:9px;color:var(--muted);letter-spacing:0}
.cal-foot .lg{display:inline-flex;align-items:center;gap:3px}
.cal-foot .dot{width:7px;height:7px;border-radius:2px;display:inline-block}
.cal-foot .dot.due{background:#E9A7B4}
.cal-foot .dot.paid{background:#B7C4A8}
.cal-foot .dot.unset{background:#DCD0C4}
.cal-count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:500}

.chip.groom{background:#F7EDEE;color:#9C6B72}
.chip.daycare{background:#EEF2EC;color:#5F6E52}

.bk-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bk-row{
  display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:12px;text-align:left;width:100%;
}
.bk-row:active{border-color:#E0D3C8}
.bk-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:0 0 auto;background:var(--beige);border:1px solid var(--line-2)}
.bk-ico.hotel{background:var(--blush);border-color:#F8E0E5}
.bk-ico.groom{background:#F7EDEE;border-color:#F2E2E4}
.bk-ico.daycare{background:#EEF2EC;border-color:#E3EADA}
.bk-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bk-main b{font-size:13.5px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:5px;flex-wrap:wrap;line-height:1.3}
.bk-main > span{font-size:11px;color:var(--muted);letter-spacing:0;line-height:1.4}
.bk-pay{font-weight:600}
.bk-pay.paid{color:#5F6E52}
.bk-pay.unpaid,.bk-pay.partial{color:var(--rose-deep)}
.bk-pay.unset{color:#9A8A7E}
.bk-memo{font-size:10.5px;color:var(--ink-2);background:var(--beige);border-radius:6px;padding:3px 7px;margin-top:3px;width:fit-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-row .chev{align-self:center}

.bk-money{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.bk-money > div{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.bk-money span{display:block;font-size:9.5px;color:var(--muted);font-weight:500}
.bk-money b{display:block;font-size:13.5px;font-weight:700;margin-top:3px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bk-money .due{background:var(--coral-soft);border-color:#F6D3DA}
.bk-money .due b{color:var(--rose-deep)}
.bk-money .paid{background:#F3F6EF;border-color:#E3EADA}
.bk-money .paid b{color:#5F6E52}
.bk-note{margin-top:10px;background:var(--beige);border-radius:10px;padding:9px 11px;font-size:11.5px;color:var(--ink-2);line-height:1.5;letter-spacing:0}
.bk-done{margin-top:10px;font-size:11.5px;font-weight:600;color:#5F6E52;background:#F3F6EF;border-radius:9px;padding:9px 11px;text-align:center}

.bk-sug{display:flex;flex-direction:column;gap:2px;margin-top:6px;max-height:172px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px}
.sug{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;text-align:left;width:100%}
.sug:active{background:var(--beige)}
.sug-av{width:26px;height:26px;border-radius:7px;background:var(--beige);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.sug-t{display:flex;flex-direction:column;min-width:0}
.sug-t b{font-size:12px;font-weight:600;letter-spacing:-.02em}
.sug-t span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}

.bk-due{
  margin:0 1px 12px;font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--beige);
  border-radius:9px;padding:9px 11px;display:flex;gap:5px;align-items:baseline;flex-wrap:wrap;letter-spacing:0;
}
.bk-due b{font-size:13.5px;color:var(--rose-deep);font-variant-numeric:tabular-nums}
.bk-due span{font-weight:500;color:var(--muted);font-size:10.5px;margin-left:auto}
.bk-due.due{background:var(--coral-soft);color:#A8445A}
.bk-due.paid{background:#F3F6EF;color:#5F6E52}

.bk-paidflag{display:flex;align-items:center;gap:9px;width:100%;margin-top:8px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;text-align:left}
.bk-paidflag .pf-box{width:19px;height:19px;border-radius:6px;border:1px solid #DED4CB;display:grid;place-items:center;font-size:11px;font-weight:700;color:transparent;background:#fff;flex:0 0 auto;transition:background .15s,border-color .15s,color .15s}
.bk-paidflag .pf-tx{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.bk-paidflag .pf-tx b{font-size:12px;font-weight:600;letter-spacing:-.01em}
.bk-paidflag .pf-tx em{font-style:normal;font-size:9.5px;color:var(--muted);margin-top:1px;letter-spacing:0}
.bk-paidflag.on{border-color:#DFE7D6;background:#F7FAF3}
.bk-paidflag.on .pf-box{background:#7C8A6E;border-color:#7C8A6E;color:#fff}

.fab{
  position:fixed;bottom:calc(var(--tab-h) + 18px + var(--safe-b));
  right:max(18px, calc(50vw - 215px + 18px));
  width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;font-size:23px;line-height:1;
  display:grid;place-items:center;box-shadow:0 10px 24px rgba(43,37,35,.26);z-index:45;
}
.fab:active{transform:scale(.96)}

.mp-wrap{padding-bottom:2px}
.mp-year{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 10px}
.mp-year b{font-size:14px;font-weight:600;letter-spacing:-.02em}

<script>
/* ===========================================================
   data.js — 저장소 · 설정 · 공용 유틸 · 클라우드(Supabase) 연동
   =========================================================== */
window.M = (function () {
  'use strict';

  const KEY = 'meongple.v1';
  const VERSION = 1;

  const DEFAULT_SETTINGS = {
    storeName: '멍플',
    address: '부산 동래구 아시아드대로 207-1',
    phone: '010-8013-0879',
    bizNo: '174-09-02563',
    ownerName: '김선애',
    // 등원 / 하원 문자 문구 — 설정에서 자유롭게 바꿀 수 있다.
    smsInTemplate: '[멍플] {강아지} 오늘 등원했습니다 🐾 (남은 횟수권: {남은횟수}회)',
    smsOutTemplate: '[멍플] {강아지} 오늘 즐겁게 놀고 하원했습니다 🐾',
    autoOpenSms: false,      // 등원/하원 처리 직후 문자앱을 바로 열지
    lowTicketWarn: 3,        // 잔여 n회 이하 알림 기준
    // 클라우드(Supabase) — 세 폰이 같은 명단·일정을 쓰도록 배포본에 기본값을 넣어둔다.
    // publishable 키는 브라우저에 공개해도 되는 공개 키(anon에 해당)다.
    supabaseUrl: 'https://ptpboiiykpwnqyargojq.supabase.co',
    supabaseKey: 'sb_publishable_aksoeGzEm7vS5okzkqoEdQ_yesxfpW9'
  };

  const DEFAULT_DOG_EMOJI = ['🐶', '🐕', '🐩', '🦮', '🐕‍🦺', '🐾'];

  let state = null;
  const ui = { tab: 'attendance', dogQuery: '', dogFilter: 'all', custQuery: '', mapping: null, parsed: null };
  const listeners = [];

  /* ---------------- 유틸 ---------------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const p2 = (n) => String(n).padStart(2, '0');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  function uid(prefix) {
    const rnd = (typeof crypto !== 'undefined' && crypto.getRandomValues)
      ? Array.from(crypto.getRandomValues(new Uint8Array(6))).map((b) => b.toString(16).padStart(2, '0')).join('')
      : Math.random().toString(16).slice(2, 14);
    return (prefix || 'id') + '_' + Date.now().toString(36) + rnd.slice(0, 6);
  }

  const nowISO = () => new Date().toISOString();
  const dayKey = (d) => {
    const x = d ? new Date(d) : new Date();
    return x.getFullYear() + '-' + p2(x.getMonth() + 1) + '-' + p2(x.getDate());
  };
  const todayKey = () => dayKey();

  function fmtTime(iso) {
    const d = new Date(iso);
    return p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  function fmtDate(iso) {
    const d = new Date(iso);
    return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.';
  }
  function fmtDateShort(iso) {
    const d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }
  function fmtWhen(iso) {
    if (!iso) return '';
    const t = todayKey();
    const y = dayKey(new Date(Date.now() - 86400000));
    const k = dayKey(iso);
    if (k === t) return '오늘 ' + fmtTime(iso);
    if (k === y) return '어제 ' + fmtTime(iso);
    return fmtDateShort(iso) + ' ' + fmtTime(iso);
  }
  function weekdayKR(d) {
    return ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
  }
  const phoneDigits = (s) => String(s || '').replace(/[^0-9+]/g, '');

  // 받침 유무에 따라 조사를 골라 붙인다 (예: 두부는 / 콩이는)
  function josa(word, withFinal, noFinal) {
    const w = String(word == null ? '' : word);
    if (!w) return w;
    const ch = w.charCodeAt(w.length - 1);
    const hasFinal = (ch >= 0xAC00 && ch <= 0xD7A3) ? ((ch - 0xAC00) % 28 !== 0) : false;
    return w + (hasFinal ? withFinal : noFinal);
  }
  function phonePretty(s) {
    const d = String(s || '').replace(/[^0-9]/g, '');
    if (d.length === 11) return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
    if (d.length === 10) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
    return s || '';
  }
  const debounce = (fn, ms) => { let t; return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms || 300); }; };  const vibrate = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) {} };

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  /* ---------------- 상태 로드/저장 ---------------- */
  function blank() {
    return {
      v: VERSION,
      settings: Object.assign({}, DEFAULT_SETTINGS),
      dogs: [],
      consents: [],
      bookings: [],
      meta: { createdAt: nowISO(), updatedAt: nowISO(), seeded: false }
    };
  }

  function normalize(s) {
    if (!s || typeof s !== 'object') return blank();
    s.settings = Object.assign({}, DEFAULT_SETTINGS, s.settings || {});
    s.dogs = Array.isArray(s.dogs) ? s.dogs : [];
    s.consents = Array.isArray(s.consents) ? s.consents : [];
    s.bookings = Array.isArray(s.bookings) ? s.bookings : [];
    s.meta = Object.assign({ createdAt: nowISO(), updatedAt: nowISO(), seeded: false }, s.meta || {});
    s.dogs.forEach((d) => {
      d.id = d.id || uid('dog');
      d.log = Array.isArray(d.log) ? d.log : [];
      d.tickets = Number.isFinite(+d.tickets) ? Math.round(+d.tickets) : 0;
      d.emoji = d.emoji || DEFAULT_DOG_EMOJI[0];
      d.neutered = d.neutered || '';
    });
    s.consents.forEach((c) => { c.id = c.id || uid('con'); });
    s.bookings.forEach((b) => {
      b.id = b.id || uid('bk');
      b.category = ['hotel', 'groom', 'daycare'].indexOf(b.category) >= 0 ? b.category : 'hotel';
      b.dogName = b.dogName || '';
      b.startDate = /^\d{4}-\d{2}-\d{2}$/.test(b.startDate || '') ? b.startDate : todayKey();
      b.endDate = /^\d{4}-\d{2}-\d{2}$/.test(b.endDate || '') ? b.endDate : b.startDate;
      if (b.endDate < b.startDate) b.endDate = b.startDate;
      b.totalAmount = Math.max(0, Math.round(+b.totalAmount || 0));
      b.paidAmount = Math.max(0, Math.round(+b.paidAmount || 0));
      b.memo = b.memo || '';
    });
    s.v = VERSION;
    return s;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      return normalize(JSON.parse(raw));
    } catch (e) { return null; }
  }

  function persist(silent) {
    state.meta.updatedAt = nowISO();
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      console.error('저장 실패', e);
      toast('저장 공간이 부족해요. 백업 후 정리해 주세요.', { tone: 'warn', duration: 6000 });
    }
    if (!silent) emit();
    sync.schedulePush();
  }

  function emit() { listeners.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } }); }
  function onChange(fn) { listeners.push(fn); }

  function reload() {
    const s = load();
    if (!s) return;
    state = s;
    emit();
  }

  const PINNED_SHEET = [
    { name: '팔복이', phone: '010-3584-7133' },

  function clearSamples() {
    const before = state.dogs.length;
    state.dogs = state.dogs.filter((d) => !d.sample);
    state.consents = state.consents.filter((c) => !c.sample);
    persist();
    return before - state.dogs.length;
  }

  function resetAll() {
    state = blank();
    state.meta.seeded = true; // 초기화 후 샘플이 다시 생기지 않게
    persist();
  }

  /* ---------------- 강아지/출석 계산 ---------------- */
  const dogs = () => state.dogs.filter((d) => !d.archived);
  const dogById = (id) => state.dogs.find((d) => d.id === id) || null;

  function todayEntries(dog, type) {
    const k = todayKey();
    return (dog.log || []).filter((e) => dayKey(e.at) === k && (!type || e.type === type));
  }
  const todayIn = (dog) => todayEntries(dog, 'in');
  const todayOut = (dog) => todayEntries(dog, 'out');

  function statusOf(dog) {
    const ins = todayIn(dog);
    if (!ins.length) return { key: 'none', label: '미등원', cls: '' };
    const outs = todayOut(dog);
    if (outs.length && new Date(outs[outs.length - 1].at) >= new Date(ins[ins.length - 1].at)) {
      return { key: 'out', label: '하원 ' + fmtTime(outs[outs.length - 1].at), cls: 'done' };
    }
    return { key: 'in', label: '등원 ' + fmtTime(ins[ins.length - 1].at), cls: 'done' };
  }

  function checkIn(dog) {
    const entry = { id: uid('lg'), type: 'in', at: nowISO(), n: -1 };
    dog.tickets -= 1;
    dog.log.push(entry);
    persist();
    return entry;
  }

  function checkOut(dog) {
    const entry = { id: uid('lg'), type: 'out', at: nowISO(), n: 0 };
    dog.log.push(entry);
    persist();
    return entry;
  }

  function addMonthsISO(iso, months) {
    const base = iso ? new Date(iso + 'T00:00:00') : new Date();
    const d = new Date(base.getFullYear(), base.getMonth() + (months || 1), base.getDate());
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function expiryInfo(dog) {
    if (!dog || !dog.ticketExpires || (dog.tickets || 0) <= 0) return null;
    const today = todayISO();
    const diff = Math.round((new Date(dog.ticketExpires + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000);
    if (diff < 0) return { text: '만료', cls: 'exp-over', daysLeft: diff, date: dog.ticketExpires };
    if (diff === 0) return { text: 'D-day', cls: 'exp-soon', daysLeft: 0, date: dog.ticketExpires };
    if (diff <= 7) return { text: 'D-' + diff, cls: 'exp-soon', daysLeft: diff, date: dog.ticketExpires };
    return { text: '~' + dog.ticketExpires.slice(5).replace('-', '/'), cls: 'exp-ok', daysLeft: diff, date: dog.ticketExpires };
  }

  function charge(dog, n, memo, expires) {
    const add = Math.round(Number(n) || 0);
    if (!add) return null;
    const entry = {
      id: uid('lg'), type: 'charge', at: nowISO(), n: add, memo: memo || '',
      prevExpires: dog.ticketExpires || ''
    };
    dog.tickets += add;
    if (expires !== undefined) dog.ticketExpires = expires || '';
    dog.log.push(entry);
    persist();
    return entry;
  }

  function undoTicket(dog, entryId) {
    const i = (dog.log || []).findIndex((e) => e.id === entryId);
    if (i < 0) return false;
    const entry = dog.log[i];
    if (entry.type === 'in') dog.tickets += 1;
    if (entry.type === 'charge') {
      dog.tickets -= entry.n;
      if ('prevExpires' in entry) dog.ticketExpires = entry.prevExpires || '';
    }
    dog.log.splice(i, 1);
    persist();
    return true;
  }

  function addDog(data) {
    const dog = Object.assign({
      id: uid('dog'), name: '', breed: '', guardian: '', phone: '', address: '',
      neutered: '', regNo: '', tickets: 0, ticketExpires: '', note: '', emoji: '🐶', archived: false, log: []
    }, data);
    state.dogs.unshift(dog);
    persist();
    return dog;
  }

  function updateDog(id, patch) {
    const d = dogById(id);
    if (!d) return null;
    Object.assign(d, patch);
    persist();
    return d;
  }

  function removeDog(id) {
    state.dogs = state.dogs.filter((d) => d.id !== id);
    persist();
  }

  /* ---------------- 호텔·미용·유치원 일정 (예약/미수금) ---------------- */
  const bookings = () => state.bookings;
  const bookingById = (id) => state.bookings.find((b) => b.id === id) || null;

  function addBooking(data) {
    const b = Object.assign({
      id: uid('bk'), dogId: '', dogName: '', guardian: '', phone: '',
      category: 'hotel', startDate: todayKey(), endDate: todayKey(),
      totalAmount: 0, paidAmount: 0, memo: '',
      createdAt: nowISO(), updatedAt: nowISO()
    }, data || {});
    b.startDate = b.startDate || todayKey();
    b.endDate = b.endDate || b.startDate;
    if (b.endDate < b.startDate) b.endDate = b.startDate;
    b.totalAmount = Math.max(0, Math.round(+b.totalAmount || 0));
    b.paidAmount = Math.max(0, Math.round(+b.paidAmount || 0));
    state.bookings.push(b);
    persist();
    return b;
  }

  function updateBooking(id, patch) {
    const b = bookingById(id);
    if (!b) return null;
    Object.assign(b, patch || {});
    b.totalAmount = Math.max(0, Math.round(+b.totalAmount || 0));
    b.paidAmount = Math.max(0, Math.round(+b.paidAmount || 0));
    if (!b.startDate) b.startDate = todayKey();
    if (!b.endDate || b.endDate < b.startDate) b.endDate = b.startDate;
    b.updatedAt = nowISO();
    persist();
    return b;
  }

  // 결제 반영: amount 만큼 기결제 금액을 올린다 (총액을 넘지 않게)
  function payBooking(id, amount) {
    const b = bookingById(id);
    if (!b) return null;
    const add = Math.round(+amount || 0);
    const before = b.paidAmount;
    b.paidAmount = Math.max(0, Math.min(b.totalAmount, before + add));
    b.updatedAt = nowISO();
    persist();
    return { booking: b, before, after: b.paidAmount };
  }

  function markBookingPaid(id) {
    const b = bookingById(id);
    if (!b) return null;
    const before = b.paidAmount;
    b.paidAmount = b.totalAmount;
    b.paidAt = nowISO();
    b.updatedAt = nowISO();
    persist();
    return { booking: b, before, after: b.paidAmount };
  }

  function removeBooking(id) {
    state.bookings = state.bookings.filter((b) => b.id !== id);
    persist();
  }

  /* ---------------- 동의서 ---------------- */
  function addConsent(rec) {
    const r = Object.assign({ id: uid('con'), at: nowISO() }, rec);
    state.consents.unshift(r);
    persist();
    sync.pushConsent(r);
    return r;
  }
  const consentById = (id) => state.consents.find((c) => c.id === id) || null;
  function removeConsent(id) {
    state.consents = state.consents.filter((c) => c.id !== id);
    persist();
  }

  /* ---------------- 문자 ---------------- */
  function fillTemplate(tpl, vars) {
    return String(tpl || '').replace(/\{([^}]+)\}/g, (m, k) => (vars[k] != null ? vars[k] : m));
  }

  function smsVars(dog, kind) {
    return {
      '강아지': dog.name || '우리 아이',
      '보호자': dog.guardian || '보호자',
      '남은횟수': String(dog.tickets),
      '매장': state.settings.storeName || '멍플',
      '전화': state.settings.phone || ''
    };
  }

  function smsBody(dog, kind) {
    const tpl = kind === 'out' ? state.settings.smsOutTemplate : state.settings.smsInTemplate;
    return fillTemplate(tpl, smsVars(dog));
  }

  function smsHref(phone, body) {
    const num = phoneDigits(phone);
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const q = encodeURIComponent(body).replace(/%20/g, '%20');
    // 안드로이드: sms:번호?body=...  / iOS: sms:번호&body=...
    return ios ? 'sms:' + num + '&body=' + q : 'sms:' + num + '?body=' + q;
  }

  /* ---------------- 토스트 / 시트 ---------------- */
  function toast(msg, opts) {
    opts = opts || {};
    const host = $('#toast-host');
    if (!host) return { close() {} };
    while (host.children.length >= 2) host.firstElementChild.remove();
    const el = document.createElement('div');
    el.className = 'toast' + (opts.tone ? ' toast--' + opts.tone : '');
    el.innerHTML = '<span class="toast-msg">' + esc(msg) + '</span>' +
      (opts.action ? '<button class="toast-act" type="button">' + esc(opts.action) + '</button>' : '');
    host.appendChild(el);
    requestAnimationFrame(() => el.classList.add('in'));
    let closed = false;
    const close = () => {
      if (closed) return; closed = true;
      el.classList.remove('in');
      setTimeout(() => el.remove(), 220);
      if (timer) clearTimeout(timer);
    };
    const act = el.querySelector('.toast-act');
    if (act) act.addEventListener('click', () => { close(); if (opts.onAction) opts.onAction(); });
    const timer = setTimeout(close, opts.duration || 3600);
    return { close };
  }

  let sheetOnClose = null;
  let sheetSeq = 0;                 // 늦게 도착한 닫기 정리 작업이 새 시트를 지우지 않도록
  function openSheet(html, opts) {
    opts = opts || {};
    const seq = ++sheetSeq;
    const host = $('#sheet-host');
    const body = $('#sheet-body');
    body.innerHTML = html;
    host.hidden = false;
    sheetOnClose = opts.onClose || null;
    requestAnimationFrame(() => host.classList.add('in'));
    const close = () => {
      host.classList.remove('in');
      setTimeout(() => {
        if (seq !== sheetSeq) return;      // 그 사이 새 시트가 열렸으면 건드리지 않는다
        host.hidden = true; body.innerHTML = '';
      }, 240);
      if (sheetOnClose) { const f = sheetOnClose; sheetOnClose = null; f(); }
    };
    $$('[data-sheet-close]', host).forEach((b) => b.addEventListener('click', close));
    return { close, body };
  }

  function closeSheet() {
    const host = $('#sheet-host');
    if (!host) return;
    const seq = sheetSeq;
    host.classList.remove('in');
    setTimeout(() => {
      if (seq !== sheetSeq) return;
      host.hidden = true;
      const b = $('#sheet-body');
      if (b) b.innerHTML = '';
    }, 240);
    if (sheetOnClose) { const f = sheetOnClose; sheetOnClose = null; f(); }
  }

  /**
   * 다른 기기가 올린 클라우드 본을 이 기기에 적용한다.
   * - 로컬 저장만 하고 push 예약은 하지 않는다(되올리기 반사 방지)
   * - 받은 시점의 서버 updated_at 을 meta.lastPulledAt 에 적어 둔다
   */
  function applyRemote(data, updatedAt) {
    if (!data || typeof data !== 'object') return false;
    if (!Array.isArray(data.dogs) || !data.dogs.length) return false;   // 빈 클라우드로 로컬 명단을 지우지 않는다
    const meta = Object.assign({}, state.meta, { seeded: true });
    if (updatedAt) { meta.lastPulledAt = updatedAt; meta.updatedAt = updatedAt; }
    delete meta.freshSeed;
    state = normalize({
      v: VERSION,
      settings: Object.assign({}, DEFAULT_SETTINGS, data.settings || {}),
      dogs: data.dogs,
      consents: Array.isArray(data.consents) ? data.consents : [],
      bookings: Array.isArray(data.bookings) ? data.bookings : [],
      meta
    });
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    emit();
    return true;
  }

  /* ---------------- 클라우드 (Supabase REST) ---------------- */
  const sync = (function () {
    const cfg = () => ({
      url: String(state.settings.supabaseUrl || '').trim().replace(/\/+$/, ''),
      key: String(state.settings.supabaseKey || '').trim()
    });
    const on = () => { const c = cfg(); return !!(c.url && c.key); };
    // 표(meongple_state/meongple_consents)가 아직 없는 프로젝트인지 판별
    const missingTable = (msg) => /PGRST205|Could not find the table|does not exist|42P01/i.test(String(msg || ''));
    const blocked = () => !!state.meta.cloudMissing;
    function markMissing(msg) {
      state.meta.cloudMissing = nowISO();
      state.meta.cloudError = String(msg || '').slice(0, 200);
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }
    function clearMissing() {
      if (!state.meta.cloudMissing) return;
      delete state.meta.cloudMissing;
      delete state.meta.cloudError;
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }

    function headers(extra) {
      const c = cfg();
      return Object.assign({
        'apikey': c.key,
        'Authorization': 'Bearer ' + c.key,
        'Content-Type': 'application/json'
      }, extra || {});
    }

    async function pushState(force) {
      if (!on()) return { ok: false, skipped: true };
      if (!force && blocked()) return { ok: false, blocked: true, missingTable: true };
      const c = cfg();
      const payload = {
        id: 'main',
        data: {
          settings: state.settings, dogs: state.dogs,
          consents: state.consents.filter((x) => !x.localOnly),
          bookings: state.bookings
        },
        updated_at: nowISO()
      };
      try {
        const res = await fetch(c.url + '/rest/v1/meongple_state', {
          method: 'POST',
          headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
          body: JSON.stringify([payload])
        });
        if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 160));
        state.meta.lastSync = nowISO();
        clearMissing();
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
        return { ok: true };
      } catch (e) {
        if (missingTable(e.message)) {
          markMissing(e.message);
          console.warn('클라우드 표가 아직 없어요 — 설정의 SQL을 한 번 실행해 주세요');
          return { ok: false, missingTable: true, error: e.message };
        }
        console.warn('클라우드 저장 실패', e);
        return { ok: false, error: e.message };
      }
    }

    async function pullState(force) {
      if (!on()) return { ok: false, skipped: true };
      if (!force && blocked()) return { ok: false, blocked: true, missingTable: true };
      const c = cfg();
      try {
        const res = await fetch(c.url + '/rest/v1/meongple_state?id=eq.main&select=data,updated_at', { headers: headers() });
        if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 160));
        const rows = await res.json();
        clearMissing();
        if (!rows.length) return { ok: true, empty: true };
        return { ok: true, row: rows[0] };
      } catch (e) {
        if (missingTable(e.message)) {
          markMissing(e.message);
          return { ok: false, missingTable: true, error: e.message };
        }
        return { ok: false, error: e.message };
      }
    }

    async function pushConsent(rec) {
      if (!on()) return { ok: false, skipped: true };
      const c = cfg();
      try {
        const res = await fetch(c.url + '/rest/v1/meongple_consents', {
          method: 'POST',
          headers: headers({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
          body: JSON.stringify([{ id: rec.id, data: rec, created_at: rec.at || nowISO() }])
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return { ok: true };
      } catch (e) { return { ok: false, error: e.message }; }
    }

    async function listConsents() {
      if (!on()) return { ok: false, skipped: true };
      const c = cfg();
      try {
        const res = await fetch(c.url + '/rest/v1/meongple_consents?select=id,data,created_at&order=created_at.desc&limit=200', { headers: headers() });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const rows = await res.json();
        return { ok: true, rows: rows.map((r) => r.data).filter(Boolean) };
      } catch (e) { return { ok: false, error: e.message }; }
    }

    const schedulePush = debounce(() => { if (on() && !blocked()) pushState(); }, 1200);

    return { on, cfg, blocked, pushState, pullState, pushConsent, listConsents, schedulePush };
  })();

  /* ---------------- 내보내기용 ---------------- */
  function exportJSON() {
    return JSON.stringify({
      app: 'meongple', v: VERSION, exportedAt: nowISO(),
      settings: state.settings, dogs: state.dogs, consents: state.consents, bookings: state.bookings
    }, null, 2);
  }

  function importJSON(text) {
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.dogs)) throw new Error('백업 파일 형식이 아니에요');
    state.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings || {});
    state.dogs = data.dogs.map((d) => Object.assign({ log: [], tickets: 0 }, d));
    state.consents = Array.isArray(data.consents) ? data.consents : [];
    if (Array.isArray(data.bookings)) state.bookings = data.bookings.map((b) => Object.assign({}, b));
    state = normalize(state);
    state.meta.seeded = true;
    persist();
    return { dogs: state.dogs.length, consents: state.consents.length, bookings: state.bookings.length };
  }

  return {
    get state() { return state; },
    get settings() { return state.settings; },
    get dogs() { return dogs(); },
    get allDogs() { return state.dogs; },
    get consents() { return state.consents; },
    get bookings() { return state.bookings; },
    ui,
    // 유틸
    $, $$, esc, uid, nowISO, todayKey, dayKey, fmtTime, fmtDate, fmtDateShort, fmtWhen, weekdayKR,
    addMonthsISO, expiryInfo,
    phoneDigits, phonePretty, debounce, vibrate, copyText, fillTemplate, josa,
    // 데이터
    init, reload, persist, emit, onChange, dogById, addDog, updateDog, removeDog,
    todayIn, todayOut, statusOf, checkIn, checkOut, charge, undoTicket,
    addConsent, consentById, removeConsent, clearSamples, resetAll, seedSamples,
    // 일정(호텔·미용·유치원)
    bookingById, addBooking, updateBooking, payBooking, markBookingPaid, removeBooking,
    exportJSON, importJSON, applyRemote,
    // 문자
    smsBody, smsHref,
    // UI
    toast, openSheet, closeSheet, p2,
    // 클라우드
    sync, DEFAULT_SETTINGS
  };
})();
</script>
<script>
/* ===========================================================
   importer.js — CSV(UTF-8/EUC-KR) · XLSX 읽기 + 컬럼 자동 추정
   XLSX는 브라우저 내장 DecompressionStream만으로 푼다(외부 라이브러리 없음).
   =========================================================== */
(function () {
  'use strict';
  const M = window.M;

  /* ---------- CSV ---------- */
  function decodeText(buf) {
    const bytes = new Uint8Array(buf);
    // UTF-8 BOM
    if (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
      return new TextDecoder('utf-8').decode(bytes.subarray(3));
    }
    // UTF-16 BOM
    if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes.subarray(2));
    if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes.subarray(2));

    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch (e) {
      try { return new TextDecoder('euc-kr').decode(bytes); }
      catch (e2) { return new TextDecoder('utf-8').decode(bytes); }
    }
  }

  function detectDelimiter(sample) {
    const line = sample.split(/\r?\n/).slice(0, 5).join('\n');
    const counts = { ',': 0, ';': 0, '\t': 0, '|': 0 };
    let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') inQ = !inQ;
      else if (!inQ && counts[ch] != null) counts[ch]++;
    }
    let best = ',', bestN = 0;
    Object.keys(counts).forEach((k) => { if (counts[k] > bestN) { bestN = counts[k]; best = k; } });
    return best;
  }

  function parseCSV(text) {
    const delim = detectDelimiter(text);
    const rows = [];
    let row = [], field = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (inQ) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQ = false;
        } else field += ch;
      } else if (ch === '"') {
        inQ = true;
      } else if (ch === delim) {
        row.push(field); field = '';
      } else if (ch === '\n') {
        row.push(field); field = '';
        rows.push(row); row = [];
      } else if (ch === '\r') {
        // skip
      } else field += ch;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.some((c) => String(c).trim() !== ''));
  }

  /* ---------- XLSX (zip + xml) ---------- */
  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === 'undefined') throw new Error('이 브라우저는 XLSX 압축 해제를 지원하지 않아요. CSV로 저장해서 올려주세요.');
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  }

  function readZip(bytes) {
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    // EOCD 찾기
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('xlsx 파일을 읽을 수 없어요 (zip 구조 아님)');
    const count = dv.getUint16(eocd + 10, true);
    let off = dv.getUint32(eocd + 16, true);
    const entries = {};
    const dec = new TextDecoder('utf-8');
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(off, true) !== 0x02014b50) break;
      const method = dv.getUint16(off + 10, true);
      const compSize = dv.getUint32(off + 20, true);
      const nameLen = dv.getUint16(off + 28, true);
      const extraLen = dv.getUint16(off + 30, true);
      const commentLen = dv.getUint16(off + 32, true);
      const localOff = dv.getUint32(off + 42, true);
      const name = dec.decode(bytes.subarray(off + 46, off + 46 + nameLen));
      entries[name] = { method, compSize, localOff };
      off += 46 + nameLen + extraLen + commentLen;
    }
    return {
      names: Object.keys(entries),
      async read(name) {
        const e = entries[name];
        if (!e) return null;
        const lo = e.localOff;
        if (dv.getUint32(lo, true) !== 0x04034b50) throw new Error('zip 항목 손상: ' + name);
        const nameLen = dv.getUint16(lo + 26, true);
        const extraLen = dv.getUint16(lo + 28, true);
        const start = lo + 30 + nameLen + extraLen;
        const data = bytes.subarray(start, start + (e.compSize || 0));
        if (e.method === 0) return data;
        if (e.method === 8) return await inflateRaw(data);
        throw new Error('지원하지 않는 압축 방식: ' + e.method);
      }
    };
  }

  function xmlText(s) {
    return String(s || '')
      .replace(/&#x([0-9a-fA-F]+);/g, (m, h) => String.fromCodePoint(parseInt(h, 16)))
      .replace(/&#(\d+);/g, (m, d) => String.fromCodePoint(parseInt(d, 10)))
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&amp;/g, '&');
  }

  function stripTags(xml) {
    return xmlText(String(xml).replace(/<[^>]*>/g, ''));
  }

  function colIndex(ref) {
    const m = /^([A-Z]+)/.exec(ref || '');
    if (!m) return 0;
    let n = 0;
    for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  }

  async function parseXLSX(buf) {
    const bytes = new Uint8Array(buf);
    const zip = readZip(bytes);
    const dec = new TextDecoder('utf-8');

    // 공유 문자열
    let shared = [];
    if (zip.names.indexOf('xl/sharedStrings.xml') >= 0) {
      const raw = await zip.read('xl/sharedStrings.xml');
      const xml = dec.decode(raw);
      shared = (xml.match(/<si>[\s\S]*?<\/si>/g) || []).map((si) => {
        const ts = si.match(/<t[^>]*>[\s\S]*?<\/t>/g) || [];
        return ts.map((t) => stripTags(t)).join('');
      });
    }

    // 첫 시트
    let sheetName = zip.names.filter((n) => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
    if (!sheetName) throw new Error('xlsx 안에서 시트를 찾지 못했어요');
    const sheetXml = dec.decode(await zip.read(sheetName));

    const rows = [];
    const rowMatches = sheetXml.match(/<row[^>]*>[\s\S]*?<\/row>|<row[^>]*\/>/g) || [];
    rowMatches.forEach((rowXml) => {
      const cells = rowXml.match(/<c[^>]*>[\s\S]*?<\/c>|<c[^>]*\/>/g) || [];
      const arr = [];
      cells.forEach((c) => {
        const refM = /r="([A-Z]+\d+)"/.exec(c);
        const idx = refM ? colIndex(refM[1]) : arr.length;
        const tM = /t="([^"]+)"/.exec(c);
        const type = tM ? tM[1] : 'n';
        let val = '';
        if (type === 's') {
          const vM = /<v>([\s\S]*?)<\/v>/.exec(c);
          const si = vM ? parseInt(vM[1], 10) : -1;
          val = shared[si] != null ? shared[si] : '';
        } else if (type === 'inlineStr') {
          const ts = c.match(/<t[^>]*>[\s\S]*?<\/t>/g) || [];
          val = ts.map((t) => stripTags(t)).join('');
        } else {
          const vM = /<v>([\s\S]*?)<\/v>/.exec(c);
          val = vM ? xmlText(vM[1]) : '';
        }
        arr[idx] = val;
      });
      for (let i = 0; i < arr.length; i++) if (arr[i] == null) arr[i] = '';
      if (arr.some((v) => String(v).trim() !== '')) rows.push(arr);
    });
    return rows;
  }

  /* ---------- 컬럼 자동 추정 ---------- */
  const SYNONYMS = {
    name: ['강아지이름', '반려견이름', '애견이름', '아이이름', '반려동물이름', '강아지', '반려견', '애견', '이름', 'name', 'pet', 'dog'],
    breed: ['품종', '견종', 'breed', '종류'],
    guardian: ['보호자명', '보호자', '견주', '고객명', '고객', '사장님', 'owner', 'guardian'],
    phone: ['휴대폰', '핸드폰', '연락처', '전화번호', '전화', 'phone', 'tel', 'mobile', 'hp'],
    tickets: ['잔여횟수', '남은횟수', '잔여', '남은', '횟수', '이용권', '수량', '회수', '개', 'ticket', 'count', 'remaining'],
    address: ['주소', 'address'],
    neutered: ['중성화', '중성화여부', 'neutered'],
    regNo: ['동물등록번호', '등록번호', 'regno', 'reg'],
    note: ['메모', '비고', '특이사항', '특이', 'note', 'memo']
  };

  function normHeader(h) {
    return String(h || '').replace(/\s|\/|\(|\)|\[|\]|_|-/g, '').toLowerCase();
  }

  function guessMapping(headers) {
    const map = {};
    const used = new Set();
    Object.keys(SYNONYMS).forEach((key) => {
      const syns = SYNONYMS[key];
      for (const syn of syns) {
        const i = headers.findIndex((h, idx) => !used.has(idx) && normHeader(h).indexOf(normHeader(syn)) >= 0);
        if (i >= 0) { map[key] = i; used.add(i); return; }
      }
      map[key] = -1;
    });
    // 보호자 칸이 '이름'으로 잡혔고 강아지 칸이 비었다면 강아지 칸을 다시 찾는다
    if (map.name === map.guardian) { map.guardian = -1; }
    return map;
  }

  /* ---------- 파일 파싱 ---------- */
  async function parseFile(file) {
    const name = (file.name || '').toLowerCase();
    const buf = await file.arrayBuffer();
    let rows;
    let kind;
    if (name.endsWith('.xlsx') || name.endsWith('.xlsm')) {
      rows = await parseXLSX(buf);
      kind = 'xlsx';
    } else if (name.endsWith('.xls')) {
      throw new Error('예전 .xls 형식은 지원하지 않아요. 엑셀에서 "다른 이름으로 저장 → .xlsx 또는 .csv"로 저장해 주세요.');
    } else {
      const text = decodeText(buf);
      rows = parseCSV(text);
      kind = 'csv';
    }
    rows = rows.filter((r) => r && r.some((c) => String(c == null ? '' : c).trim() !== ''));
    if (!rows.length) throw new Error('파일에 읽을 데이터가 없어요.');

    // 머리글 행 찾기: 글자가 가장 많은 상위 3줄 중 첫 줄
    let headerIdx = 0;
    for (let i = 0; i < Math.min(rows.length, 6); i++) {
      const filled = rows[i].filter((c) => String(c).trim() !== '').length;
      if (filled >= 2) { headerIdx = i; break; }
    }
    const headers = rows[headerIdx].map((h, i) => String(h).trim() || '(열 ' + (i + 1) + ')');
    const body = rows.slice(headerIdx + 1).map((r) => {
      const out = [];
      for (let i = 0; i < headers.length; i++) out[i] = r[i] == null ? '' : String(r[i]).trim();
      return out;
    });

    return {
      kind, headers, rows: body,
      mapping: guessMapping(headers),
      fileName: file.name,
      headerIdx
    };
  }

  function parseTickets(v) {
    if (v == null) return 0;
    const s = String(v).replace(/[^0-9.\-]/g, '');
    const n = parseFloat(s);
    return Number.isFinite(n) ? Math.round(n) : 0;
  }

  async function parseText(text) {
    const rows = parseCSV(text).filter((r) => r.some((c) => String(c).trim() !== ''));
    const headers = rows[0].map((h, i) => String(h).trim() || '(열 ' + (i + 1) + ')');
    return {
      kind: 'csv', headers,
      rows: rows.slice(1).map((r) => headers.map((_, i) => (r[i] == null ? '' : String(r[i]).trim()))),
      mapping: guessMapping(headers), fileName: '붙여넣은 표', headerIdx: 0
    };
  }

  M.importer = { parseFile, parseText, parseCSV, parseXLSX, guessMapping, parseTickets, decodeText };
})();
</script>
<script>
/* ===========================================================
   attendance.js — 출석·횟수권 탭
   · 고정 출석부 22마리 × 월~금 주간 출석표
   · 전체 400명은 검색으로만 (찾으면 바로 등원/하원/충전)
   =========================================================== */
(function () {
  'use strict';
  const M = window.M;
  const $ = M.$, $$ = M.$$, esc = M.esc;

  const DOW = ['월', '화', '수', '목', '금'];
  if (typeof M.ui.weekOffset !== 'number') M.ui.weekOffset = 0;

  /* ---------------- 주(週) 계산 ---------------- */
  function mondayOf(offset) {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    const w = d.getDay();                       // 0=일 … 6=토
    d.setDate(d.getDate() - (w === 0 ? 6 : w - 1) + (offset || 0) * 7);
    return d;
  }

  function weekDays(offset) {
    const mon = mondayOf(offset);
    return DOW.map((name, i) => {
      const d = new Date(mon);
      d.setDate(mon.getDate() + i);
      const key = M.dayKey(d);
      return { key, date: d, dow: name, isToday: key === M.todayKey() };
    });
  }

  const md = (d) => (d.getMonth() + 1) + '.' + M.p2(d.getDate());

  function weekTitle(days) {
    const a = days[0], b = days[4];
    return md(a.date) + '(' + a.dow + ') ~ ' + md(b.date) + '(' + b.dow + ')';
  }

  function weekName(off) {
    if (off === 0) return '이번 주';
    if (off === -1) return '지난 주';
    if (off === 1) return '다음 주';
    return off < 0 ? Math.abs(off) + '주 전' : off + '주 후';
  }

  /* ---------------- 데이터 ---------------- */
  const pinnedDogs = () => M.dogs
    .filter((d) => d.pinOrder != null && d.pinOrder < 9999)
    .sort((a, b) => a.pinOrder - b.pinOrder);

  function dayState(dog, key) {
    const es = (dog.log || [])
      .filter((e) => M.dayKey(e.at) === key && (e.type === 'in' || e.type === 'out'))
      .sort((a, b) => new Date(a.at) - new Date(b.at));
    const ins = es.filter((e) => e.type === 'in');
    const outs = es.filter((e) => e.type === 'out');
    if (!ins.length && !outs.length) return null;
    const lastIn = ins[ins.length - 1];
    const lastOut = outs[outs.length - 1];
    const done = !!(lastIn && lastOut && new Date(lastOut.at) >= new Date(lastIn.at));
    if (!lastIn) return { key: 'away', ins, outs, label: '하원 ' + M.fmtTime(lastOut.at) };
    if (done) return { key: 'done', ins, outs, label: '등원 ' + M.fmtTime(lastIn.at) + ' · 하원 ' + M.fmtTime(lastOut.at) };
    return { key: 'in', ins, outs, label: '등원 ' + M.fmtTime(lastIn.at) };
  }

  const ticketCls = (d) => (d.tickets <= 0 ? 'zero' : d.tickets <= (M.settings.lowTicketWarn || 3) ? 'low' : '');

  function searchDogs(q) {
    const needle = String(q || '').trim().toLowerCase();
    const digits = M.phoneDigits(needle);
    const list = M.dogs.filter((d) => {
      const hay = [d.name, d.guardian, d.phone, d.breed].join(' ').toLowerCase();
      if (hay.indexOf(needle) >= 0) return true;
      return digits.length >= 3 && M.phoneDigits(d.phone).indexOf(digits) >= 0;
    });
    list.sort((a, b) => {
      const pa = a.pinOrder || 9999, pb = b.pinOrder || 9999;
      if (pa !== pb) return pa - pb;
      return String(a.name).localeCompare(String(b.name), 'ko');
    });
    return list;
  }

  /* ---------------- 검색창 ---------------- */
  function searchBar() {
    return '' +
      '<div class="searchbar' + (M.ui.dogQuery ? ' has-value' : '') + '">' +
        '<span class="ic">🔍</span>' +
        '<input id="dog-search" type="search" inputmode="search" placeholder="전체 400명 · 이름·보호자·연락처 검색" value="' + esc(M.ui.dogQuery) + '" autocomplete="off">' +
        '<button class="clr" type="button" data-action="clear-search" aria-label="지우기">✕</button>' +
      '</div>';
  }

  /* ---------------- 주간 출석표 ---------------- */
  function weekCard() {
    const off = M.ui.weekOffset || 0;
    const days = weekDays(off);
    const pinned = pinnedDogs();
    const f = M.ui.dogFilter;
    let list = pinned;
    if (f === 'low') list = pinned.filter((d) => d.tickets <= (M.settings.lowTicketWarn || 3));
    if (f === 'today') list = pinned.filter((d) => M.todayIn(d).length > 0);

    const weekN = pinned.reduce((n, d) => n + days.filter((day) => {
      const st = dayState(d, day.key);
      return st && st.ins.length;
    }).length, 0);
    const todayN = pinned.filter((d) => M.todayIn(d).length > 0).length;
    const lowN = pinned.filter((d) => d.tickets <= (M.settings.lowTicketWarn || 3)).length;

    return '' +
      '<div class="pills" style="margin-top:14px">' +
        '<button class="pill ' + (f === 'all' ? 'on' : '') + '" data-filter="all">출석부 <b>' + pinned.length + '</b></button>' +
        '<button class="pill ' + (f === 'low' ? 'on' : '') + '" data-filter="low">잔여 ' + (M.settings.lowTicketWarn || 3) + '회↓ <b>' + lowN + '</b></button>' +
        '<button class="pill ' + (f === 'today' ? 'on' : '') + '" data-filter="today">오늘 출석 <b>' + todayN + '</b></button>' +
      '</div>' +
      '<div class="wk-card">' +
        '<div class="wk-head">' +
          '<button class="wk-nav" type="button" data-week="-1" aria-label="지난 주">‹</button>' +
          '<div class="wk-range">' +
            weekTitle(days) +
            '<span>' + weekName(off) + ' · 등원 ' + weekN + '회</span>' +
          '</div>' +
          '<button class="wk-nav" type="button" data-week="1" aria-label="다음 주">›</button>' +
        '</div>' +
        (off !== 0
          ? '<div class="wk-sub"><button class="wk-now" type="button" data-week="now">이번 주로</button>' +
            '<span>지난 주 기록은 보기만 됩니다</span></div>'
          : '<div class="wk-sub"><span>오늘 ' + todayN + '/' + pinned.length + '명 등원</span>' +
            '<span class="wk-dot">·</span><span>오른쪽 버튼으로 등원·하원</span></div>') +
        '<div class="wk-table">' +
          '<div class="wk-colhead">' +
            '<span class="wk-ch-name">원생 · 남은 횟수</span>' +
            days.map((d) => '<span class="wk-dow' + (d.isToday ? ' on' : '') + '">' + d.dow + '</span>').join('') +
            '<span class="wk-ch-act">' + (days.some((d) => d.isToday) ? '오늘' : '') + '</span>' +
          '</div>' +
          (list.length
            ? list.map((d) => weekRow(d, days)).join('')
            : '<div class="wk-empty">조건에 맞는 아이가 없어요</div>') +
        '</div>' +
        '<div class="wk-foot">' +
          '<span class="lg"><i class="sw in"></i>등원중</span>' +
          '<span class="lg"><i class="sw done"></i>하원완료</span>' +
          '<span class="lg">숫자 = 남은 횟수</span>' +
        '</div>' +
      '</div>' +
      '<div class="wk-tools">' +
        '<p class="wk-note">고정 출석부 ' + pinned.length + '마리 · 전체 ' + M.dogs.length + '명은 위 검색창에서 찾으세요 · 이름을 누르면 상세·수정</p>' +
        '<button class="wk-add" type="button" data-action="add-dog">＋ 원생 등록</button>' +
      '</div>';
  }

  function weekCell(dog, day) {
    const st = dayState(dog, day.key);
    const cls = ['wk-cell'];
    if (day.isToday) cls.push('is-today');
    if (!st) return '<span class="' + cls.join(' ') + '"></span>';
    cls.push(st.key === 'done' ? 'on-done' : st.key === 'in' ? 'on-in' : 'on-away');
    const glyph = st.key === 'done' ? '✓' : st.key === 'in' ? '●' : '·';
    return '<button type="button" class="' + cls.join(' ') + '" data-day="' + day.key + '" ' +
      'aria-label="' + esc(dog.name + ' ' + day.dow + '요일 ' + st.label) + '">' + glyph + '</button>';
  }

  function todayAction(dog, days) {
    if (!days.some((d) => d.isToday)) return '<span></span>';
    const st = M.statusOf(dog);
    if (st.key === 'in') return '<button class="wk-act act-out" type="button" data-action="checkout">하원</button>';
    if (st.key === 'out') return '<button class="wk-act act-done" type="button" disabled>완료</button>';
    if (dog.tickets <= 0) return '<button class="wk-act act-charge" type="button" data-action="charge">충전</button>';
    return '<button class="wk-act act-in" type="button" data-action="checkin"><b>등원</b><i>-1</i></button>';
  }

  function weekRow(dog, days) {
    const tc = ticketCls(dog);
    const exp = M.expiryInfo(dog);
    return '' +
      '<div class="wk-row' + (tc ? ' ' + tc : '') + '" data-id="' + dog.id + '">' +
        '<button class="wk-name" type="button" data-action="detail">' +
          '<b>' + esc(dog.name || '(이름 없음)') + '</b>' +
