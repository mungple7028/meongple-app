  let settingsBound = false;
  function bindSettings() {
    if (settingsBound) return;
    settingsBound = true;
    bindInputs($('#view-settings'));
  }

  function bindInputs(el) {
    el.addEventListener('input', (ev) => {
      const t = ev.target.closest('[data-set]');
      if (!t) return;
      const key = t.dataset.set;
      let v = t.value;
      if (key === 'lowTicketWarn') v = Math.max(0, Math.min(30, parseInt(v, 10) || 0));
      M.settings[key] = v;
      // 문자 문구는 입력하는 동안 미리보기만 바로 갱신
      if (key === 'smsInTemplate') { const b = $('#tpl-in', el); if (b) b.textContent = tplPreview(v, 'in'); }
      if (key === 'smsOutTemplate') { const b = $('#tpl-out', el); if (b) b.textContent = tplPreview(v, 'out'); }
    });

    el.addEventListener('change', (ev) => {
      const t = ev.target.closest('[data-set]');
      if (t) {
        M.settings[t.dataset.set] = t.value;
        M.persist();
      }
      if (ev.target.id === 'json-input') {
        const f = ev.target.files && ev.target.files[0];
        if (f) restoreJSON(f);
        ev.target.value = '';
      }
    });

    el.addEventListener('click', async (ev) => {
      const tg = ev.target.closest('[data-toggle]');
      if (tg) {
        const key = tg.dataset.toggle;
        M.settings[key] = !M.settings[key];
        tg.classList.toggle('on', M.settings[key]);
        M.persist();
        return;
      }
      const b = ev.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;

      if (act === 'reset-tpl') {
        M.settings.smsInTemplate = M.DEFAULT_SETTINGS.smsInTemplate;
        M.settings.smsOutTemplate = M.DEFAULT_SETTINGS.smsOutTemplate;
        M.persist(); render(); M.toast('기본 문구로 되돌렸어요');
      }
      if (act === 'export-csv') M.exportCustomersCSV();
      if (act === 'export-json') {
        const blob = new Blob([M.exportJSON()], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '멍플_백업_' + M.todayKey() + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        M.toast('백업 파일을 만들었어요', { tone: 'ok' });
      }
      if (act === 'import-json') { const inp = $('#json-input', el); if (inp) inp.click(); }
      if (act === 'clear-samples') {
        const n = M.clearSamples();
        M.toast(n ? '샘플 ' + n + '명을 지웠어요' : '지울 샘플이 없어요', { tone: 'ok' });
        render();
      }
      if (act === 'reset-all') {
        if (confirm('정말 모든 고객·출석기록·동의서를 지울까요?\n되돌릴 수 없습니다. 먼저 백업해 두세요.')) {
          M.resetAll();
          M.toast('초기화했어요', { tone: 'ok' });
          render();
        }
      }
      if (act === 'test-cloud') {
        if (!M.sync.on()) { M.toast('URL과 키를 먼저 넣어주세요', { tone: 'warn' }); return; }
        b.disabled = true; b.textContent = '확인 중…';
        const r = await M.sync.pullState(true);
        b.disabled = false; b.textContent = '연결 확인';
        if (r.missingTable) { M.toast('연결은 됐는데 표가 없어요 — 아래 SQL 보기를 Supabase SQL Editor에서 실행해 주세요', { tone: 'warn', duration: 9000 }); render(); return; }
        if (!r.ok) { M.toast('연결 실패: ' + (r.error || 'URL·키를 확인해 주세요'), { tone: 'warn', duration: 7000 }); return; }
        M.toast('연결 성공! 표가 준비되어 있어요', { tone: 'ok' });
        render();
      }
      if (act === 'push-cloud') {
        if (!M.sync.on()) { M.toast('URL과 키를 먼저 넣어주세요', { tone: 'warn' }); return; }
        b.disabled = true; b.textContent = '올리는 중…';
        const r = await M.sync.pushState(true);
        b.disabled = false; b.textContent = '지금 올리기';
        if (r.missingTable) { M.toast('표가 아직 없어요 — SQL 보기를 Supabase SQL Editor에서 실행해 주세요', { tone: 'warn', duration: 9000 }); render(); return; }
        M.toast(r.ok ? '클라우드에 올렸어요' : '실패: ' + (r.error || '연결 확인'), { tone: r.ok ? 'ok' : 'warn', duration: 6000 });
        if (r.ok) render();
      }
      if (act === 'show-sql') {
        const sheet = M.openSheet('' +
          '<h3>Supabase 준비하기</h3>' +
          '<p class="sheet-desc">supabase.com에서 무료 프로젝트를 만들고 <b>SQL Editor</b>에 아래를 붙여넣어 실행하세요. 그다음 Settings → API의 URL과 anon 키를 위 칸에 넣으면 끝입니다.</p>' +
          '<div class="codebox">' + esc(SQL) + '</div>' +
          '<div class="sheet-actions">' +
            '<button class="btn btn--ghost" data-q="copy">복사</button>' +
            '<button class="btn btn--primary" data-q="close" style="flex:1.2">닫기</button>' +
          '</div>'
        );
        sheet.body.addEventListener('click', async (e2) => {
          const x = e2.target.closest('[data-q]');
          if (!x) return;
          if (x.dataset.q === 'copy') { const ok = await M.copyText(SQL); M.toast(ok ? 'SQL을 복사했어요' : '복사 실패', { tone: ok ? 'ok' : 'warn' }); }
          if (x.dataset.q === 'close') sheet.close();
        });
      }
    });
  }

  function restoreJSON(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const r = M.importJSON(String(reader.result));
        M.toast('복원 완료 · 고객 ' + r.dogs + '명, 동의서 ' + r.consents + '건', { tone: 'ok', duration: 5000 });
        render();
      } catch (e) {
        M.toast('복원 실패: ' + e.message, { tone: 'warn', duration: 6000 });
      }
    };
    reader.readAsText(file);
  }

  M.renderSettings = render;
  M.bindSettings = bindSettings;
})();
</script>
<script>
/* ===========================================================
   app.js — 부팅 · 화면 전환 · 상단 요약
   =========================================================== */
(function () {
  'use strict';
  const M = window.M;
  const $ = M.$, $$ = M.$$, esc = M.esc;

  const TABS = ['attendance', 'hotel', 'customers', 'settings'];

  /* ---------------- 상단 요약 ---------------- */
  function renderTopbar() {
    const bar = $('#topbar');
    if (!bar) return;
    const all = M.dogs;
    const inN = all.filter((d) => M.todayIn(d).length > 0).length;
    const outN = all.filter((d) => M.todayOut(d).length > 0).length;
    const lowN = all.filter((d) => d.tickets <= (M.settings.lowTicketWarn || 3)).length;
    const now = new Date();

    if (M.ui.tab === 'attendance') {
      bar.innerHTML = '' +
        '<div class="hd-row">' +
          '<div class="hd-logo">🐾</div>' +
          '<div class="hd-title">' + esc(M.settings.storeName || '멍플') + ' <small>횟수권·동의서</small></div>' +
          '<div class="hd-date">' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 (' + M.weekdayKR(now) + ')<br>' +
            '<span style="opacity:.7">' + M.p2(now.getHours()) + ':' + M.p2(now.getMinutes()) + ' 기준</span></div>' +
        '</div>' +
        '<div class="hd-stats">' +
          '<div class="hd-stat ok"><b>' + inN + '</b><span>오늘 등원</span></div>' +
          '<div class="hd-stat"><b>' + outN + '</b><span>오늘 하원</span></div>' +
          '<div class="hd-stat warn"><b>' + lowN + '</b><span>잔여 ' + (M.settings.lowTicketWarn || 3) + '회↓</span></div>' +
          '<div class="hd-stat"><b>' + all.length + '</b><span>전체 원생</span></div>' +
        '</div>';
    } else if (M.ui.tab === 'hotel') {
      const s = M.hotelSummary ? M.hotelSummary() : { todayN: 0, monthN: 0, dueN: 0, dueSum: 0 };
      bar.innerHTML = '' +
        '<div class="hd-row">' +
          '<div class="hd-logo">🏨</div>' +
          '<div class="hd-title">호텔·일정 <small>' + esc(M.settings.storeName || '멍플') + '</small></div>' +
          '<div class="hd-date">' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 (' + M.weekdayKR(now) + ')</div>' +
        '</div>' +
        '<div class="hd-stats">' +
          '<div class="hd-stat ok"><b>' + s.todayN + '</b><span>오늘 일정</span></div>' +
          '<div class="hd-stat"><b>' + s.monthN + '</b><span>이번 달</span></div>' +
          '<div class="hd-stat' + (s.dueN > 0 ? ' warn' : '') + '"><b>' + s.dueN + '</b><span>미수금</span></div>' +
          '<div class="hd-stat' + (s.dueSum > 0 ? ' warn' : '') + '"><b>' + Math.round(s.dueSum).toLocaleString('ko-KR') + '</b><span>받을 돈(원)</span></div>' +
        '</div>';
    } else {
      const titles = { customers: ['👥', '고객·동의서'], settings: ['⚙️', '설정'] };
      const t = titles[M.ui.tab] || ['🐾', '멍플'];
      bar.innerHTML = '' +
        '<div class="hd-row">' +
          '<div class="hd-logo">' + t[0] + '</div>' +
          '<div class="hd-title">' + t[1] + ' <small>' + esc(M.settings.storeName || '멍플') + '</small></div>' +
          '<div class="hd-date">' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 (' + M.weekdayKR(now) + ')</div>' +
        '</div>';
    }
  }

  /* ---------------- 탭 ---------------- */
  function showTab(tab) {
    if (TABS.indexOf(tab) < 0) tab = 'attendance';
    M.ui.tab = tab;
    $$('.view').forEach((v) => v.classList.toggle('active', v.dataset.view === tab));
    $$('#tabbar .tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    renderTopbar();

    try {
      if (tab === 'attendance') M.renderAttendance();
      if (tab === 'hotel') M.renderHotel();
      if (tab === 'customers') M.renderCustomers();
      if (tab === 'settings') M.renderSettings();
    } catch (e) {
      console.error('화면 렌더 오류', e);
      const v = $('#view-' + tab);
      if (v) v.innerHTML = '<div class="empty"><div class="big">😵</div><b>화면을 그리지 못했어요</b><p>' + esc(e.message) + '</p></div>';
    }
    window.scrollTo({ top: 0, behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
    try { history.replaceState(null, '', '#tab=' + tab); } catch (e) {}
  }

  /* ---------------- 고객 화면 ---------------- */
  function bootCustomer(params) {
    $('#admin').hidden = true;
    const c = $('#customer');
    c.hidden = false;
    document.body.classList.add('customer-mode');
    M.renderCustomerConsent({
      type: params.get('type') || 'kindergarten',
      preview: params.get('preview') || '',
      n: params.get('n') || '',
      g: params.get('g') || '',
      p: params.get('p') || ''
    });
  }

  /* ---------------- 부팅 ---------------- */
  function boot() {
    M.init();

    const params = new URLSearchParams(location.search);
    if (params.get('mode') === 'consent') {
      bootCustomer(params);
    } else {
      $('#admin').hidden = false;
      // 리스너는 한 번만 (뷰 컨테이너는 innerHTML을 바꿔도 유지된다)
      M.bindAttendance($('#view-attendance'));
      M.bindHotel($('#view-hotel'));
      M.bindCustomers($('#view-customers'));
      M.bindConsentAdmin();
      M.bindSettings();

      $$('#tabbar .tab').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));

      const hashTab = (location.hash.match(/tab=([a-z]+)/) || [])[1];
      showTab(TABS.indexOf(hashTab) >= 0 ? hashTab : 'attendance');

      M.onChange(() => renderTopbar());

      // 1분마다 "오늘" 표시 갱신
      setInterval(() => { if (M.ui.tab === 'attendance' || M.ui.tab === 'hotel') renderTopbar(); }, 60000);

      // 다른 탭/창에서 저장되면(예: 보호자가 같은 브라우저에서 서명) 다시 읽는다
      window.addEventListener('storage', (e) => {
        if (e.key === 'meongple.v1') { M.reload(); showTab(M.ui.tab); }
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        const ae = document.activeElement;
        if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
        M.reload();
        showTab(M.ui.tab);
        autoPull();          // 폰으로 돌아오면 다른 기기 변경분을 바로 확인
      });

      startAutoSync();
    }

    // 서비스워커 (오프라인) — 매니페스트가 있는 모듈 앱에서만 (단일 파일 배포본은 sw.js가 없음)
    const hasManifest = !!document.querySelector('link[rel="manifest"]');
    if ('serviceWorker' in navigator && hasManifest && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW 등록 실패', e));
      });
    }

    // 클라우드가 연결돼 있으면: 새 기기(방금 설치)이거나 이 기기가 비어 있을 때 클라우드 본을 가져온다
    if (M.sync.on()) {
      const isEmptyOnThisDevice = M.allDogs.length === 0 || M.allDogs.every((d) => d.sample) || !!M.state.meta.freshSeed;
      if (isEmptyOnThisDevice) {
        M.sync.pullState(true).then((r) => {
          if (!r.ok) return;
          if (r.row && r.row.data && Array.isArray(r.row.data.dogs) && r.row.data.dogs.length) {
            M.applyRemote(r.row.data, r.row.updated_at);   // push 는 하지 않는다(반사 방지)
            showTab(M.ui.tab);
            M.toast('클라우드에서 최신 명단·일정을 불러왔어요', { tone: 'ok' });
          } else {
            // 클라우드가 비어 있으면 이 기기의 명단을 올린다
            delete M.state.meta.freshSeed;
            M.persist();
          }
        });
      }
    }
  }

  /* ---------------- 클라우드 자동 당기기 ---------------- */
  // 20초마다 + 폰 화면으로 돌아올 때, 서버가 더 최신이면 받아온다.
  // 편집 중(바텀시트 열림/입력 포커스/아직 안 올린 로컬 변경)에는 건드리지 않는다.
  const PULL_MS = Math.max(2000, Number(window.__MEONGPLE_PULL_MS) || 20000);
  const PULL_TOL = 1000;   // 기기 간 시계 오차 여유
  let pulling = false;

  const ts = (v) => Date.parse(v || '') || 0;

  function editingNow() {
    const host = $('#sheet-host');
    if (host && !host.hidden) return true;
    const ae = document.activeElement;
    return !!(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName));
  }

  function hasUnpushedChanges() {
    // 마지막 변경(updatedAt)이 마지막 업로드/다운로드보다 나중이면 = 아직 안 올린 변경
    const synced = Math.max(ts(M.state.meta.lastSync), ts(M.state.meta.lastPulledAt));
    return ts(M.state.meta.updatedAt) > synced + 300;
  }

  function serverIsNewer(updatedAt) {
    const t = ts(updatedAt);
    if (!t) return false;
    return t > Math.max(ts(M.state.meta.lastPulledAt), ts(M.state.meta.lastSync)) + PULL_TOL;
  }

  async function autoPull() {
    if (!M.sync.on() || pulling) return { skipped: true };
    if (document.visibilityState && document.visibilityState !== 'visible') return { skipped: true };
    if (editingNow()) return { skipped: 'editing' };
    if (hasUnpushedChanges()) {
      // 오래 안 올라간 변경이면(전송 실패 등) 한 번 다시 올려 본다
      if (Date.now() - ts(M.state.meta.updatedAt) > 15000) await M.sync.pushState();
      else return { skipped: 'pending' };
    }
    pulling = true;
    try {
      const r = await M.sync.pullState();
      if (!r || !r.ok || !r.row || !r.row.data) return { ok: false };
      if (!serverIsNewer(r.row.updated_at)) return { ok: true, stale: true };
      if (!M.applyRemote(r.row.data, r.row.updated_at)) return { ok: false };
      showTab(M.ui.tab);
      M.toast('다른 기기의 최신 내용을 불러왔어요', { tone: 'ok', duration: 2600 });
      return { ok: true, applied: true };
    } finally {
      pulling = false;
    }
  }

  function startAutoSync() {
    if (!M.sync.on() || !M.autoPull) return;
    setInterval(() => { autoPull(); }, PULL_MS);
  }

  M.autoPull = autoPull;
  M.autoPullMs = PULL_MS;

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
