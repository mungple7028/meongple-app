<script>
/* ===========================================================
   customers.js — 고객 목록 · 추가/수정 · 엑셀(CSV/XLSX) 가져오기·내보내기
   =========================================================== */
(function () {
  'use strict';
  const M = window.M;
  const $ = M.$, $$ = M.$$, esc = M.esc;

  const FIELDS = [
    { key: 'name', label: '강아지 이름', required: true },
    { key: 'breed', label: '품종' },
    { key: 'guardian', label: '보호자 이름' },
    { key: 'phone', label: '연락처' },
    { key: 'tickets', label: '잔여 횟수권' },
    { key: 'address', label: '주소' },
    { key: 'neutered', label: '중성화' },
    { key: 'regNo', label: '동물등록번호' },
    { key: 'note', label: '메모' }
  ];

  /* ---------------- 목록 ---------------- */
  function render() {
    const el = $('#view-customers');
    if (!el) return;
    const all = M.dogs;
    const q = M.ui.custQuery.trim().toLowerCase();
    const list = all.filter((d) => {
      if (!q) return true;
      return [d.name, d.guardian, d.phone, d.breed, M.phoneDigits(d.phone)].join(' ').toLowerCase().indexOf(q) >= 0;
    }).sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'));

    el.innerHTML = '' +
      (M.ui.parsed ? mappingCard(M.ui.parsed) : importCard()) +
      '<div class="sec-title" style="margin-top:20px">고객 목록 <span class="num">' + all.length + '명</span>' +
        '<button class="btn btn--ghost btn--sm" data-act="add" style="margin-left:auto">＋ 고객 추가</button>' +
      '</div>' +
      '<div class="searchbar" style="margin-top:8px">' +
        '<span class="ic">🔍</span>' +
        '<input id="cust-search" type="search" placeholder="이름·보호자·연락처 검색" value="' + esc(M.ui.custQuery) + '">' +
      '</div>' +
      (list.length
        ? '<div class="dog-list" style="margin-top:12px">' + list.map(rowHtml).join('') + '</div>'
        : '<div class="empty"><div class="big">👥</div><b>' + (all.length ? '검색 결과가 없어요' : '아직 고객이 없어요') + '</b><p>' + (all.length ? '다른 검색어로 찾아보세요.' : '엑셀을 올리거나 직접 추가해 주세요.') + '</p></div>') +
      '<div style="height:24px"></div>';

    const si = $('#cust-search', el);
    if (si) si.addEventListener('input', M.debounce(() => {
      M.ui.custQuery = si.value;
      render();
      const s2 = $('#cust-search');
      if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }
    }, 160));
  }

  function rowHtml(d) {
    return '' +
      '<button class="cust-row" data-act="open" data-id="' + d.id + '">' +
        '<span class="av">' + (d.emoji || '🐶') + '</span>' +
        '<span class="nm"><b>' + esc(d.name || '(이름 없음)') + (d.sample ? ' <span class="chip" style="background:#F1EEE4;color:#9A9F92">샘플</span>' : '') + '</b>' +
          '<span>' + esc(d.guardian || '-') + (d.phone ? ' · ' + esc(M.phonePretty(d.phone)) : '') + '</span></span>' +
        '<span class="tk ' + (d.tickets <= 0 ? 'zero' : d.tickets <= (M.settings.lowTicketWarn || 3) ? 'low' : '') + '"><b>' + d.tickets + '</b><span>남음</span></span>' +
      '</button>';
  }

  /* ---------------- 가져오기 카드 ---------------- */
  function importCard() {
    return '' +
      '<div class="card">' +
        '<div class="card-h"><span class="ico">📥</span><h3>엑셀로 고객 가져오기</h3><span class="sub">CSV · XLSX</span></div>' +
        '<div class="drop" id="dropzone">' +
          '<div class="big">📄</div>' +
          '<h4>티피에서 내려받은 고객 파일을 올려주세요</h4>' +
          '<p>엑셀(.xlsx) · CSV(UTF-8/EUC-KR) 모두 됩니다.<br>다음 단계에서 칸을 확인하고 가져옵니다.</p>' +
          '<button class="btn btn--primary btn--sm" data-act="pick" type="button">📂 파일 선택</button>' +
          '<button class="btn btn--ghost btn--sm" data-act="paste" type="button" style="margin-left:6px">📋 표 붙여넣기</button>' +
          '<input type="file" id="file-input" accept=".csv,.xlsx,.xlsm,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>' +
        '</div>' +
        '<p class="mini">가져온 뒤에는 <b>같은 이름+연락처</b>는 중복으로 만들지 않고 횟수권만 맞춰 넣습니다.</p>' +
      '</div>';
  }

  function mappingCard(p) {
    const rowsPreview = p.rows.slice(0, 5);
    return '' +
      '<div class="card">' +
        '<div class="card-h"><span class="ico">🧩</span><h3>칸 맞추기</h3><span class="sub">' + esc(p.fileName || '') + '</span></div>' +
        '<p style="margin-bottom:10px"><b>' + p.rows.length + '줄</b>을 읽었어요. 아래에서 어떤 칸이 무엇인지 확인해 주세요.</p>' +
        '<div class="tablewrap" style="margin-bottom:14px"><table class="tbl"><thead><tr>' +
          p.headers.map((h) => '<th>' + esc(h) + '</th>').join('') +
        '</tr></thead><tbody>' +
          rowsPreview.map((r) => '<tr>' + r.map((c) => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>' +
        '<div class="map-grid">' +
          FIELDS.map((f) => {
            const sel = p.mapping[f.key];
            return '<label>' + f.label + (f.required ? ' <span class="req">*</span>' : '') + '</label>' +
              '<select data-map="' + f.key + '">' +
                '<option value="-1">— 없음 —</option>' +
                p.headers.map((h, i) => '<option value="' + i + '"' + (sel === i ? ' selected' : '') + '>' + esc(h) + '</option>').join('') +
              '</select>';
          }).join('') +
        '</div>' +
        '<div class="sheet-actions" style="margin-top:14px">' +
          '<button class="btn btn--ghost" data-act="cancel-import">취소</button>' +
          '<button class="btn btn--primary" data-act="apply-import" style="flex:1.4">' + p.rows.length + '명 가져오기</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- 파일 처리 ---------------- */
  async function handleFile(file) {
    if (!file) return;
    M.toast('파일을 읽는 중…', { duration: 1600 });
    try {
      const parsed = await M.importer.parseFile(file);
      M.ui.parsed = parsed;
      render();
      M.toast(parsed.rows.length + '줄을 읽었어요. 칸을 확인해 주세요.', { tone: 'ok' });
    } catch (e) {
      console.error(e);
      M.toast('파일을 읽지 못했어요: ' + e.message, { tone: 'warn', duration: 7000 });
    }
  }

  function applyImport() {
    const p = M.ui.parsed;
    if (!p) return;
    if (!p.mapping || p.mapping.name == null || p.mapping.name < 0) {
      M.toast('"강아지 이름" 칸을 꼭 골라주세요', { tone: 'warn' });
      return;
    }
    const get = (row, key) => {
      const i = p.mapping[key];
      return i >= 0 && i != null ? String(row[i] == null ? '' : row[i]).trim() : '';
    };
    let added = 0, updated = 0, skipped = 0;
    const stamp = (d) => { d.importedAt = M.nowISO(); d.sample = false; };

    p.rows.forEach((row) => {
      const name = get(row, 'name');
      if (!name) { skipped++; return; }
      const phone = get(row, 'phone');
      const guardian = get(row, 'guardian');
      const existing = M.dogs.find((d) =>
        String(d.name).replace(/\s/g, '') === name.replace(/\s/g, '') &&
        (!phone || M.phoneDigits(d.phone) === M.phoneDigits(phone))
      );

      if (existing) {
        if (guardian) existing.guardian = guardian;
        if (phone) existing.phone = phone;
        if (get(row, 'breed')) existing.breed = get(row, 'breed');
        if (get(row, 'address')) existing.address = get(row, 'address');
        if (get(row, 'note')) existing.note = get(row, 'note');
        if (get(row, 'regNo')) existing.regNo = get(row, 'regNo');
        if (get(row, 'neutered')) existing.neutered = get(row, 'neutered').toUpperCase().indexOf('O') === 0 ? 'O' : 'X';
        if (p.mapping.tickets >= 0) existing.tickets = M.importer.parseTickets(get(row, 'tickets'));
        stamp(existing);
        updated++;
      } else {
        M.state.dogs.push(Object.assign({
          id: M.uid('dog'), name, breed: get(row, 'breed'), guardian, phone,
          address: get(row, 'address'), neutered: get(row, 'neutered') ? (/^o/i.test(get(row, 'neutered')) ? 'O' : 'X') : '',
          regNo: get(row, 'regNo'), tickets: M.importer.parseTickets(get(row, 'tickets')),
          note: get(row, 'note'), emoji: '🐶', archived: false, log: [], sample: false, importedAt: M.nowISO()
        }));
        added++;
      }
    });

    M.persist();
    M.ui.parsed = null;
    render();
    M.toast(added + '명 추가 · ' + updated + '명 업데이트' + (skipped ? ' · ' + skipped + '줄 건너뜀' : ''), { tone: 'ok', duration: 6000 });
  }

  /* ---------------- 내보내기 ---------------- */
  function exportCSV() {
    const head = ['강아지이름', '품종', '보호자', '연락처', '주소', '중성화', '동물등록번호', '잔여횟수', '메모'];
    const lines = [head.join(',')];
    M.dogs.forEach((d) => {
      const row = [d.name, d.breed, d.guardian, M.phonePretty(d.phone), d.address, d.neutered, d.regNo, d.tickets, d.note];
      lines.push(row.map((v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(','));
    });
    const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '멍플_고객_' + M.todayKey() + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    M.toast('고객 ' + M.dogs.length + '명을 CSV로 내려받았어요', { tone: 'ok' });
  }

  /* ---------------- 편집 시트 ---------------- */
  function openEditor(dog) {
    const isNew = !dog;
    const d = dog || { name: '', breed: '', guardian: '', phone: '', address: '', neutered: 'X', regNo: '', tickets: 0, note: '', emoji: '🐶' };
    const emojis = ['🐶', '🐕', '🐩', '🦮', '🐕‍🦺', '🐾'];
    const sheet = M.openSheet('' +
      '<h3>' + (isNew ? '🐾 고객 추가' : '✏️ ' + esc(d.name) + ' 수정') + '</h3>' +
      '<p class="sheet-desc">' + (isNew ? '강아지와 보호자 정보를 적어주세요.' : '정보를 고치고 저장하세요.') + '</p>' +
      '<div class="two-2">' +
        '<div class="field"><label>강아지 이름<span class="req">*</span></label><input class="input" id="e-name" value="' + esc(d.name) + '" placeholder="두부"></div>' +
        '<div class="field"><label>품종</label><input class="input" id="e-breed" value="' + esc(d.breed) + '" placeholder="비숑"></div>' +
      '</div>' +
      '<div class="two-2">' +
        '<div class="field"><label>보호자 이름</label><input class="input" id="e-guardian" value="' + esc(d.guardian) + '" placeholder="김민지"></div>' +
        '<div class="field"><label>연락처</label><input class="input" id="e-phone" type="tel" inputmode="tel" value="' + esc(d.phone) + '" placeholder="010-0000-0000"></div>' +
      '</div>' +
      '<div class="field"><label>주소</label><input class="input" id="e-address" value="' + esc(d.address) + '" placeholder="선택"></div>' +
      '<div class="two-2">' +
        '<div class="field"><label>중성화</label><div class="seg" id="e-neut">' +
          '<button type="button" data-v="O" class="' + (d.neutered === 'O' ? 'on' : '') + '">O</button>' +
          '<button type="button" data-v="X" class="' + (d.neutered !== 'O' ? 'on' : '') + '">X</button>' +
          '<button type="button" data-v="" class="' + (!d.neutered ? 'on' : '') + '">?</button>' +
        '</div></div>' +
        '<div class="field"><label>동물등록번호</label><input class="input" id="e-regno" value="' + esc(d.regNo) + '"></div>' +
      '</div>' +
      '<div class="two-2">' +
        '<div class="field"><label>잔여 횟수권</label><input class="input" id="e-tickets" type="number" inputmode="numeric" value="' + d.tickets + '"></div>' +
        '<div class="field"><label>아이콘</label><div class="seg" id="e-emoji">' +
          emojis.map((e) => '<button type="button" data-e="' + e + '" class="' + (d.emoji === e ? 'on' : '') + '" style="font-size:17px">' + e + '</button>').join('') +
        '</div></div>' +
      '</div>' +
      '<div class="field"><label>메모</label><input class="input" id="e-note" value="' + esc(d.note) + '" placeholder="예: 알러지, 입질 있음" maxlength="60"></div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn--ghost" data-e2="cancel">취소</button>' +
        '<button class="btn btn--primary" data-e2="save" style="flex:1.5">저장</button>' +
      '</div>' +
      (isNew ? '' : '<div class="sheet-actions" style="margin-top:8px"><button class="btn btn--danger btn--sm" data-e2="del" style="flex:1">고객 삭제</button></div>')
    );

    let emoji = d.emoji || '🐶';
    let neut = d.neutered;
    sheet.body.addEventListener('click', (ev) => {
      const nb = ev.target.closest('#e-neut button');
      if (nb) { neut = nb.dataset.v; $$('#e-neut button', sheet.body).forEach((x) => x.classList.toggle('on', x === nb)); return; }
      const eb = ev.target.closest('#e-emoji button');
      if (eb) { emoji = eb.dataset.e; $$('#e-emoji button', sheet.body).forEach((x) => x.classList.toggle('on', x === eb)); return; }
      const b = ev.target.closest('[data-e2]');
      if (!b) return;
      const v = (id) => { const el = $('#' + id, sheet.body); return el ? el.value.trim() : ''; };
      if (b.dataset.e2 === 'cancel') return sheet.close();
      if (b.dataset.e2 === 'del') {
        if (confirm(d.name + ' 고객을 삭제할까요?')) { M.removeDog(d.id); sheet.close(); render(); M.toast('삭제했어요'); }
        return;
      }
      if (b.dataset.e2 === 'save') {
        const name = v('e-name');
        if (!name) { $('#e-name', sheet.body).classList.add('err'); M.toast('강아지 이름을 적어주세요', { tone: 'warn' }); return; }
        const patch = {
          name, breed: v('e-breed'), guardian: v('e-guardian'), phone: v('e-phone'),
          address: v('e-address'), neutered: neut, regNo: v('e-regno'),
          tickets: parseInt(v('e-tickets'), 10) || 0, note: v('e-note'), emoji
        };
        if (isNew) M.addDog(patch); else M.updateDog(d.id, patch);
        sheet.close();
        render();
        M.toast(isNew ? name + ' 추가했어요' : '수정했어요', { tone: 'ok' });
      }
    });
  }

  /* ---------------- 이벤트 ---------------- */
  function bind(root) {
    root.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;
      if (act === 'add') return openEditor(null);
      if (act === 'pick') { const inp = $('#file-input', root); if (inp) inp.click(); return; }
      if (act === 'paste') return openPaste();
      if (act === 'cancel-import') { M.ui.parsed = null; render(); return; }
      if (act === 'apply-import') return applyImport();
      if (act === 'open') {
        const d = M.dogById(b.dataset.id);
        if (d) M.attendanceActions.openDetail(d);
        return;
      }
    });

    root.addEventListener('change', (ev) => {
      if (ev.target.id === 'file-input') {
        const f = ev.target.files && ev.target.files[0];
        handleFile(f);
        ev.target.value = '';
      }
      const sel = ev.target.closest('[data-map]');
      if (sel && M.ui.parsed) {
        M.ui.parsed.mapping[sel.dataset.map] = parseInt(sel.value, 10);
      }
    });

    // 드래그 앤 드롭 (데스크톱에서 편하게)
    root.addEventListener('dragover', (ev) => {
      const dz = ev.target.closest('#dropzone');
      if (dz) { ev.preventDefault(); dz.classList.add('hot'); }
    });
    root.addEventListener('dragleave', (ev) => {
      const dz = ev.target.closest('#dropzone');
      if (dz) dz.classList.remove('hot');
    });
    root.addEventListener('drop', (ev) => {
      const dz = ev.target.closest('#dropzone');
      if (!dz) return;
      ev.preventDefault(); dz.classList.remove('hot');
      const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
      handleFile(f);
    });
  }

  function openPaste() {
    const sheet = M.openSheet('' +
      '<h3>📋 표 붙여넣기</h3>' +
      '<p class="sheet-desc">엑셀에서 머리글까지 함께 복사(Ctrl+C)해서 붙여넣으세요. 탭으로 나뉜 표도 인식합니다.</p>' +
      '<textarea class="input" id="paste-box" style="min-height:150px;font-size:12.5px" placeholder="강아지이름&#9;품종&#9;보호자&#9;연락처&#9;횟수&#10;두부&#9;비숑&#9;김민지&#9;010-2345-1122&#9;8"></textarea>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn--ghost" data-p="cancel">취소</button>' +
        '<button class="btn btn--primary" data-p="ok" style="flex:1.4">읽기</button>' +
      '</div>'
    );
    sheet.body.addEventListener('click', async (ev) => {
      const b = ev.target.closest('[data-p]');
      if (!b) return;
      if (b.dataset.p === 'cancel') return sheet.close();
      const text = ($('#paste-box', sheet.body) || {}).value || '';
      if (!text.trim()) { M.toast('붙여넣은 내용이 없어요', { tone: 'warn' }); return; }
      try {
        const parsed = await M.importer.parseText(text);
        M.ui.parsed = parsed;
        sheet.close();
        render();
        M.toast(parsed.rows.length + '줄을 읽었어요', { tone: 'ok' });
      } catch (e) {
        M.toast('읽지 못했어요: ' + e.message, { tone: 'warn' });
      }
    });
  }

  M.renderCustomers = render;
  M.bindCustomers = bind;
  M.openDogEditor = openEditor;
  M.exportCustomersCSV = exportCSV;
  M.handleCustomerFile = handleFile;
})();

</script>
<script>
/* ===========================================================
   settings.js — 매장 정보 · 문자 문구 · 클라우드 · 데이터 관리
   =========================================================== */
(function () {
  'use strict';
  const M = window.M;
  const $ = M.$, $$ = M.$$, esc = M.esc;

  const SQL = [
    '-- 1) 표 만들기',
    'create table if not exists meongple_state (',
    '  id text primary key,',
    '  data jsonb,',
    '  updated_at timestamptz default now()',
    ');',
    'create table if not exists meongple_consents (',
    '  id text primary key,',
    '  data jsonb,',
    '  created_at timestamptz default now()',
    ');',
    '',
    '-- 2) 앱에서 접근 허용 (이미 있으면 오류가 나도 그냥 넘어가세요)',
    'alter table meongple_state enable row level security;',
    'alter table meongple_consents enable row level security;',
    'create policy meongple_state_all on meongple_state',
    '  for all using (true) with check (true);',
    'create policy meongple_consents_all on meongple_consents',
    '  for all using (true) with check (true);'
  ].join('\n');

  function tplPreview(tpl, kind) {
    const dog = M.dogs[0] || { name: '두부', tickets: 7 };
    return M.fillTemplate(tpl, {
      '강아지': dog.name, '보호자': dog.guardian || '보호자',
      '남은횟수': String(dog.tickets), '매장': M.settings.storeName || '멍플', '전화': M.settings.phone || ''
    });
  }

  function render() {
    const el = $('#view-settings');
    if (!el) return;
    const s = M.settings;
    const cloud = M.sync.on();
    const fileMode = location.protocol === 'file:';

    el.innerHTML = '' +
      '<div class="sec-title" style="margin-top:4px">매장 정보 <span class="num">동의서에 그대로 들어갑니다</span></div>' +
      '<div class="card" style="padding:14px">' +
        '<div class="field"><label>매장명</label><input class="input" data-set="storeName" value="' + esc(s.storeName) + '"></div>' +
        '<div class="field"><label>주소</label><input class="input" data-set="address" value="' + esc(s.address) + '"></div>' +
        '<div class="two-2">' +
          '<div class="field"><label>전화번호</label><input class="input" data-set="phone" type="tel" value="' + esc(s.phone) + '"></div>' +
          '<div class="field"><label>영업등록번호</label><input class="input" data-set="bizNo" value="' + esc(s.bizNo) + '" placeholder="000-00-00000"></div>' +
        '</div>' +
        '<div class="field" style="margin-bottom:0"><label>대표자</label><input class="input" data-set="ownerName" value="' + esc(s.ownerName) + '"></div>' +
      '</div>' +

      '<div class="sec-title">문자 알림 문구</div>' +
      '<div class="card" style="padding:14px">' +
        '<div class="field"><label>등원 문자 <span style="color:var(--muted);font-weight:600">(횟수 -1회)</span></label>' +
          '<textarea class="input" data-set="smsInTemplate" style="min-height:66px">' + esc(s.smsInTemplate) + '</textarea></div>' +
        '<div class="bubble" id="tpl-in" style="font-size:12px;margin-bottom:14px">' + esc(tplPreview(s.smsInTemplate, 'in')) + '</div>' +
        '<div class="field"><label>하원 문자 <span style="color:var(--muted);font-weight:600">(횟수 차감 없음)</span></label>' +
          '<textarea class="input" data-set="smsOutTemplate" style="min-height:66px">' + esc(s.smsOutTemplate) + '</textarea></div>' +
        '<div class="bubble" id="tpl-out" style="font-size:12px">' + esc(tplPreview(s.smsOutTemplate, 'out')) + '</div>' +
        '<p class="mini">쓸 수 있는 말: <b>{강아지}</b> <b>{보호자}</b> <b>{남은횟수}</b> <b>{매장}</b> <b>{전화}</b></p>' +
        '<div class="set-row" style="margin-top:6px">' +
          '<div class="lab"><b>처리하자마자 문자앱 열기</b><span>끄면 결과창에서 "문자 보내기"를 눌렀을 때만 열립니다.</span></div>' +
          '<button class="switch ' + (s.autoOpenSms ? 'on' : '') + '" data-toggle="autoOpenSms" aria-label="자동 문자"></button>' +
        '</div>' +
        '<div class="set-row" style="border-bottom:0">' +
          '<div class="lab"><b>잔여 알림 기준</b><span>이 횟수 이하면 목록에서 핑크색으로 표시합니다.</span></div>' +
          '<input class="input" data-set="lowTicketWarn" type="number" min="0" max="30" value="' + s.lowTicketWarn + '" style="width:74px;text-align:center">' +
        '</div>' +
        '<button class="btn btn--ghost btn--sm" data-act="reset-tpl" style="width:100%;margin-top:6px">기본 문구로 되돌리기</button>' +
      '</div>' +

      '<div class="sec-title">클라우드 동기화 <span class="num">선택</span></div>' +
      '<div class="card" style="padding:14px">' +
        '<div class="card-h" style="margin-bottom:6px"><span class="ico">☁️</span><h3>Supabase 연결</h3>' +
          '<span class="sub">' + (cloud ? '<span class="badge-ok">연결됨</span>' : '<span class="badge-warn">미연결</span>') + '</span></div>' +
        '<p style="margin-bottom:10px">연결하면 ① 보호자가 <b>자기 폰에서 서명한 동의서</b>가 매장 앱으로 자동으로 모이고, ② 남편 폰·집 컴퓨터에서도 같은 고객 목록을 볼 수 있어요. 무료 플랜으로 충분합니다.</p>' +
        '<div class="field"><label>Project URL</label><input class="input" data-set="supabaseUrl" value="' + esc(s.supabaseUrl) + '" placeholder="https://xxxx.supabase.co" inputmode="url" autocapitalize="off" spellcheck="false"></div>' +
        '<div class="field"><label>anon public key</label><input class="input" data-set="supabaseKey" value="' + esc(s.supabaseKey) + '" placeholder="eyJhbGciOi..." autocapitalize="off" spellcheck="false"></div>' +
        '<div class="sheet-actions" style="margin-top:2px">' +
          '<button class="btn btn--ghost" data-act="test-cloud">연결 확인</button>' +
          '<button class="btn btn--primary" data-act="push-cloud" style="flex:1.2">지금 올리기</button>' +
        '</div>' +
        '<button class="btn btn--ghost btn--sm" data-act="show-sql" style="width:100%;margin-top:8px">Supabase에 붙여넣을 SQL 보기</button>' +
        '<p class="mini">※ anon 키는 앱 안에 들어가는 공개 키입니다. 표에 들어가는 고객 연락처가 걱정되면 Supabase에서 이 앱 전용 프로젝트를 따로 만들어 쓰세요.</p>' +
      '</div>' +

      '<div class="sec-title">데이터</div>' +
      '<div class="card" style="padding:6px 14px">' +
        '<div class="set-row"><div class="lab"><b>고객 명단 CSV 내려받기</b><span>엑셀에서 바로 열립니다 (UTF-8).</span></div>' +
          '<button class="btn btn--ghost btn--sm" data-act="export-csv">내려받기</button></div>' +
        '<div class="set-row"><div class="lab"><b>전체 백업 (JSON)</b><span>고객·출석기록·동의서·설정 전부. 폰을 바꿀 때 이 파일로 복원하세요.</span></div>' +
          '<button class="btn btn--ghost btn--sm" data-act="export-json">백업</button></div>' +
        '<div class="set-row"><div class="lab"><b>백업 복원</b><span>백업 파일을 올리면 그대로 되살립니다. (현재 데이터는 덮어씀)</span></div>' +
          '<button class="btn btn--ghost btn--sm" data-act="import-json">복원</button>' +
          '<input type="file" id="json-input" accept=".json,application/json" hidden></div>' +
        '<div class="set-row" style="border-bottom:0"><div class="lab"><b>샘플 고객 지우기</b><span>연습용 두부·예티·팥빵이·루이를 한 번에 삭제합니다.</span></div>' +
          '<button class="btn btn--ghost btn--sm" data-act="clear-samples">샘플 정리</button></div>' +
      '</div>' +

      '<div class="danger-zone">' +
        '<button class="btn btn--danger btn--sm" data-act="reset-all" style="width:100%">모든 데이터 초기화</button>' +
      '</div>' +

      '<div class="sec-title">앱 정보</div>' +
      '<div class="card" style="padding:14px">' +
        '<dl class="kv" style="margin:0">' +
          '<dt>버전</dt><dd>1.0 (로컬 저장)</dd>' +
          '<dt>고객</dt><dd>' + M.dogs.length + '명</dd>' +
          '<dt>동의서</dt><dd>' + M.consents.length + '건</dd>' +
          '<dt>바로가기 주소</dt><dd style="font-size:11px">' + esc(location.protocol === 'file:' ? '파일로 열림' : location.host) + '</dd>' +
        '</dl>' +
        (fileMode ? '<p class="mini" style="color:var(--coral)">⚠️ 지금은 파일로 열려 있어 동의서 링크를 보낼 수 없어요. 호스팅(무료) 후 주소로 열어주세요.</p>' : '') +
        '<p class="mini">📱 폰 홈화면에 앱처럼 설치: 브라우저 메뉴 → <b>홈 화면에 추가</b>. 인터넷이 없어도 열립니다.</p>' +
      '</div>' +
      '<div style="height:30px"></div>';
  }

  let settingsBound = false;
  function bindSettings() {
    if (settingsBound) return;
    settingsBound = true;
    bindInputs($('#view-settings'));
  }

  function bindInputs(el) {
    el.addEventListener('input', (ev) => {
      const t = ev.target.closest('[data-set]');
      if (!t) return;
      const key = t.dataset.set;
      let v = t.value;
      if (key === 'lowTicketWarn') v = Math.max(0, Math.min(30, parseInt(v, 10) || 0));
      M.settings[key] = v;
      // 문자 문구는 입력하는 동안 미리보기만 바로 갱신
      if (key === 'smsInTemplate') { const b = $('#tpl-in', el); if (b) b.textContent = tplPreview(v, 'in'); }
      if (key === 'smsOutTemplate') { const b = $('#tpl-out', el); if (b) b.textContent = tplPreview(v, 'out'); }
    });

    el.addEventListener('change', (ev) => {
      const t = ev.target.closest('[data-set]');
      if (t) {
        M.settings[t.dataset.set] = t.value;
        M.persist();
      }
      if (ev.target.id === 'json-input') {
        const f = ev.target.files && ev.target.files[0];
        if (f) restoreJSON(f);
        ev.target.value = '';
      }
    });

    el.addEventListener('click', async (ev) => {
      const tg = ev.target.closest('[data-toggle]');
      if (tg) {
        const key = tg.dataset.toggle;
        M.settings[key] = !M.settings[key];
        tg.classList.toggle('on', M.settings[key]);
        M.persist();
        return;
      }
      const b = ev.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;

      if (act === 'reset-tpl') {
        M.settings.smsInTemplate = M.DEFAULT_SETTINGS.smsInTemplate;
        M.settings.smsOutTemplate = M.DEFAULT_SETTINGS.smsOutTemplate;
        M.persist(); render(); M.toast('기본 문구로 되돌렸어요');
      }
      if (act === 'export-csv') M.exportCustomersCSV();
      if (act === 'export-json') {
        const blob = new Blob([M.exportJSON()], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '멍플_백업_' + M.todayKey() + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        M.toast('백업 파일을 만들었어요', { tone: 'ok' });
      }
      if (act === 'import-json') { const inp = $('#json-input', el); if (inp) inp.click(); }
      if (act === 'clear-samples') {
        const n = M.clearSamples();
        M.toast(n ? '샘플 ' + n + '명을 지웠어요' : '지울 샘플이 없어요', { tone: 'ok' });
        render();
      }
      if (act === 'reset-all') {
        if (confirm('정말 모든 고객·출석기록·동의서를 지울까요?\n되돌릴 수 없습니다. 먼저 백업해 두세요.')) {
          M.resetAll();
          M.toast('초기화했어요', { tone: 'ok' });
          render();
        }
      }
      if (act === 'test-cloud') {
        if (!M.sync.on()) { M.toast('URL과 키를 먼저 넣어주세요', { tone: 'warn' }); return; }
        b.disabled = true; b.textContent = '확인 중…';
        const r = await M.sync.pullState();
        b.disabled = false; b.textContent = '연결 확인';
        if (!r.ok) { M.toast('연결 실패: ' + (r.error || 'URL·키를 확인해 주세요'), { tone: 'warn', duration: 7000 }); return; }
        M.toast('연결 성공! 표가 준비되어 있어요', { tone: 'ok' });
      }
      if (act === 'push-cloud') {
        if (!M.sync.on()) { M.toast('URL과 키를 먼저 넣어주세요', { tone: 'warn' }); return; }
        b.disabled = true; b.textContent = '올리는 중…';
        const r = await M.sync.pushState();
        b.disabled = false; b.textContent = '지금 올리기';
        M.toast(r.ok ? '클라우드에 올렸어요' : '실패: ' + (r.error || '연결 확인'), { tone: r.ok ? 'ok' : 'warn', duration: 6000 });
      }
      if (act === 'show-sql') {
        const sheet = M.openSheet('' +
          '<h3>Supabase 준비하기</h3>' +
          '<p class="sheet-desc">supabase.com에서 무료 프로젝트를 만들고 <b>SQL Editor</b>에 아래를 붙여넣어 실행하세요. 그다음 Settings → API의 URL과 anon 키를 위 칸에 넣으면 끝입니다.</p>' +
          '<div class="codebox">' + esc(SQL) + '</div>' +
          '<div class="sheet-actions">' +
            '<button class="btn btn--ghost" data-q="copy">복사</button>' +
            '<button class="btn btn--primary" data-q="close" style="flex:1.2">닫기</button>' +
          '</div>'
        );
        sheet.body.addEventListener('click', async (e2) => {
          const x = e2.target.closest('[data-q]');
          if (!x) return;
          if (x.dataset.q === 'copy') { const ok = await M.copyText(SQL); M.toast(ok ? 'SQL을 복사했어요' : '복사 실패', { tone: ok ? 'ok' : 'warn' }); }
          if (x.dataset.q === 'close') sheet.close();
        });
      }
    });
  }

  function restoreJSON(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const r = M.importJSON(String(reader.result));
        M.toast('복원 완료 · 고객 ' + r.dogs + '명, 동의서 ' + r.consents + '건', { tone: 'ok', duration: 5000 });
        render();
      } catch (e) {
        M.toast('복원 실패: ' + e.message, { tone: 'warn', duration: 6000 });
      }
    };
    reader.readAsText(file);
  }

  M.renderSettings = render;
  M.bindSettings = bindSettings;
})();

</script>
<script>
/* ===========================================================
   app.js — 부팅 · 화면 전환 · 상단 요약
   =========================================================== */
(function () {
  'use strict';
  const M = window.M;
  const $ = M.$, $$ = M.$$, esc = M.esc;

  const TABS = ['attendance', 'consent', 'customers', 'settings'];

  /* ---------------- 상단 요약 ---------------- */
  function renderTopbar() {
    const bar = $('#topbar');
    if (!bar) return;
    const all = M.dogs;
    const inN = all.filter((d) => M.todayIn(d).length > 0).length;
    const outN = all.filter((d) => M.todayOut(d).length > 0).length;
    const lowN = all.filter((d) => d.tickets <= (M.settings.lowTicketWarn || 3)).length;
    const now = new Date();

    if (M.ui.tab === 'attendance') {
      bar.innerHTML = '' +
        '<div class="hd-row">' +
          '<div class="hd-logo">🐾</div>' +
          '<div class="hd-title">' + esc(M.settings.storeName || '멍플') + ' <small>횟수권·동의서</small></div>' +
          '<div class="hd-date">' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 (' + M.weekdayKR(now) + ')<br>' +
            '<span style="opacity:.7">' + M.p2(now.getHours()) + ':' + M.p2(now.getMinutes()) + ' 기준</span></div>' +
        '</div>' +
        '<div class="hd-stats">' +
          '<div class="hd-stat ok"><b>' + inN + '</b><span>오늘 등원</span></div>' +
          '<div class="hd-stat"><b>' + outN + '</b><span>오늘 하원</span></div>' +
          '<div class="hd-stat warn"><b>' + lowN + '</b><span>잔여 ' + (M.settings.lowTicketWarn || 3) + '회↓</span></div>' +
          '<div class="hd-stat"><b>' + all.length + '</b><span>전체 원생</span></div>' +
        '</div>';
    } else {
      const titles = { consent: ['동의서'], customers: ['고객·엑셀'], settings: ['설정'] };
      const t = ['🐾'].concat(titles[M.ui.tab] || ['멍플']);
      bar.innerHTML = '' +
        '<div class="hd-row">' +
          '<div class="hd-logo">' + t[0] + '</div>' +
          '<div class="hd-title">' + t[1] + ' <small>' + esc(M.settings.storeName || '멍플') + '</small></div>' +
          '<div class="hd-date">' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 (' + M.weekdayKR(now) + ')</div>' +
        '</div>';
    }
  }

  /* ---------------- 탭 ---------------- */
  function showTab(tab) {
    if (TABS.indexOf(tab) < 0) tab = 'attendance';
    M.ui.tab = tab;
    $$('.view').forEach((v) => v.classList.toggle('active', v.dataset.view === tab));
    $$('#tabbar .tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    renderTopbar();

    try {
      if (tab === 'attendance') M.renderAttendance();
      if (tab === 'consent') M.renderConsentAdmin();
      if (tab === 'customers') M.renderCustomers();
      if (tab === 'settings') M.renderSettings();
    } catch (e) {
      console.error('화면 렌더 오류', e);
      const v = $('#view-' + tab);
      if (v) v.innerHTML = '<div class="empty"><div class="big">😵</div><b>화면을 그리지 못했어요</b><p>' + esc(e.message) + '</p></div>';
    }
    window.scrollTo({ top: 0, behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
    try { history.replaceState(null, '', '#tab=' + tab); } catch (e) {}
  }

  /* ---------------- 고객 화면 ---------------- */
  function bootCustomer(params) {
    $('#admin').hidden = true;
    const c = $('#customer');
    c.hidden = false;
    document.body.classList.add('customer-mode');
    M.renderCustomerConsent({
      type: params.get('type') || 'kindergarten',
      preview: params.get('preview') || '',
      n: params.get('n') || '',
      g: params.get('g') || '',
      p: params.get('p') || ''
    });
  }

  /* ---------------- 부팅 ---------------- */
  function boot() {
    M.init();

    const params = new URLSearchParams(location.search);
    if (params.get('mode') === 'consent') {
      bootCustomer(params);
    } else {
      $('#admin').hidden = false;
      // 리스너는 한 번만 (뷰 컨테이너는 innerHTML을 바꿔도 유지된다)
      M.bindAttendance($('#view-attendance'));
      M.bindConsentAdmin();
      M.bindCustomers($('#view-customers'));
      M.bindSettings();

      $$('#tabbar .tab').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));

      const hashTab = (location.hash.match(/tab=([a-z]+)/) || [])[1];
      showTab(TABS.indexOf(hashTab) >= 0 ? hashTab : 'attendance');

      M.onChange(() => renderTopbar());

      // 1분마다 "오늘" 표시 갱신
      setInterval(() => { if (M.ui.tab === 'attendance') renderTopbar(); }, 60000);

      // 다른 탭/창에서 저장되면(예: 보호자가 같은 브라우저에서 서명) 다시 읽는다
      window.addEventListener('storage', (e) => {
        if (e.key === 'meongple.v1') { M.reload(); showTab(M.ui.tab); }
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        const ae = document.activeElement;
        if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
        M.reload();
        showTab(M.ui.tab);
      });
    }

    // 서비스워커 (오프라인)
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW 등록 실패', e));
      });
    }

    // 클라우드가 연결돼 있고 이 기기가 비어 있으면 클라우드 본을 가져온다
    if (M.sync.on()) {
      const isEmptyOnThisDevice = M.allDogs.length === 0 || M.allDogs.every((d) => d.sample);
      if (isEmptyOnThisDevice) {
        M.sync.pullState().then((r) => {
          if (r.ok && r.row && r.row.data && Array.isArray(r.row.data.dogs) && r.row.data.dogs.length) {
            M.state.settings = Object.assign({}, M.DEFAULT_SETTINGS, M.state.settings, r.row.data.settings || {});
            M.state.dogs = r.row.data.dogs;
            M.state.consents = r.row.data.consents || [];
            M.state.meta.seeded = true;
            M.persist();
            showTab(M.ui.tab);
            M.toast('클라우드에서 최신 명단을 불러왔어요', { tone: 'ok' });
          }
        });
      }
    }
  }

  document.addEventListener('DOMContentLoaded', boot);
})();

</script>
</body>
</html>
